//#region [JS-12] TEXT INSERTION HELPERS
function getPos() { return { s: editor.selectionStart, e: editor.selectionEnd }; }
function setRange(s, e) {
  editor.selectionStart = s;
  editor.selectionEnd = e;
  editor.focus();
}
function ins(text, lineStart) {
  const { s } = getPos();
  if (lineStart) {
    const val = editor.value;
    const ls = val.lastIndexOf('\n', s - 1) + 1;
    editor.setSelectionRange(ls, ls);
  }
  editor.focus();
  document.execCommand('insertText', false, text);
  markDirty();
  triggerAutoSave();
}
function wrap(mark) {
  const { s, e } = getPos();
  const sel = editor.value.slice(s, e) || (isJa ? '文字' : 'text');
  const rep = mark + sel + mark;
  editor.focus();
  document.execCommand('insertText', false, rep);
  setRange(s + mark.length, s + mark.length + sel.length);
  markDirty();
  triggerAutoSave();
}
function insBlock(before, after) {
  const { s, e } = getPos();
  const sel = editor.value.slice(s, e);
  const rep = before + sel + after;
  editor.focus();
  document.execCommand('insertText', false, rep);
  setRange(s + before.length, s + before.length + sel.length);
  markDirty();
  triggerAutoSave();
}
function insertLink() {
  const { s, e } = getPos();
  const sel = editor.value.slice(s, e) || T.insertLink;
  const rep = `[${sel}](URL)`;
  editor.focus();
  document.execCommand('insertText', false, rep);
  setRange(s + 1, s + 1 + sel.length);
  markDirty();
  triggerAutoSave();
}
function insertTable() {
  editor.focus();
  document.execCommand('insertText', false, T.tableSnippet);
  markDirty();
  triggerAutoSave();
}

//#region [JS-13] WORD IMPORT (MAMMOTH + TURNDOWN)
const WORD_MAX_BYTES = 10 * 1024 * 1024;

function triggerWordImport() {
  closeMenus();
  if (isDirty && editor.value.trim() !== '' && editor.value !== T.defaultMd) {
    if (!confirm(T.confirmWordImport || T.confirmNew)) return;
  }
  document.getElementById('word-input').click();
}

document.getElementById('word-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';

  if (file.size > WORD_MAX_BYTES) { alert(T.errSize); return; }
  if (!navigator.onLine && (!window.mammoth || !window.TurndownService)) { alert(T.errOffline); return; }

  try {
    showLoader(T.loadingWordLibs);
    const arrayBuffer = await file.arrayBuffer();

    showLoader(T.loadingWordParse);
    const sandboxResult = await convertWordInSandbox(arrayBuffer);
    const md = sandboxResult.markdown || '';
    const mammothMessages = Array.isArray(sandboxResult.messages) ? sandboxResult.messages : [];

    showLoader(T.loadingWordConvert);
    if (!md || !md.trim()) throw new Error('Converted markdown is empty.');

    await saveToHistoryList(filenameInput.value, editor.value); // 変換前に今の状態を履歴へ
    editor.value = md;
    filenameInput.value = file.name.replace(/\.docx$/i, '.md');
    fileHandle = null;

    update();
    markDirty();
    triggerAutoSave();
    if (spellEnabled) runSpellCheck();

    hideLoader();
    toast(mammothMessages.length > 0 ? T.warnMammoth : T.importSuccess);
  } catch (error) {
    console.error('Word Import Error:', error);
    hideLoader();
    if (/cdn|load|script|library/i.test(String(error?.message || '')) || /Failed to fetch/i.test(String(error?.message || ''))) {
      alert(T.errLibLoad);
    } else {
      alert(`${T.errImport}\n${error?.message || ''}`.trim());
    }
  }
});

const WORD_IMPORT_SANDBOX_TIMEOUT_MS = 60000;
function getWordImportSandboxSrcdoc() {
  const runner = function () {
    const WORD_SANITIZE_CONFIG = Object.freeze({
      ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','p','br','hr','strong','b','em','i','s','del','code','pre','blockquote','ul','ol','li','table','thead','tbody','tr','th','td','a','img','span','sup','sub'],
      ALLOWED_ATTR: ['href','title','alt','src','class','colspan','rowspan','align'],
      ALLOW_DATA_ATTR: false,
      FORBID_TAGS: ['script','style','iframe','object','embed','form','meta','link','base','svg','math'],
      FORBID_ATTR: ['style','srcset','onerror','onclick','onload','onmouseover','onfocus'],
      KEEP_CONTENT: true
    });

    function normalizeInlineText(str) {
      return String(str || '').replace(/\u00a0/g, ' ').replace(/[ \t\r\n]+/g, ' ').trim();
    }

    function sanitizeWordHtml(html) {
      if (!self.DOMPurify) throw new Error('DOMPurify is unavailable in sandbox.');
      DOMPurify.addHook('afterSanitizeAttributes', (node) => {
        if (!node || !node.tagName) return;
        const tag = node.tagName.toLowerCase();
        if (tag === 'a') {
          const href = node.getAttribute('href') || '';
          if (/^javascript:/i.test(href)) node.removeAttribute('href');
        }
        if (tag === 'img') {
          node.removeAttribute('src');
          node.removeAttribute('srcset');
        }
      });
      return DOMPurify.sanitize(String(html || ''), WORD_SANITIZE_CONFIG);
    }

    function preprocessWordHtml(html, isJa) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      replaceTextboxesAndShapes(doc, isJa);
      // replaceComplexTables(doc, isJa); // 表の再現性を保つために無効化
      extractAndAppendFootnotes(doc, isJa);
      normalizeImages(doc, isJa);
      normalizeLinks(doc);
      normalizeLineBreakHints(doc);
      return doc;
    }

    function replaceTextboxesAndShapes(doc, isJa) {
      const selectors = ['div[class*="textbox"]', 'div[class*="shape"]', 'v\\:textbox', 'w\\:txbxContent'];
      doc.querySelectorAll(selectors.join(',')).forEach((node) => {
        const text = normalizeInlineText(node.textContent || '');
        const placeholder = text ? `\n\n[${isJa ? 'テキストボックス' : 'Textbox'}: ${text}]\n\n` : `\n\n[${isJa ? '図形またはテキストボックス' : 'Shape or textbox'}]\n\n`;
        node.replaceWith(doc.createTextNode(placeholder));
      });
    }

    function replaceComplexTables(doc, isJa) {
      Array.from(doc.querySelectorAll('table')).forEach((table) => {
        if (isComplexTable(table)) {
          const replacement = tableToPlainText(table, isJa);
          table.replaceWith(doc.createTextNode(`\n\n${replacement}\n\n`));
        }
      });
    }

    function isComplexTable(table) {
      if (!table) return true;
      if (table.querySelector('table')) return true;
      if (table.querySelector('[rowspan], [colspan]')) return true;
      const rows = Array.from(table.querySelectorAll('tr'));
      if (rows.length === 0) return true;
      const counts = rows.map((tr) => Array.from(tr.children).filter((el) => /^(TD|TH)$/i.test(el.tagName)).length);
      if (new Set(counts).size !== 1) return true;
      const cells = Array.from(table.querySelectorAll('th, td'));
      for (const cell of cells) {
        if (cell.querySelector('img, table')) return true;
        if (cell.querySelectorAll('p, div, ul, ol, li, blockquote, h1, h2, h3, h4, h5, h6').length > 1) return true;
        if (cell.querySelectorAll('br').length > 1) return true;
        if (normalizeInlineText(cell.textContent || '').length > 200) return true;
      }
      return false;
    }

    function tableToPlainText(table, isJa) {
      const rows = Array.from(table.querySelectorAll('tr'));
      const lines = [`[${isJa ? '複雑な表をテキスト化' : 'Complex table flattened'}]`];
      rows.forEach((tr, rowIndex) => {
        const cells = Array.from(tr.children).filter((el) => /^(TD|TH)$/i.test(el.tagName));
        const parts = cells.map((cell, colIndex) => {
          const label = rowIndex === 0 && cell.tagName.toLowerCase() === 'th' ? `${isJa ? '見出し' : 'Header'}${colIndex + 1}` : `${isJa ? '列' : 'Col'}${colIndex + 1}`;
          return `${label}: ${normalizeInlineText(cell.textContent || '') || '-'}`;
        });
        if (parts.length) lines.push(parts.join(' / '));
      });
      return lines.join('\n');
    }

    function extractAndAppendFootnotes(doc, isJa) {
      const candidates = Array.from(doc.querySelectorAll('ol li[id*="footnote"], ol li[id*="note"], aside, section.footnotes li, div.footnotes li'));
      if (!candidates.length) return;
      const notes = [];
      candidates.forEach((node, idx) => {
        const text = normalizeInlineText(node.textContent || '');
        if (text) notes.push(`${idx + 1}. ${text}`);
        node.remove();
      });
      if (!notes.length) return;
      const section = doc.createElement('section');
      const h2 = doc.createElement('h2');
      h2.textContent = isJa ? '注記' : 'Notes';
      const p = doc.createElement('p');
      p.innerHTML = notes.map((n) => n.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')).join('<br>');
      section.appendChild(h2);
      section.appendChild(p);
      doc.body.appendChild(section);
    }

    function normalizeImages(doc, isJa) {
      doc.querySelectorAll('img').forEach((img) => {
        const alt = normalizeInlineText(img.getAttribute('alt') || '');
        if (!alt) img.setAttribute('alt', isJa ? '画像' : 'Image');
        img.removeAttribute('src');
        img.removeAttribute('srcset');
      });
    }

    function normalizeLinks(doc) {
      doc.querySelectorAll('a').forEach((a) => {
        const href = a.getAttribute('href') || '';
        if (!href || /^#/.test(href)) return;
        const txt = normalizeInlineText(a.textContent || '');
        if (!txt) a.textContent = href;
      });
    }

    function normalizeLineBreakHints(doc) {
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);
      textNodes.forEach((node) => { node.textContent = node.textContent.replace(/[ \t]+\n/g, '\n'); });
    }

    function convertDomToMarkdown(doc, isJa) {
      const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced', bulletListMarker: '-', emDelimiter: '*', strongDelimiter: '**' });
      if (self.turndownPluginGfm && self.turndownPluginGfm.gfm) turndownService.use(self.turndownPluginGfm.gfm);
      turndownService.addRule('images', {
        filter: 'img',
        replacement: function (_content, node) {
          const alt = normalizeInlineText(node.getAttribute('alt') || '');
          const tag = isJa ? '画像' : 'Image';
          return alt && alt !== tag ? `[${tag}: ${alt}]` : `[${tag}]`;
        }
      });
      turndownService.addRule('lineBreak', { filter: 'br', replacement: function () { return '  \n'; } });
      turndownService.addRule('headingsSpacing', {
        filter: function (node) { return /^H[1-6]$/.test(node.nodeName); },
        replacement: function (content, node) {
          const hLevel = Number(node.nodeName.charAt(1));
          const hashes = '#'.repeat(hLevel);
          const text = normalizeInlineText(content || '');
          return `\n\n${hashes} ${text}\n\n`;
        }
      });
      turndownService.addRule('divAsBlock', { filter: 'div', replacement: function (content) { const txt = (content || '').trim(); return txt ? `\n\n${txt}\n\n` : '\n'; } });
      return postProcessImportedMarkdown(turndownService.turndown(doc.body.innerHTML));
    }

    function postProcessImportedMarkdown(md) {
      if (!md) return '';
      let out = md.normalize('NFC').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      out = out.replace(/[ \t]+$/gm, '');
      out = out.replace(/\n{3,}/g, '\n\n');
      out = out.replace(/^\s+|\s+$/g, '');
      return out + '\n';
    }

    async function convert(arrayBuffer, isJa) {
      if (!self.mammoth || !self.TurndownService || !self.DOMPurify) throw new Error('Required Word import libraries are unavailable in sandbox.');
      const mammothOptions = {
        styleMap: [
          "p[style-name='Heading 1'] => h1:fresh", "p[style-name='Heading 2'] => h2:fresh",
          "p[style-name='Heading 3'] => h3:fresh", "p[style-name='Heading 4'] => h4:fresh",
          "p[style-name='Heading 5'] => h5:fresh", "p[style-name='Heading 6'] => h6:fresh",
          "p[style-name='見出し 1'] => h1:fresh", "p[style-name='見出し 2'] => h2:fresh",
          "p[style-name='見出し 3'] => h3:fresh", "p[style-name='見出し 4'] => h4:fresh",
          "p[style-name='見出し 5'] => h5:fresh", "p[style-name='見出し 6'] => h6:fresh"
        ],
        includeDefaultStyleMap: true,
        convertImage: mammoth.images.imgElement((image) => {
          const alt = image.altText || '';
          const imgTag = isJa ? '画像' : 'Image';
          return { src: '', alt: alt ? `${alt}` : imgTag };
        })
      };
      const result = await mammoth.convertToHtml({ arrayBuffer }, mammothOptions);
      const safeHtml = sanitizeWordHtml(result.value || '');
      const doc = preprocessWordHtml(safeHtml, isJa);
      return { markdown: convertDomToMarkdown(doc, isJa), messages: Array.isArray(result.messages) ? result.messages : [] };
    }

    window.addEventListener('message', async (event) => {
      const msg = event.data || {};
      if (msg.type !== 'MDWORKS_WORD_IMPORT_REQUEST') return;
      try {
        const result = await convert(msg.arrayBuffer, !!msg.isJa);
        parent.postMessage({ type: 'MDWORKS_WORD_IMPORT_RESULT', id: msg.id, ok: true, ...result }, '*');
      } catch (err) {
        parent.postMessage({ type: 'MDWORKS_WORD_IMPORT_RESULT', id: msg.id, ok: false, error: err?.message || String(err) }, '*');
      }
    });
  };

  return [
    '<!doctype html><html><head><meta charset="utf-8"><title>MDWORKS Word Import Sandbox</title></head><body>',
    '<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js" crossorigin="anonymous"><\/script>',
    '<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js" crossorigin="anonymous"><\/script>',
    '<script src="https://cdn.jsdelivr.net/npm/turndown@7.1.3/lib/turndown.browser.umd.min.js" crossorigin="anonymous"><\/script>',
    '<script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.min.js" crossorigin="anonymous"><\/script>',
    '<script>(', runner, ')();<\/script>',
    '</body></html>'
  ].join('');
}

function convertWordInSandbox(arrayBuffer) {
  return new Promise((resolve, reject) => {
    const id = `word-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const iframe = document.createElement('iframe');
    let settled = false;
    let loaded = false;
    let loadTimer = null;

    function cleanup() {
      clearTimeout(loadTimer);
      window.removeEventListener('message', onMessage);
      iframe.remove();
    }

    function finish(fn, value) {
      if (settled) return;
      settled = true;
      cleanup();
      fn(value);
    }

    function onMessage(event) {
      if (event.source !== iframe.contentWindow) return;
      const msg = event.data || {};
      if (msg.type !== 'MDWORKS_WORD_IMPORT_RESULT' || msg.id !== id) return;
      if (msg.ok) finish(resolve, { markdown: msg.markdown || '', messages: msg.messages || [] });
      else finish(reject, new Error(msg.error || 'Sandboxed Word import failed.'));
    }

    window.addEventListener('message', onMessage);
    iframe.style.display = 'none';
    iframe.setAttribute('aria-hidden', 'true');
    iframe.sandbox = 'allow-scripts';
    iframe.srcdoc = getWordImportSandboxSrcdoc();
    iframe.addEventListener('load', () => {
      if (loaded || settled) return;
      loaded = true;
      try {
        iframe.contentWindow.postMessage({ type: 'MDWORKS_WORD_IMPORT_REQUEST', id, arrayBuffer, isJa }, '*', [arrayBuffer]);
      } catch (err) {
        finish(reject, err);
      }
    }, { once: true });

    loadTimer = setTimeout(() => finish(reject, new Error('Sandboxed Word import timed out.')), WORD_IMPORT_SANDBOX_TIMEOUT_MS);
    document.body.appendChild(iframe);
  });
}


const __scriptLoadCache = new Map();
function loadScript(src) {
  if (__scriptLoadCache.has(src)) return __scriptLoadCache.get(src);
  const promise = new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) {
      if (existing.dataset.loaded === '1') { resolve(); return; }
      existing.addEventListener('load', () => resolve(), { once: true });
      existing.addEventListener('error', () => reject(new Error(`Failed to load: ${src}`)), { once: true });
      return;
    }
    const script = document.createElement('script');
    script.src = src;
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.onload = () => { script.dataset.loaded = '1'; resolve(); };
    script.onerror = () => reject(new Error(`Failed to load: ${src}`));
    document.head.appendChild(script);
  });
  __scriptLoadCache.set(src, promise);
  return promise;
}

async function ensureWordImportLibraries() {
  try {
    await Promise.all([
      loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js'),
      loadScript('https://cdn.jsdelivr.net/npm/turndown@7.1.3/lib/turndown.browser.umd.min.js'),
      loadScript('https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.min.js')
    ]);
  } catch (err) { throw new Error(`Library load error: ${err?.message || err}`); }
  if (!window.mammoth || !window.TurndownService) throw new Error('Required Word import libraries are unavailable.');
}

function preprocessWordHtml(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  replaceTextboxesAndShapes(doc);
  // replaceComplexTables(doc); // 表の再現性を保つために無効化
  extractAndAppendFootnotes(doc);
  normalizeImages(doc);
  normalizeLinks(doc);
  normalizeLineBreakHints(doc);
  return doc;
}

function replaceTextboxesAndShapes(doc) {
  const selectors = ['div[class*="textbox"]', 'div[class*="shape"]', 'v\\:textbox', 'w\\:txbxContent'];
  doc.querySelectorAll(selectors.join(',')).forEach((node) => {
    const text = normalizeInlineText(node.textContent || '');
    const placeholder = text ? `\n\n[${isJa ? 'テキストボックス' : 'Textbox'}: ${text}]\n\n` : `\n\n[${isJa ? '図形またはテキストボックス' : 'Shape or textbox'}]\n\n`;
    node.replaceWith(doc.createTextNode(placeholder));
  });
}

function replaceComplexTables(doc) {
  Array.from(doc.querySelectorAll('table')).forEach((table) => {
    if (isComplexTable(table)) {
      const replacement = tableToPlainText(table);
      table.replaceWith(doc.createTextNode(`\n\n${replacement}\n\n`));
    }
  });
}

function isComplexTable(table) {
  if (!table) return true;
  if (table.querySelector('table')) return true;
  if (table.querySelector('[rowspan], [colspan]')) return true;
  const rows = Array.from(table.querySelectorAll('tr'));
  if (rows.length === 0) return true;
  const counts = rows.map((tr) => Array.from(tr.children).filter((el) => /^(TD|TH)$/i.test(el.tagName)).length);
  if (new Set(counts).size !== 1) return true;
  const cells = Array.from(table.querySelectorAll('th, td'));
  for (const cell of cells) {
    if (cell.querySelector('img, table')) return true;
    if (cell.querySelectorAll('p, div, ul, ol, li, blockquote, h1, h2, h3, h4, h5, h6').length > 1) return true;
    if (cell.querySelectorAll('br').length > 1) return true;
    if (normalizeInlineText(cell.textContent || '').length > 200) return true;
  }
  return false;
}

function tableToPlainText(table) {
  const rows = Array.from(table.querySelectorAll('tr'));
  const lines = [`[${isJa ? '複雑な表をテキスト化' : 'Complex table flattened'}]`];
  rows.forEach((tr, rowIndex) => {
    const cells = Array.from(tr.children).filter((el) => /^(TD|TH)$/i.test(el.tagName));
    const parts = cells.map((cell, colIndex) => {
      const label = rowIndex === 0 && cell.tagName.toLowerCase() === 'th' ? `${isJa ? '見出し' : 'Header'}${colIndex + 1}` : `${isJa ? '列' : 'Col'}${colIndex + 1}`;
      return `${label}: ${normalizeInlineText(cell.textContent || '') || '-'}`;
    });
    if (parts.length) lines.push(parts.join(' / '));
  });
  return lines.join('\n');
}

function extractAndAppendFootnotes(doc) {
  const candidates = Array.from(doc.querySelectorAll('ol li[id*="footnote"], ol li[id*="note"], aside, section.footnotes li, div.footnotes li'));
  if (!candidates.length) return;
  const notes = [];
  candidates.forEach((node, idx) => {
    const text = normalizeInlineText(node.textContent || '');
    if (text) notes.push(`${idx + 1}. ${text}`);
    node.remove();
  });
  if (!notes.length) return;
  const section = doc.createElement('section');
  section.innerHTML = `<h2>${isJa ? '注記' : 'Notes'}</h2><p>${notes.join('<br>')}</p>`;
  doc.body.appendChild(section);
}

function normalizeImages(doc) {
  doc.querySelectorAll('img').forEach((img) => {
    const alt = normalizeInlineText(img.getAttribute('alt') || '');
    if (!alt) img.setAttribute('alt', isJa ? '画像' : 'Image');
    img.removeAttribute('src'); img.removeAttribute('srcset');
  });
}

function normalizeLinks(doc) {
  doc.querySelectorAll('a').forEach((a) => {
    const href = a.getAttribute('href') || '';
    if (!href || /^#/.test(href)) return;
    const txt = normalizeInlineText(a.textContent || '');
    if (!txt) a.textContent = href;
  });
}

function normalizeLineBreakHints(doc) {
  const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);
  textNodes.forEach((node) => { node.textContent = node.textContent.replace(/[ \t]+\n/g, '\n'); });
}

function convertDomToMarkdown(doc) {
  const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced', bulletListMarker: '-', emDelimiter: '*', strongDelimiter: '**' });
  if (window.turndownPluginGfm && window.turndownPluginGfm.gfm) { turndownService.use(window.turndownPluginGfm.gfm); }
  turndownService.addRule('images', {
    filter: 'img',
    replacement: function (_content, node) {
      const alt = normalizeInlineText(node.getAttribute('alt') || '');
      const tag = isJa ? '画像' : 'Image';
      return alt && alt !== tag ? `[${tag}: ${alt}]` : `[${tag}]`;
    }
  });
  turndownService.addRule('lineBreak', { filter: 'br', replacement: function () { return '  \n'; } });
  turndownService.addRule('headingsSpacing', {
    filter: function (node) { return /^H[1-6]$/.test(node.nodeName); },
    replacement: function (content, node) {
      const hLevel = Number(node.nodeName.charAt(1));
      const hashes = '#'.repeat(hLevel);
      const text = normalizeInlineText(content || '');
      return `\n\n${hashes} ${text}\n\n`;
    }
  });
  turndownService.addRule('divAsBlock', { filter: 'div', replacement: function (content) { const txt = (content || '').trim(); return txt ? `\n\n${txt}\n\n` : '\n'; } });

  let md = turndownService.turndown(doc.body.innerHTML);
  return postProcessImportedMarkdown(md);
}

function postProcessImportedMarkdown(md) {
  if (!md) return '';
  let out = md.normalize('NFC').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  out = out.split('\n').map((line) => {
    if (line.endsWith('  ')) return line.replace(/[ \t]+$/g, '  ');
    return line.replace(/[ \t]+$/g, '');
  }).join('\n');
  out = out.replace(/\n{3,}/g, '\n\n');
  out = out.replace(/^\s{0,3}#{1,6}\s*$/gm, '');
  out = out.replace(/\n{3,}(\|)/g, '\n\n$1');
  out = out.replace(/(\|[- :|]+\|)\n{3,}/g, '$1\n\n');
  out = out.replace(/\n{3,}(\[画像[^\]]*\])/g, '\n\n$1');
  out = out.replace(/(\[画像[^\]]*\])\n{3,}/g, '$1\n\n');
  out = out.replace(/(  \n){3,}/g, '  \n  \n');
  return out.trim() + '\n';
}

function normalizeInlineText(text) { return String(text || '').normalize('NFC').replace(/\s+/g, ' ').trim(); }
function showLoader(msg) { set('loader-msg', msg); document.getElementById('global-loader').classList.add('show'); }
function hideLoader() { document.getElementById('global-loader').classList.remove('show'); }
//#endregion

//#region [JS-14] FILE SYSTEM (OPEN / SAVE / STANDALONE)
async function handleOpen() {
  closeMenus();
  if (!isMobile && window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        id: 'md-works-dir', 
        types: [{ description: 'Markdown / Text', accept: { 'text/plain': ['.md', '.txt', '.markdown'] } }]
      });
      fileHandle = handle;
      const file = await handle.getFile();
      
      saveToHistoryList(filenameInput.value, editor.value);
      
      filenameInput.value = file.name;
      const text = await file.text();
      editor.value = text.normalize('NFC');
      update();
      markSaved();
      triggerAutoSave();
      if (spellEnabled) runSpellCheck();
      toast(T.opened(file.name));
    } catch (e) {}
  } else {
    document.getElementById('file-input').click();
  }
}

async function handleSave(isSaveAs = false) {
  closeMenus();
  saveToHistoryList(filenameInput.value, editor.value);
  
  if (isMobile) {
    const filename = filenameInput.value.trim() || 'untitled.md';
    const finalName = /\.(md|txt|markdown)$/i.test(filename) ? filename : filename + '.md';
    const file = new File([editor.value], finalName, { type: 'text/plain' });
    
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: finalName, text: 'Shared from MD Editor' });
        markSaved(); toast(T.shared);
      } catch (e) { console.warn('Share canceled', e); }
    } else {
      const txtName = finalName.replace(/\.(md|markdown)$/i, '.txt');
      const txtFile = new File([editor.value], txtName, { type: 'text/plain' });
      if (navigator.canShare && navigator.canShare({ files: [txtFile] })) {
        try {
          await navigator.share({ files: [txtFile], title: txtName, text: 'Shared from MD Editor' });
          markSaved(); toast(T.shared); 
        } catch (e) { console.warn('Share canceled', e); }
      } else {
        fallbackDownload();
      }
    }
  } else {
    if (window.showSaveFilePicker) {
      try {
        if (!fileHandle || isSaveAs) {
          fileHandle = await window.showSaveFilePicker({
            id: 'md-works-dir',
            suggestedName: filenameInput.value.trim() || 'untitled.md',
            types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
          });
        }
        const writable = await fileHandle.createWritable();
        await writable.write(editor.value);
        await writable.close();
        filenameInput.value = fileHandle.name;
        markSaved(); triggerAutoSave(); toast(T.saved);
      } catch (e) {}
    } else {
      if (isSaveAs) {
        const newName = prompt(T.promptSaveAs, filenameInput.value.trim() || 'untitled.md');
        if (newName) { filenameInput.value = newName; fallbackDownload(); }
      } else { fallbackDownload(); }
    }
  }
}

function fallbackDownload() {
  const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
  let filename = filenameInput.value.trim() || 'untitled.md';
  if (!/\.(md|txt|markdown)$/i.test(filename)) filename += '.md';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  markSaved(); toast(T.downloaded);
}

function exportStandalone() {
  closeMenus();
  saveToHistoryList(filenameInput.value, editor.value);
  
  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll('.open').forEach(el => el.classList.remove('open'));
  clone.querySelectorAll('.show').forEach(el => el.classList.remove('show'));
  
  const previewEl = clone.querySelector('#preview');
  if (previewEl) previewEl.innerHTML = '';
  const backdropEl = clone.querySelector('#editor-backdrop');
  if (backdropEl) backdropEl.innerHTML = '';
  const editorEl = clone.querySelector('#editor');
  if (editorEl) { editorEl.innerHTML = ''; editorEl.textContent = ''; editorEl.removeAttribute('value'); }
  const toastEl = clone.querySelector('#toast');
  if (toastEl) { toastEl.className = ''; toastEl.innerHTML = ''; }
  const spellList = clone.querySelector('#spell-list');
  if (spellList) spellList.innerHTML = '';
  const histList = clone.querySelector('#hist-list');
  if (histList) histList.innerHTML = '';
  const outlineList = clone.querySelector('#outline-list');
  if (outlineList) outlineList.innerHTML = '';
  const rnBody = clone.querySelector('#rn-body');
  if (rnBody) rnBody.innerHTML = '';

  const dataScript = clone.querySelector('#standalone-data');
  if (dataScript) {
    const data = { filename: filenameInput.value.trim() || 'untitled.md', content: editor.value };
    dataScript.textContent = JSON.stringify(data).replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
  }

  const htmlStr = '<!DOCTYPE html>\n' + clone.outerHTML;
  let baseName = filenameInput.value.replace(/\.[^/.]+$/, '') || 'document';
  let outName = baseName + '.app.html';

  if (isMobile) {
    const file = new File([htmlStr], outName, { type: 'text/html' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: outName }).catch(e => console.warn('Share canceled', e));
    } else { triggerDownload(htmlStr, outName, 'text/html'); }
  } else { triggerDownload(htmlStr, outName, 'text/html'); toast(T.downloaded); }
}

function triggerDownload(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
//#endregion

//#region [JS-15] OUTLINE, HISTORY & LINTER
function toggleOutline() {
  outlineOpen = !outlineOpen;
  const panel = document.getElementById('outline-panel');
  const check = document.getElementById('outline-check');
  const entry = document.getElementById('m-outline-entry');
  panel.classList.toggle('show', outlineOpen);
  check.style.opacity = outlineOpen ? '1' : '0';
  entry.classList.toggle('active', outlineOpen);
  if (outlineOpen) renderOutline();
  closeMenus();
}

function renderOutline() {
  if (!outlineOpen) return;
  const lines = editor.value.split('\n');
  const container = document.getElementById('outline-list');
  container.innerHTML = '';
  
  let found = false;
  let charOffset = 0;
  lines.forEach(line => {
    const m = line.match(/^(#{1,6})\s+(.+)/);
    if (m) {
      found = true;
      const level = m[1].length;
      const div = document.createElement('div');
      div.className = `ol-item ol-h${level}`;
      div.textContent = m[2];
      const targetOffset = charOffset;
      div.onclick = () => jumpToOffset(targetOffset);
      container.appendChild(div);
    }
    charOffset += line.length + 1;
  });
  if (!found) container.innerHTML = `<div style="padding:10px; color:var(--text3); font-size:12px;">${T.outlineEmpty}</div>`;
}

function jumpToOffset(offset) {
  editor.focus();
  editor.setSelectionRange(offset, offset);
  const textBefore = editor.value.substring(0, offset);
  const linesBefore = textBefore.split('\n').length;
  requestAnimationFrame(() => {
    const lineHeight = parseFloat(getComputedStyle(editor).lineHeight);
    const paddingTop = parseFloat(getComputedStyle(editor).paddingTop);
    const targetTop = (linesBefore - 1) * lineHeight + paddingTop - (editor.clientHeight / 3);
    editor.scrollTop = Math.max(0, targetTop);
    backdrop.scrollTop = editor.scrollTop;
  });
}

async function saveToHistoryList(filename, content) {
  if (!content || content.trim() === '' || content === T.defaultMd) return;
  let hist = [];
  try { hist = JSON.parse((await secureGetItem(HISTORY_KEY)) || '[]'); } catch (e) { hist = []; }
  hist = hist.filter(h => h.filename !== filename);
  hist.unshift({ filename, content, date: Date.now() });
  if (hist.length > 10) hist.pop();
  await secureSetItem(HISTORY_KEY, JSON.stringify(hist));
}

async function openHistory() {
  closeMenus();
  let list = [];
  try { list = JSON.parse((await secureGetItem(HISTORY_KEY)) || '[]'); } catch (e) { list = []; }
  const container = document.getElementById('hist-list');
  container.innerHTML = '';
  
  if (list.length === 0) {
    container.innerHTML = `<div style="color:var(--text3); font-size:13px; padding:10px 0;">${T.historyEmpty}</div>`;
  } else {
    list.forEach(h => {
      const div = document.createElement('div');
      div.className = 'hist-item';
      
      const nameDiv = document.createElement('div');
      nameDiv.className = 'hist-name';
      nameDiv.textContent = h.filename;
      
      const dateDiv = document.createElement('div');
      dateDiv.className = 'hist-date';
      dateDiv.textContent = new Date(h.date).toLocaleString();
      
      div.appendChild(nameDiv);
      div.appendChild(dateDiv);
      
      div.onclick = () => {
        if (isDirty && editor.value !== T.defaultMd && !confirm(T.confirmNew)) return;
        saveToHistoryList(filenameInput.value, editor.value);
        editor.value = h.content;
        filenameInput.value = h.filename;
        fileHandle = null;
        update();
        markDirty();
        closeHistory();
      };
      container.appendChild(div);
    });
  }
  document.getElementById('history-modal').classList.add('show');
}
function closeHistory() { document.getElementById('history-modal').classList.remove('show'); }

function formatDoc() {
  closeMenus();
  let val = editor.value;
  val = val.replace(/\n{3,}/g, '\n\n');
  val = val.replace(/^(#{1,6})([^#\s\n])/gm, '$1 $2');
  val = val.split('\n').map(line => line.endsWith('  ') ? line : line.trimEnd()).join('\n');
  editor.value = val;
  markDirty(); update(); toast(T.formatDone);
}
//#endregion

function toast(msg, duration = 1800) {
  const toastEl = document.getElementById('toast');
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._timer);
  toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

//#region [JS-16] RELEASE NOTES LOGIC
const CURRENT_VERSION = '1.1.2';

function checkReleaseNotes() {
  const lastSeen = localStorage.getItem('md_editor_version');
  if (lastSeen !== CURRENT_VERSION) showReleaseNotes();
}

function showReleaseNotes() {
  set('rn-title', T.rnTitle);
  const body = document.getElementById('rn-body');
  if (window.marked && window.DOMPurify) body.innerHTML = safeMarkdownHtml(T.rnContent);
  else body.innerText = "Updated to " + CURRENT_VERSION;
  document.getElementById('rn-modal').classList.add('show');
}

function closeRN() {
  localStorage.setItem('md_editor_version', CURRENT_VERSION);
  document.getElementById('rn-modal').classList.remove('show');
}
//#endregion

//#region [JS-17] SHORTCUTS, EXPORTS & UTILS
window.addEventListener('keydown', e => {
  const meta = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') {
    if (document.body.classList.contains('zen-mode')) toggleZenMode();
    if (srPanelOpen) { e.preventDefault(); closeSearchPanel(); }
    if (document.getElementById('history-modal').classList.contains('show')) closeHistory();
    if (document.getElementById('rn-modal').classList.contains('show')) closeRN();
    return;
  }
  if (meta && e.key.toLowerCase() === 'n') { e.preventDefault(); newFile(); }
  if (meta && e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); handleSave(true); return; }
  if (meta && !e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); handleSave(false); }
  if (meta && e.key.toLowerCase() === 'o') { e.preventDefault(); handleOpen(); }
  if (meta && e.key.toLowerCase() === 'f') { e.preventDefault(); openSearchPanel('find'); }
  if (meta && e.key.toLowerCase() === 'h') { e.preventDefault(); openSearchPanel('replace'); }
  if (meta && e.key.toLowerCase() === 'b') { e.preventDefault(); if (document.activeElement === editor && !isEditorComposing) wrap('**'); }
  if (meta && e.key.toLowerCase() === 'i') { e.preventDefault(); if (document.activeElement === editor && !isEditorComposing) wrap('*'); }
});

window.addEventListener('beforeunload', (e) => {
  if (isDirty && editor.value.trim() !== '' && editor.value !== T.defaultMd) { e.preventDefault(); e.returnValue = ''; }
});

async function newFile() {
  closeMenus();
  if (isDirty && editor.value.trim() !== '' && editor.value !== T.defaultMd) {
    if (!confirm(T.confirmNew)) return;
  }
  await saveToHistoryList(filenameInput.value, editor.value);
  editor.value = T.defaultMd;
  resetDocumentIdentity();
  update();
  markSaved();
  await triggerAutoSave();
  toast(T.newCreated);
}

// ▼ ファイルを閉じる処理（非同期[async/await]対応で安定化）
async function closeFile() {
  closeMenus();
  if (isDirty && editor.value.trim() !== '' && editor.value !== T.defaultMd) {
    if (!confirm(T.confirmClose)) return;
  }
  await saveToHistoryList(filenameInput.value, editor.value);
  editor.value = '';
  resetDocumentIdentity();
  update(); 
  markSaved(); 
  await triggerAutoSave(); 
  toast(T.closedToast);
}

async function execEdit(action) {
  closeMenus(); editor.focus();
  if (action === 'selectAll') { editor.select(); return; }
  if (action === 'paste') {
    try {
      const text = await navigator.clipboard.readText();
      handlePlainTextPaste(text);
    } catch (err) { toast(T.errPaste); }
    return;
  }
  document.execCommand(action);
  if (action === 'cut' || action === 'undo' || action === 'redo') { markDirty(); triggerAutoSave(); }
}

function exportHtml() {
  closeMenus();
  if (!window.marked || !window.DOMPurify) { alert(isJa ? 'セキュリティエラー' : 'Security Error'); return; }
  const safeHtml = safeMarkdownHtml(editor.value);
  const title = filenameInput.value.replace(/\.[^/.]+$/, '') || 'document';
  const fullHtml = `<!DOCTYPE html>\n<html lang="${isJa ? 'ja' : 'en'}">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>${title}</title>\n<style>body{font-family:'Helvetica Neue',Arial,sans-serif;line-height:1.8;color:#333;max-width:800px;margin:0 auto;padding:40px 20px}h1,h2,h3,h4,h5,h6{font-family:sans-serif;font-weight:bold;margin-top:1.5em;margin-bottom:.5em}h1{border-bottom:2px solid #eee;padding-bottom:5px}h2{border-bottom:1px solid #eee;padding-bottom:5px}code{background-color:#f4f4f4;padding:2px 5px;border-radius:4px;font-family:monospace;font-size:.9em}pre{background-color:#f6f8fa;border-radius:6px;padding:16px;overflow-x:auto;border:1px solid #e1e4e8}pre code{background:none;border:none;padding:0}blockquote{border-left:4px solid #dfe2e5;margin:1em 0;padding-left:16px;color:#6a737d}table{border-collapse:collapse;width:100%;margin:1em 0}th,td{border:1px solid #dfe2e5;padding:8px 13px}th{background-color:#f6f8fa;font-weight:600}tr:nth-child(even){background-color:#fcfcfc}img{max-width:100%;height:auto}</style>\n</head>\n<body>\n${safeHtml}\n</body>\n</html>`;
  if (isMobile) {
    const file = new File([fullHtml], title + '.html', { type: 'text/html;charset=utf-8' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: title + '.html' }).catch(() => {});
    else triggerDownload(fullHtml, title + '.html', 'text/html');
  } else {
    triggerDownload(fullHtml, title + '.html', 'text/html'); toast(T.downloaded);
  }
}

function exportPdf() {
  closeMenus();
  if (window.marked && window.DOMPurify) {
    preview.innerHTML = safeMarkdownHtml(editor.value); decoratePreviewTasks();
  }
  setTimeout(() => window.print(), 100);
}
