//#region [JS-10] SEARCH & REPLACE LOGIC
const srPanel = document.getElementById('sr-panel');
const srInput = document.getElementById('sr-search-input');
const srReplaceInput = document.getElementById('sr-replace-input');
const srCount = document.getElementById('sr-count');
const srError = document.getElementById('sr-error');

let srPanelOpen = false;
let srMode = 'find';
let srMatches = [];
let srCurrentIdx = -1;
let isComposing = false;

srInput.addEventListener('compositionstart', () => { isComposing = true; });
srInput.addEventListener('compositionend', () => { isComposing = false; performSearch(true); });

function openSearchPanel(mode) {
  closeMenus();
  srPanelOpen = true;
  srMode = mode;
  srPanel.classList.add('show');
  if (mode === 'find') {
    document.getElementById('tab-find').classList.add('active');
    document.getElementById('tab-replace').classList.remove('active');
    document.getElementById('sr-replace-area').style.display = 'none';
  } else {
    document.getElementById('tab-replace').classList.add('active');
    document.getElementById('tab-find').classList.remove('active');
    document.getElementById('sr-replace-area').style.display = 'block';
  }
  const selText = editor.value.slice(editor.selectionStart, editor.selectionEnd);
  if (selText && !selText.includes('\n')) srInput.value = selText;
  srInput.focus();
  srInput.select();
  performSearch(true);
}

function closeSearchPanel() {
  srPanelOpen = false;
  srPanel.classList.remove('show');
  srMatches = [];
  srCurrentIdx = -1;
  refreshBackdrop();
  editor.focus();
}

document.getElementById('tab-find').onclick = () => openSearchPanel('find');
document.getElementById('tab-replace').onclick = () => openSearchPanel('replace');
document.getElementById('sr-close').onclick = closeSearchPanel;

function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function buildRegex(isGlobal = true) {
  const query = srInput.value;
  if (!query) return null;
  const useRegex = document.getElementById('sr-opt-regex').checked;
  const matchCase = document.getElementById('sr-opt-case').checked;
  const wholeWord = document.getElementById('sr-opt-word').checked;
  let patternStr = useRegex ? query : escapeRegExp(query);
  if (wholeWord) patternStr = `\\b${patternStr}\\b`;
  let flags = 'm';
  if (isGlobal) flags += 'g';
  if (!matchCase) flags += 'i';
  try { return new RegExp(patternStr, flags); } catch (e) { return null; }
}

function setSearchCount() {
  if (srMatches.length === 0 || srCurrentIdx === -1) { srCount.textContent = T.noMatches; return; }
  srCount.textContent = `${srCurrentIdx + 1} / ${srMatches.length}`;
}

function performSearch(jumpToClosest = false) {
  srMatches = [];
  srError.style.display = 'none';
  const query = srInput.value;
  if (!query) { srCount.textContent = ''; srCurrentIdx = -1; refreshBackdrop(); return; }
  const regex = buildRegex(true);
  if (!regex) { srError.style.display = 'block'; srCount.textContent = ''; srCurrentIdx = -1; refreshBackdrop(); return; }
  const text = editor.value.replace(/\r/g, ''); 
  let match;
  while ((match = regex.exec(text)) !== null) {
    if (match.index === regex.lastIndex) regex.lastIndex++;
    srMatches.push({ start: match.index, end: match.index + match[0].length, text: match[0] });
  }
  if (srMatches.length === 0) { srCurrentIdx = -1; srCount.textContent = T.noMatches; refreshBackdrop(); return; }
  if (jumpToClosest) {
    const cursorPos = editor.selectionStart;
    srCurrentIdx = srMatches.findIndex(m => m.start >= cursorPos);
    if (srCurrentIdx === -1) srCurrentIdx = 0;
    highlightCurrentMatch();
  } else {
    if (srCurrentIdx >= srMatches.length) srCurrentIdx = srMatches.length - 1;
    else if (srCurrentIdx === -1) srCurrentIdx = 0;
    setSearchCount();
    refreshBackdrop();
  }
}

function highlightCurrentMatch() {
  if (srMatches.length === 0 || srCurrentIdx === -1) { refreshBackdrop(); return; }
  const m = srMatches[srCurrentIdx];
  if (isComposing) { setSearchCount(); refreshBackdrop(); return; }
  const activeEl = document.activeElement;
  const shouldRestoreSearchFocus = activeEl && activeEl.closest('#sr-panel');

  editor.focus();
  editor.setSelectionRange(m.start, m.end);
  if (shouldRestoreSearchFocus) activeEl.focus();
  setSearchCount();
  refreshBackdrop();

  requestAnimationFrame(() => {
    const activeMark = backdrop.querySelector('mark.active');
    if (activeMark) scrollToY(activeMark.offsetTop, 0.4);
    if (shouldRestoreSearchFocus && document.contains(activeEl)) activeEl.focus();
  });
}

function navMatch(dir) {
  if (srMatches.length === 0) return;
  srCurrentIdx += dir;
  if (srCurrentIdx >= srMatches.length) srCurrentIdx = 0;
  if (srCurrentIdx < 0) srCurrentIdx = srMatches.length - 1;
  highlightCurrentMatch();
}

document.getElementById('sr-next').onclick = () => navMatch(1);
document.getElementById('sr-prev').onclick = () => navMatch(-1);

[srInput, document.getElementById('sr-opt-regex'), document.getElementById('sr-opt-case'), document.getElementById('sr-opt-word')].forEach(el => {
  el.addEventListener('input', (e) => { if (e.isComposing || isComposing) return; performSearch(true); });
  el.addEventListener('change', () => performSearch(true));
});

srPanel.addEventListener('keydown', e => {
  if (e.isComposing) return;
  if (e.key === 'Enter') { e.preventDefault(); navMatch(e.shiftKey ? -1 : 1); }
});

document.getElementById('sr-btn-replace').onclick = () => {
  if (srMatches.length === 0 || srCurrentIdx === -1) return;
  const m = srMatches[srCurrentIdx];
  if (editor.selectionStart !== m.start || editor.selectionEnd !== m.end) { highlightCurrentMatch(); return; }
  const regex = buildRegex(false);
  if (!regex) return;
  const repStr = srReplaceInput.value;
  const newSubText = m.text.replace(regex, repStr);
  editor.focus();
  document.execCommand('insertText', false, newSubText);
  markDirty();
  performSearch(true);
};

document.getElementById('sr-btn-replace-all').onclick = () => {
  if (srMatches.length === 0) return;
  const count = srMatches.length;
  if (!confirm(T.confirmRepAll(count))) return;
  const regex = buildRegex(true);
  if (!regex) return;
  const repStr = srReplaceInput.value;
  const oldFullText = editor.value;
  const newFullText = oldFullText.replace(regex, repStr);
  const scrollTop = editor.scrollTop;
  editor.focus();
  editor.setSelectionRange(0, oldFullText.length);
  document.execCommand('insertText', false, newFullText);
  editor.setSelectionRange(0, 0);
  editor.scrollTop = scrollTop;
  markDirty();
  toast(T.replacedN(count));
  performSearch(true);
};
//#endregion

//#region [JS-11] SPELL CHECK (HUNSPELL)
let dictReady = false;
let typo = null;
let isDictLoading = false;
let currentSpellRun = 0;
let spellMatches = []; 

async function initDict() {
  if (isDictLoading || dictReady) return;
  isDictLoading = true;
  try {
    const [aff, dic] = await Promise.all([
      fetch('https://cdn.jsdelivr.net/npm/typo-js@1.2.3/dictionaries/en_US/en_US.aff').then(r => r.text()),
      fetch('https://cdn.jsdelivr.net/npm/typo-js@1.2.3/dictionaries/en_US/en_US.dic').then(r => r.text())
    ]);
    typo = new Typo('en_US', aff, dic);
    dictReady = true;
    if (spellEnabled) runSpellCheck();
  } catch (e) {
    set('sp-loading-text', T.dictFailed);
  }
}

function toggleSpell() {
  spellEnabled = !spellEnabled;
  const titleBtn = document.getElementById('spell-toggle-title-btn');
  const entry = document.getElementById('m-spell-entry');
  const chk = document.getElementById('spell-check');
  const status = document.getElementById('spell-status');
  if (titleBtn) {
    titleBtn.classList.toggle('active', spellEnabled);
    titleBtn.setAttribute('aria-pressed', spellEnabled ? 'true' : 'false');
  }
  if (entry) {
    entry.classList.toggle('active', spellEnabled);
    entry.setAttribute('aria-pressed', spellEnabled ? 'true' : 'false');
  }
  if (chk) chk.style.opacity = spellEnabled ? '1' : '0';
  if (spellEnabled) {
    status.textContent = T.spellOn;
    status.classList.add('on');
    initDict();
    runSpellCheck();
  } else {
    status.textContent = '';
    status.classList.remove('on');
    closeSpellPanel();
    spellMatches = []; 
    refreshBackdrop(); 
  }
  closeMenus();
}

function closeSpellPanel() {
  document.getElementById('spell-panel').classList.remove('show');
}

let spellTimer = null;
function runSpellCheck() {
  if (!spellEnabled) return;
  clearTimeout(spellTimer);
  spellTimer = setTimeout(doSpellCheck, 350);
}

function maskMarkdown(src) {
  return src
    .replace(/```[\s\S]*?```/g, m => ' '.repeat(m.length))
    .replace(/`[^`\n]+`/g, m => ' '.repeat(m.length))
    .replace(/!\[[^\]]*\]\([^)]*\)/g, m => ' '.repeat(m.length))
    .replace(/(\[[^\]]*\])\(([^)]*)\)/g, (m, p1, p2) => p1 + '(' + ' '.repeat(p2.length) + ')')
    .replace(/^#{1,6}\s+/gm, m => ' '.repeat(m.length))
    .replace(/^[-*+]\s+/gm, m => ' '.repeat(m.length))
    .replace(/^\d+\.\s+/gm, m => ' '.repeat(m.length))
    .replace(/^>\s*/gm, m => ' '.repeat(m.length))
    .replace(/[*_~|\\]/g, ' ');
}

function doSpellCheck() {
  if (!spellEnabled) return;
  const panel = document.getElementById('spell-panel');
  const list = document.getElementById('spell-list');
  const empty = document.getElementById('spell-empty');
  const loading = document.getElementById('spell-loading');
  panel.classList.add('show');
  if (!dictReady || !typo) {
    loading.classList.add('show');
    set('sp-loading-text', T.dictLoading);
    return;
  }
  currentSpellRun++;
  const thisRun = currentSpellRun;
  const text = editor.value.replace(/\r/g, ''); 
  const stripped = maskMarkdown(text);
  const wordRe = /\b([a-zA-Z]{2,}(?:'[a-zA-Z]+)?)\b/g;
  const seen = new Set();
  const misspellings = [];
  const tempMatches = []; 
  let m;
  while ((m = wordRe.exec(stripped)) !== null) {
    const raw = m[1];
    const lower = raw.toLowerCase();
    if (/[A-Z]/.test(raw.slice(1))) continue;
    if (/\d/.test(raw)) continue;
    if (ignoredWords.has(lower) || customDict.has(lower)) continue;
    const ok = typo.check(raw) || typo.check(raw.charAt(0).toUpperCase() + raw.slice(1));
    if (!ok) {
      tempMatches.push({ start: m.index, end: m.index + raw.length });
      if (!seen.has(lower)) { seen.add(lower); misspellings.push({ word: raw, lower }); }
    }
  }
  spellMatches = tempMatches;
  refreshBackdrop();
  list.innerHTML = '';
  empty.style.display = 'none';
  if (misspellings.length === 0) {
    loading.classList.remove('show');
    empty.style.display = 'block';
    return;
  }
  loading.classList.add('show');
  let i = 0;
  function processNext() {
    if (currentSpellRun !== thisRun || !spellEnabled) return;
    if (i >= misspellings.length) { loading.classList.remove('show'); return; }
    const item = misspellings[i];
    let sugs = [];
    try { sugs = typo.suggest(item.word).slice(0, 5); } catch (e) {}
    renderSpellRow(item.word, item.lower, sugs);
    i++;
    setTimeout(processNext, 5);
  }
  processNext();
}

function renderSpellRow(word, lower, sugs) {
  const list = document.getElementById('spell-list');
  const row = document.createElement('div');
  row.className = 'spell-word'; row.id = 'sw-' + lower;
  const topRow = document.createElement('div');
  topRow.className = 'spell-word-row';
  const wordSpan = document.createElement('span');
  wordSpan.className = 'spell-word-text'; wordSpan.textContent = word;
  const actions = document.createElement('div');
  actions.className = 'spell-actions';
  const ignBtn = document.createElement('button');
  ignBtn.className = 'spell-btn'; ignBtn.textContent = T.spellIgnore;
  ignBtn.onclick = () => { ignoredWords.add(lower); removeSpellRow(lower); runSpellCheck(); };
  const addBtn = document.createElement('button');
  addBtn.className = 'spell-btn add'; addBtn.textContent = T.spellAdd;
  addBtn.onclick = () => { customDict.add(lower); removeSpellRow(lower); runSpellCheck(); };
  actions.append(ignBtn, addBtn);
  topRow.append(wordSpan, actions); row.appendChild(topRow);
  if (sugs.length > 0) {
    const sugDiv = document.createElement('div');
    sugDiv.className = 'spell-suggestions';
    sugs.forEach(sug => {
      const s = document.createElement('span');
      s.className = 'spell-sug'; s.textContent = sug;
      s.onclick = () => replaceWord(word, sug);
      sugDiv.appendChild(s);
    });
    row.appendChild(sugDiv);
  }
  list.appendChild(row);
}

function removeSpellRow(lower) {
  const el = document.getElementById('sw-' + lower);
  if (el) el.remove();
}

function replaceWord(original, replacement) {
  const val = editor.value;
  const esc = original.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('\\b' + esc + '\\b', 'i');
  const m = re.exec(val);
  if (!m) return;
  const rep = m[0][0] === m[0][0].toUpperCase() && m[0][0] !== m[0][0].toLowerCase()
      ? replacement.charAt(0).toUpperCase() + replacement.slice(1)
      : replacement;
  editor.setSelectionRange(m.index, m.index + m[0].length);
  editor.focus();
  document.execCommand('insertText', false, rep);
  markDirty();
  runSpellCheck();
}
//#endregion

//#region [JS-12] TEXT INSERTION HELPERS
function getPos() { return { s: editor.selectionStart, e: editor.selectionEnd }; }
function setRange(s, e) {
  editor.selectionStart = s;
  editor.selectionEnd = e;
  editor.focus();
}
function ins(text, lineStart) {
  const { s } = getPos();
  if (lineStart) {
    const val = editor.value;
    const ls = val.lastIndexOf('\n', s - 1) + 1;
    editor.setSelectionRange(ls, ls);
  }
  editor.focus();
  document.execCommand('insertText', false, text);
  markDirty();
  triggerAutoSave();
}
function wrap(mark) {
  const { s, e } = getPos();
  const sel = editor.value.slice(s, e) || (isJa ? '文字' : 'text');
  const rep = mark + sel + mark;
  editor.focus();
  document.execCommand('insertText', false, rep);
  setRange(s + mark.length, s + mark.length + sel.length);
  markDirty();
  triggerAutoSave();
}
function insBlock(before, after) {
  const { s, e } = getPos();
  const sel = editor.value.slice(s, e);
  const rep = before + sel + after;
  editor.focus();
  document.execCommand('insertText', false, rep);
  setRange(s + before.length, s + before.length + sel.length);
  markDirty();
  triggerAutoSave();
}
function insertLink() {
  const { s, e } = getPos();
  const sel = editor.value.slice(s, e) || T.insertLink;
  const rep = `[${sel}](URL)`;
  editor.focus();
  document.execCommand('insertText', false, rep);
  setRange(s + 1, s + 1 + sel.length);
  markDirty();
  triggerAutoSave();
}
function insertTable() {
  editor.focus();
  document.execCommand('insertText', false, T.tableSnippet);
  markDirty();
  triggerAutoSave();
}

//#region [JS-13] WORD IMPORT (MAMMOTH + TURNDOWN)
const WORD_MAX_BYTES = 10 * 1024 * 1024;
function triggerWordImport() {
  closeMenus();
  if (isDirty && editor.value.trim() !== '' && editor.value !== T.defaultMd) {
    if (!confirm(T.confirmWordImport || T.confirmNew)) return;
  }
  document.getElementById('word-input').click();
}

document.getElementById('word-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  if (file.size > WORD_MAX_BYTES) { alert(T.errSize); return; }
  try {
    showLoader(T.loadingWordLibs);
    const arrayBuffer = await file.arrayBuffer();
    showLoader(T.loadingWordParse);
    const sandboxResult = await convertWordInSandbox(arrayBuffer);
    const md = sandboxResult.markdown || '';
    const mammothMessages = Array.isArray(sandboxResult.messages) ? sandboxResult.messages : [];
    showLoader(T.loadingWordConvert);
    if (!md || !md.trim()) throw new Error('Converted markdown is empty.');
    await saveToHistoryList(filenameInput.value, editor.value);
    editor.value = md;
    filenameInput.value = file.name.replace(/\.docx$/i, '.md');
    fileHandle = null;
    syncFilenameInputState();
    update(); markDirty(); triggerAutoSave();
    hideLoader();
    toast(mammothMessages.length > 0 ? T.warnMammoth : T.importSuccess);
  } catch (error) {
    hideLoader(); alert(`${T.errImport}\n${error?.message || ''}`.trim());
  }
});

const WORD_IMPORT_SANDBOX_TIMEOUT_MS = 60000;
function getWordImportSandboxSrcdoc() {
  const runner = function () {
    const WORD_SANITIZE_CONFIG = Object.freeze({
      ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','p','br','hr','strong','b','em','i','s','del','code','pre','blockquote','ul','ol','li','table','thead','tbody','tr','th','td','a','img','span','sup','sub'],
      ALLOWED_ATTR: ['href','title','alt','src','class','colspan','rowspan','align'],
      ALLOW_DATA_ATTR: false,
      FORBID_TAGS: ['script','style','iframe','object','embed','form','meta','link','base','svg','math'],
      FORBID_ATTR: ['style','srcset','onerror','onclick','onload','onmouseover','onfocus'],
      KEEP_CONTENT: true
    });
    function normalizeInlineText(str) { return String(str || '').replace(/\u00a0/g, ' ').replace(/[ \t\r\n]+/g, ' ').trim(); }
    function sanitizeWordHtml(html) {
      if (!self.DOMPurify) throw new Error('DOMPurify is unavailable in sandbox.');
      DOMPurify.addHook('afterSanitizeAttributes', (node) => {
        if (!node || !node.tagName) return;
        const tag = node.tagName.toLowerCase();
        if (tag === 'img') { node.removeAttribute('src'); node.removeAttribute('srcset'); }
      });
      return DOMPurify.sanitize(String(html || ''), WORD_SANITIZE_CONFIG);
    }
    function preprocessWordHtml(html, isJa) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      doc.querySelectorAll('div[class*="textbox"], div[class*="shape"]').forEach(node => {
        const text = normalizeInlineText(node.textContent || '');
        node.replaceWith(doc.createTextNode(text ? `\n\n[Textbox: ${text}]\n\n` : ''));
      });
      return doc;
    }
    async function convert(arrayBuffer, isJa) {
      const result = await mammoth.convertToHtml({ arrayBuffer });
      const safeHtml = sanitizeWordHtml(result.value || '');
      const doc = preprocessWordHtml(safeHtml, isJa);
      const turndownService = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-' });
      const md = turndownService.turndown(doc.body.innerHTML);
      return { markdown: md, messages: result.messages || [] };
    }
    window.addEventListener('message', async (event) => {
      const msg = event.data || {};
      if (msg.type !== 'MDWORKS_WORD_IMPORT_REQUEST') return;
      try {
        const result = await convert(msg.arrayBuffer, !!msg.isJa);
        parent.postMessage({ type: 'MDWORKS_WORD_IMPORT_RESULT', id: msg.id, ok: true, ...result }, '*');
      } catch (err) {
        parent.postMessage({ type: 'MDWORKS_WORD_IMPORT_RESULT', id: msg.id, ok: false, error: err?.message }, '*');
      }
    });
  };
  return `<!doctype html><html><head><meta charset="utf-8"></head><body>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.11.0/mammoth.browser.min.js"><\/script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.5/dist/purify.min.js"><\/script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.4/lib/turndown.browser.umd.min.js"><\/script>
    <script>(${runner})();<\/script></body></html>`;
}

function convertWordInSandbox(arrayBuffer) {
  return new Promise((resolve, reject) => {
    const id = `word-${window.crypto?.randomUUID ? crypto.randomUUID() : Date.now()}`;
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.sandbox = 'allow-scripts';
    iframe.srcdoc = getWordImportSandboxSrcdoc();

    let loadTimer = setTimeout(() => {
      window.removeEventListener('message', onMessage);
      iframe.remove();
      reject(new Error('Sandboxed Word import timed out.'));
    }, WORD_IMPORT_SANDBOX_TIMEOUT_MS);

    const onMessage = (event) => {
      if (event.source !== iframe.contentWindow) return;

      const msg = event.data || {};
      if (msg.type === 'MDWORKS_WORD_IMPORT_RESULT' && msg.id === id) {
        clearTimeout(loadTimer);
        window.removeEventListener('message', onMessage);
        iframe.remove();
        if (msg.ok) resolve(msg); else reject(new Error(msg.error));
      }
    };
    window.addEventListener('message', onMessage);
    iframe.onload = () => iframe.contentWindow.postMessage({ type: 'MDWORKS_WORD_IMPORT_REQUEST', id, arrayBuffer, isJa }, '*');
    document.body.appendChild(iframe);
  });
}
//#endregion

//#region [JS-14] FILE SYSTEM (OPEN / SAVE / STANDALONE)
function isUserAbortError(err) {
  return err && (err.name === 'AbortError' || err.code === 20);
}

function notifyFileSystemError(action, err) {
  if (isUserAbortError(err)) return;
  console.error(`${action} failed`, err);
  alert(isJa ? `${action}に失敗しました。` : `${action} failed.`);
}

async function handleOpen() {
  closeMenus();
  if (!isMobile && window.showOpenFilePicker) {
    try {
      const openOptions = {
        id: MDWORKS_PICKER_ID,
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.txt'] } }]
      };
      const startHandle = lastPickerStartHandle || fileHandle;
      if (startHandle) {
        openOptions.startIn = startHandle;
      }

      const [handle] = await window.showOpenFilePicker(openOptions);
      fileHandle = handle;
      syncFilenameInputState();
      lastPickerStartHandle = handle;
      const file = await handle.getFile();
      await saveToHistoryList(filenameInput.value, editor.value);
      filenameInput.value = file.name;
      editor.value = (await file.text()).normalize('NFC');
      update(); markSaved(); triggerAutoSave();
      toast(T.opened(file.name));
    } catch (e) {
      notifyFileSystemError(isJa ? 'ファイルを開く処理' : 'Open file', e);
    }
  } else {
    document.getElementById('file-input').click();
  }
}

document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  e.target.value = '';

  try {
    await saveToHistoryList(filenameInput.value, editor.value);

    filenameInput.value = file.name;
    editor.value = (await file.text()).normalize('NFC');
    fileHandle = null;
    syncFilenameInputState();

    update();
    markSaved();
    triggerAutoSave();

    if (spellEnabled) runSpellCheck();

    toast(T.opened(file.name));
  } catch (err) {
    console.error(err);
    alert(isJa ? 'ファイルの読み込みに失敗しました。' : 'Failed to open file.');
  }
});

function ensureMarkdownFilename(name) {
  const fallback = 'untitled.md';
  const value = String(name || '').trim().normalize('NFC');
  if (!value) return fallback;
  if (/\.(md|markdown|txt)$/i.test(value)) return value;
  return `${value}.md`;
}

async function handleSave(isSaveAs = false) {
  closeMenus();
  await saveToHistoryList(filenameInput.value, editor.value);
  const saveFilename = ensureMarkdownFilename(filenameInput.value);
  if (isMobile) {
    const filename = saveFilename;
    const file = new File([editor.value], filename, { type: 'text/markdown' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); filenameInput.value = filename; markSaved(); } catch (e) {}
    } else fallbackDownload();
  } else {
    if (window.showSaveFilePicker) {
      try {
        if (!fileHandle || isSaveAs) {
          const saveOptions = {
            id: MDWORKS_PICKER_ID,
            suggestedName: saveFilename,
            types: [
              {
                description: 'Markdown files',
                accept: {
                  'text/markdown': ['.md', '.markdown'],
                  'text/plain': ['.txt']
                }
              }
            ],
            excludeAcceptAllOption: true
          };
          const startHandle = lastPickerStartHandle || fileHandle;
          if (startHandle) {
            saveOptions.startIn = startHandle;
          }

          fileHandle = await window.showSaveFilePicker(saveOptions);
          syncFilenameInputState();
        }
        if (fileHandle) {
          syncFilenameInputState();
          lastPickerStartHandle = fileHandle;
        }
        const writable = await fileHandle.createWritable();
        await writable.write(editor.value);
        await writable.close();
        filenameInput.value = fileHandle.name;
        markSaved(); toast(T.saved);
      } catch (e) {
        notifyFileSystemError(isJa ? 'ファイルの保存' : 'Save file', e);
      }
    } else fallbackDownload();
  }
}

function fallbackDownload() {
  const filename = ensureMarkdownFilename(filenameInput.value);
  filenameInput.value = filename;
  const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);

  markSaved();
  toast(T.downloaded);
  syncFilenameInputState();
}

function buildStandaloneHtmlForExport() {
  const clone = document.documentElement.cloneNode(true);

  clone.querySelectorAll('.open').forEach(el => el.classList.remove('open'));
  clone.querySelectorAll('.show').forEach(el => el.classList.remove('show'));

  const previewEl = clone.querySelector('#preview');
  if (previewEl) previewEl.innerHTML = '';

  const backdropEl = clone.querySelector('#editor-backdrop');
  if (backdropEl) backdropEl.innerHTML = '';

  const editorEl = clone.querySelector('#editor');
  if (editorEl) {
    editorEl.innerHTML = '';
    editorEl.textContent = '';
    editorEl.removeAttribute('value');
  }

  const toastEl = clone.querySelector('#toast');
  if (toastEl) {
    toastEl.className = '';
    toastEl.innerHTML = '';
  }

  const spellList = clone.querySelector('#spell-list');
  if (spellList) spellList.innerHTML = '';

  const histList = clone.querySelector('#hist-list');
  if (histList) histList.innerHTML = '';

  const outlineList = clone.querySelector('#outline-list');
  if (outlineList) outlineList.innerHTML = '';

  const rnBody = clone.querySelector('#rn-body');
  if (rnBody) rnBody.innerHTML = '';

  const docBody = clone.querySelector('#doc-body');
  if (docBody) docBody.innerHTML = '';

  const rnModal = clone.querySelector('#rn-modal');
  if (rnModal) {
    rnModal.classList.remove('show');
    rnModal.setAttribute('aria-hidden', 'true');
    rnModal.setAttribute('data-state', 'closed');
  }

  const docModal = clone.querySelector('#doc-modal');
  if (docModal) {
    docModal.classList.remove('show');
    docModal.setAttribute('aria-hidden', 'true');
    docModal.setAttribute('data-state', 'closed');
  }

  const loader = clone.querySelector('#global-loader');
  if (loader) loader.classList.remove('show');

  const dataScript = clone.querySelector('#standalone-data');
  if (dataScript) {
    const data = {
      filename: filenameInput.value.trim() || 'untitled.md',
      content: editor.value
    };

    dataScript.textContent = JSON.stringify(data)
      .replace(/</g, '\\u003c')
      .replace(/>/g, '\\u003e')
      .replace(/&/g, '\\u0026');
  }

  const htmlStr = '<!DOCTYPE html>\n' + clone.outerHTML;
  const baseName = (filenameInput.value || 'document').replace(/\.[^/.]+$/, '') || 'document';

  return {
    htmlStr,
    baseName,
    appName: baseName + '.app.html',
    privateAppName: baseName + '.private.app.html'
  };
}

async function exportStandalone() {
  closeMenus();
  await saveToHistoryList(filenameInput.value, editor.value);

  const { htmlStr, appName } = buildStandaloneHtmlForExport();

  if (isMobile) {
    const file = new File([htmlStr], appName, { type: 'text/html' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: appName }).catch(e => console.warn('Share canceled', e));
    } else {
      triggerDownload(htmlStr, appName, 'text/html');
    }
  } else {
    triggerDownload(htmlStr, appName, 'text/html');
    toast(T.downloaded);
  }
}

function getPrivateAppPassphrase() {
  const ok = confirm(
    isJa
      ? 'Private Appとして書き出します。\n\nパスフレーズを忘れると内容を復元できません。\nファイル破損に備えて、原本またはバックアップを安全な場所に保管してください。\n\n※復号後にブラウザ上で編集を続ける場合、ブラウザ内の一時保存はMD//WORKS本体の「Private Storage」等の設定に従います。より厳密に管理したい場合は、起動後にPrivate Storageも併用してください。'
      : 'Export as Private App.\n\nIf you forget the passphrase, the content cannot be recovered. Keep an original or backup copy in a safe place.\n\nNote: Auto-saves after unlocking depend on the editor\'s normal Storage Settings. For extra security, enable Private Storage after unlocking.'
  );
  if (!ok) return null;

  const p1 = prompt(
    isJa
      ? '暗号化App用のパスフレーズを入力してください。'
      : 'Enter a passphrase for this Private App.'
  ) || '';

  if (!p1) return null;

  const p2 = prompt(
    isJa
      ? '確認のため、もう一度パスフレーズを入力してください。'
      : 'Enter the passphrase again to confirm.'
  ) || '';

  if (p1 !== p2) {
    toast(isJa ? 'パスフレーズが一致しません' : 'Passphrases do not match');
    return null;
  }

  if (p1.length < 10) {
    const weakOk = confirm(
      isJa
        ? 'パスフレーズが短めです。続行しますか？\n\n業務用の機密文書では、10文字以上で推測されにくいものを推奨します。'
        : 'The passphrase is short. Continue?\n\nFor confidential business documents, use a hard-to-guess passphrase of at least 10 characters.'
    );
    if (!weakOk) return null;
  }

  return p1;
}

async function derivePrivateAppKey(passphrase, saltBytes, iterations) {
  const material = await crypto.subtle.importKey(
    'raw',
    enc.encode(passphrase),
    'PBKDF2',
    false,
    ['deriveKey']
  );

  return crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: saltBytes,
      iterations,
      hash: 'SHA-256'
    },
    material,
    {
      name: 'AES-GCM',
      length: 256
    },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptPrivateAppBox(plainText, passphrase, label) {
  const iterations = 310000;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));

  const key = await derivePrivateAppKey(passphrase, salt, iterations);

  const cipher = await crypto.subtle.encrypt(
    {
      name: 'AES-GCM',
      iv
    },
    key,
    enc.encode(plainText)
  );

  return {
    v: 1,
    label,
    alg: 'AES-GCM',
    kdf: 'PBKDF2',
    hash: 'SHA-256',
    iterations,
    salt: bytesToB64(salt),
    iv: bytesToB64(iv),
    data: bytesToB64(new Uint8Array(cipher))
  };
}

async function buildPrivateAppPayload(htmlStr, passphrase, meta) {
  return {
    v: 1,
    type: 'mdworks-private-app',
    app: 'MD//WORKS Pro Private App',
    createdAt: new Date().toISOString(),
    meta: {
      filename: meta?.filename || 'document.private.app.html',
      originalFilename: meta?.originalFilename || 'untitled.md',
      note: 'The app body is encrypted. Only this loader is stored in plaintext.'
    },
    primary: await encryptPrivateAppBox(htmlStr, passphrase, 'primary'),
    backup: await encryptPrivateAppBox(htmlStr, passphrase, 'backup')
  };
}

async function exportPrivateStandalone() {
  closeMenus();

  if (!window.crypto || !crypto.subtle || !window.TextEncoder || !window.TextDecoder) {
    alert(
      isJa
        ? 'このブラウザでは暗号化Appを作成できません。\nPC版のChromeまたはEdgeの最新版を推奨します。'
        : 'This browser cannot create a Private App. Latest desktop Chrome or Edge is recommended.'
    );
    return;
  }

  const passphrase = getPrivateAppPassphrase();
  if (!passphrase) return;

  await saveToHistoryList(filenameInput.value, editor.value);

  try {
    showLoader(isJa ? '暗号化Appを作成中...' : 'Creating Private App...');

    const { htmlStr, privateAppName } = buildStandaloneHtmlForExport();

    const payload = await buildPrivateAppPayload(htmlStr, passphrase, {
      filename: privateAppName,
      originalFilename: filenameInput.value.trim() || 'untitled.md'
    });

    const loaderHtml = buildPrivateAppLoader(payload, privateAppName);

    hideLoader();

    if (isMobile) {
      const file = new File([loaderHtml], privateAppName, { type: 'text/html' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: privateAppName }).catch(e => console.warn('Share canceled', e));
      } else {
        triggerDownload(loaderHtml, privateAppName, 'text/html');
      }
    } else {
      triggerDownload(loaderHtml, privateAppName, 'text/html');
      toast(isJa ? '暗号化Appを書き出しました' : 'Private App exported');
    }
  } catch (err) {
    hideLoader();
    console.error(err);
    alert(
      isJa
        ? `暗号化Appの作成に失敗しました。\n${err?.message || err}`
        : `Failed to create Private App.\n${err?.message || err}`
    );
  }
}

function escapeHtmlAttrText(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

<script>
const PRIVATE_APP_PAYLOAD = ${payloadJson};
let decryptedHtml = '';
let rescueFilename = 'rescued.md';

const $ = id => document.getElementById(id);

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function setError(msg) {
  $('error').textContent = msg || '';
}

function setBusy(isBusy) {
  $('unlock-btn').disabled = isBusy;
  $('unlock-btn').textContent = isBusy ? 'Decrypting...' : 'Unlock';
}

function addCheck(label, state, detail) {
  const div = document.createElement('div');
  div.className = 'check ' + state;
  div.textContent = label + ': ' + detail;
  $('checks').appendChild(div);
}

function renderChecks() {
  $('checks').innerHTML = '';

  const hasCrypto = !!(window.crypto && crypto.subtle);
  const hasTextApi = !!(window.TextEncoder && window.TextDecoder);
  const isFile = location.protocol === 'file:';
  const online = navigator.onLine;

  addCheck('Web Crypto API', hasCrypto ? 'ok' : 'bad', hasCrypto ? 'OK' : 'Unavailable');
  addCheck('TextEncoder / TextDecoder', hasTextApi ? 'ok' : 'bad', hasTextApi ? 'OK' : 'Unavailable');
  addCheck('Open mode', isFile ? 'warn' : 'ok', isFile ? 'Local file' : location.protocol);
  addCheck('Network', online ? 'ok' : 'warn', online ? 'Online' : 'Offline');

  if (!hasCrypto || !hasTextApi) {
    setError('このブラウザでは復号できません。PC版ChromeまたはEdgeの最新版で開いてください。');
    $('unlock-btn').disabled = true;
  }
}

async function deriveKey(passphrase, saltB64, iterations) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey(
    'raw',
    enc.encode(passphrase),
    'PBKDF2',
    false,
    ['deriveKey']
  );

  return crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: b64ToBytes(saltB64),
      iterations,
      hash: 'SHA-256'
    },
    material,
    {
      name: 'AES-GCM',
      length: 256
    },
    false,
    ['decrypt']
  );
}

async function decryptBox(box, passphrase) {
  const key = await deriveKey(passphrase, box.salt, box.iterations);
  const plain = await crypto.subtle.decrypt(
    {
      name: 'AES-GCM',
      iv: b64ToBytes(box.iv)
    },
    key,
    b64ToBytes(box.data)
  );
  return new TextDecoder().decode(plain);
}

async function unlock() {
  setError('');
  $('success').style.display = 'none';
  $('rescue').style.display = 'none';

  const passphrase = $('passphrase').value || '';
  if (!passphrase) {
    setError('パスフレーズを入力してください。');
    return;
  }

  setBusy(true);

  const candidates = [
    ['primary', PRIVATE_APP_PAYLOAD.primary],
    ['backup', PRIVATE_APP_PAYLOAD.backup]
  ];

  const errors = [];

  for (const [label, box] of candidates) {
    if (!box) continue;
    try {
      decryptedHtml = await decryptBox(box, passphrase);
      $('success').style.display = 'block';
      setError(label === 'backup'
        ? 'primaryの復号に失敗しましたが、backupから復号できました。ファイル破損に備えて新しいPrivate Appとして書き出し直すことを推奨します。'
        : ''
      );
      setBusy(false);
      return;
    } catch (err) {
      errors.push(label + ': failed');
    }
  }

  setBusy(false);
  setError('復号に失敗しました。パスフレーズが違うか、ファイルが破損している可能性があります。' + (errors.length ? ' [' + errors.join(', ') + ']' : ''));
}

function launchApp() {
  if (!decryptedHtml) return;
  document.open();
  document.write(decryptedHtml);
  document.close();
}

function launchAppBlob() {
  if (!decryptedHtml) return;
  const blob = new Blob([decryptedHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  location.href = url;
}

function rescueText() {
  if (!decryptedHtml) return;

  try {
    const doc = new DOMParser().parseFromString(decryptedHtml, 'text/html');
    const dataScript = doc.getElementById('standalone-data');

    if (!dataScript) {
      throw new Error('standalone-data not found');
    }

    const data = JSON.parse(dataScript.textContent || '{}');
    const content = data.content || '';
    rescueFilename = data.filename || PRIVATE_APP_PAYLOAD?.meta?.originalFilename || 'rescued.md';

    if (!content) {
      throw new Error('content is empty');
    }

    $('rescue-text').value = content;
    $('rescue').style.display = 'block';
  } catch (err) {
    setError('本文救出に失敗しました: ' + (err?.message || err));
  }
}

async function copyRescueText() {
  const text = $('rescue-text').value || '';
  if (!text) return;

  try {
    await navigator.clipboard.writeText(text);
    setError('本文をクリップボードにコピーしました。');
  } catch {
    $('rescue-text').focus();
    $('rescue-text').select();
    document.execCommand('copy');
    setError('本文を選択しました。コピーできない場合は手動でコピーしてください。');
  }
}

function downloadRescueText() {
  const text = $('rescue-text').value || '';
  if (!text) return;

  let name = rescueFilename || 'rescued.md';
  if (!/\\.(md|txt|markdown)$/i.test(name)) name += '.md';

  const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('unlock-btn').addEventListener('click', unlock);
$('launch-btn').addEventListener('click', launchApp);
$('launch-blob-btn').addEventListener('click', launchAppBlob);
$('rescue-btn').addEventListener('click', rescueText);
$('copy-rescue-btn').addEventListener('click', copyRescueText);
$('download-rescue-btn').addEventListener('click', downloadRescueText);

$('passphrase').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});

window.addEventListener('online', renderChecks);
window.addEventListener('offline', renderChecks);

renderChecks();
<\/script>
</body>
</html>`;
}

function triggerDownload(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
//#endregion

//#region [JS-15] OUTLINE, HISTORY & LINTER
function toggleOutline() {
  outlineOpen = !outlineOpen;
  document.getElementById('outline-panel').classList.toggle('show', outlineOpen);
  document.getElementById('outline-check').style.opacity = outlineOpen ? '1' : '0';
  if (outlineOpen) renderOutline(); closeMenus();
}

function renderOutline() {
  const container = document.getElementById('outline-list');
  container.innerHTML = '';
  let charOffset = 0;
  editor.value.split('\n').forEach(line => {
    const m = line.match(/^(#{1,6})\s+(.+)/);
    if (m) {
      const div = document.createElement('div');
      div.className = `ol-item ol-h${m[1].length}`; div.textContent = m[2];
      const target = charOffset; div.onclick = () => jumpToOffset(target);
      container.appendChild(div);
    }
    charOffset += line.length + 1;
  });
}

function jumpToOffset(offset) {
  editor.focus();
  editor.setSelectionRange(offset, offset);
  const lineIndex = editor.value.substring(0, offset).split('\n').length - 1;
  refreshBackdrop();
  requestAnimationFrame(() => {
    const lineEl = backdrop.children[lineIndex];
    if (lineEl) scrollToY(lineEl.offsetTop, 0.5);
  });
}

async function saveToHistoryList(filename, content) {
  if (!content || content.trim() === '' || content === T.defaultMd) return;
  let hist = JSON.parse((await secureGetItem(HISTORY_KEY)) || '[]');
  hist = [{ filename, content, date: Date.now() }, ...hist.filter(h => h.filename !== filename)].slice(0, 10);
  await secureSetItem(HISTORY_KEY, JSON.stringify(hist));
}

async function openHistory() {
  closeMenus();
  const hist = JSON.parse((await secureGetItem(HISTORY_KEY)) || '[]');
  const container = document.getElementById('hist-list');
  container.innerHTML = '';
  if (!hist.length) {
    const empty = document.createElement('div');
    empty.style.padding = '10px';
    empty.textContent = T.historyEmpty;
    container.appendChild(empty);
  }
  hist.forEach(h => {
    const div = document.createElement('div'); div.className = 'hist-item';
    const name = document.createElement('div'); name.className = 'hist-name';
    name.textContent = h.filename || 'untitled.md';
    const date = document.createElement('div'); date.className = 'hist-date';
    date.textContent = new Date(h.date).toLocaleString();
    div.append(name, date);
    div.onclick = () => { editor.value = h.content; filenameInput.value = h.filename; update(); closeHistory(); };
    container.appendChild(div);
  });
  document.getElementById('history-modal').classList.add('show');
}
function closeHistory() { document.getElementById('history-modal').classList.remove('show'); }

function formatDoc() {
  editor.value = editor.value.replace(/\n{3,}/g, '\n\n').split('\n').map(l => l.trimEnd()).join('\n');
  update(); toast(T.formatDone);
}
//#endregion

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function showLoader(msg) {
  const loader = document.getElementById('global-loader');
  const msgEl = document.getElementById('loader-msg');
  if (msgEl) msgEl.textContent = msg || 'Loading...';
  if (loader) loader.classList.add('show');
}

function hideLoader() {
  const loader = document.getElementById('global-loader');
  if (loader) loader.classList.remove('show');
}

//#region [JS-16] HELP DOC MODAL LOGIC
const GITHUB_REPOSITORY_URL = 'https://github.com/HKJPN/markdown-editor';
let docModalReturnFocus = null;

function setDocModalState(isOpen) {
  const modal = document.getElementById('doc-modal');
  if (!modal) return;
  modal.classList.toggle('show', isOpen);
  modal.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
  modal.setAttribute('data-state', isOpen ? 'open' : 'closed');
}

function fallbackDocMarkdownHtml(markdown) {
  const lines = String(markdown || '').split('\n');
  let html = '';
  let inList = false;

  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const inline = text => escapeHtml(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  lines.forEach(line => {
    const heading = line.match(/^(#{2,3})\s+(.+)$/);
    const item = line.match(/^\*\s+(.+)$/);

    if (heading) {
      closeList();
      html += `<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`;
    } else if (item) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(item[1])}</li>`;
    } else if (line.trim()) {
      closeList();
      html += `<p>${inline(line)}</p>`;
    } else {
      closeList();
    }
  });

  closeList();
  return html;
}

function renderDocMarkdown(markdown) {
  const html = safeMarkdownHtml(markdown);
  return html || fallbackDocMarkdownHtml(markdown);
}

function openDocModal(title, markdown) {
  const active = document.activeElement;
  docModalReturnFocus = active && typeof active.focus === 'function' ? active : null;

  closeMenus();
  set('doc-title', title);
  document.getElementById('doc-body').innerHTML = renderDocMarkdown(markdown);
  setDocModalState(true);

  const closeButton = document.querySelector('#doc-modal .doc-head .doc-btn');
  if (closeButton) closeButton.focus({ preventScroll: true });
}

function closeDocModal() {
  const returnFocus = docModalReturnFocus;
  setDocModalState(false);
  docModalReturnFocus = null;

  if (returnFocus && document.contains(returnFocus)) {
    try { returnFocus.focus({ preventScroll: true }); }
    catch (e) { returnFocus.focus(); }
  }
}

function showQuickStart() { openDocModal(T.quickStart, T.quickStartDoc); }
function showKeyboardShortcuts() { openDocModal(T.keyboardShortcuts, T.keyboardShortcutsDoc); }
function showAboutMdworks() { openDocModal(T.aboutMdworks, T.aboutDoc); }

function openGitHubRepo() {
  closeMenus();
  const opened = window.open(GITHUB_REPOSITORY_URL, '_blank', 'noopener,noreferrer');
  if (opened) opened.opener = null;
}
//#endregion

//#region [JS-16] RELEASE NOTES LOGIC
function setReleaseNotesModalState(isOpen) {
  const modal = document.getElementById('rn-modal');
  if (!modal) return;
  modal.classList.toggle('show', isOpen);
  modal.setAttribute('aria-hidden', isOpen ? 'false' : 'true');

function maybeShowReleaseNotes() {

function openReleaseNotesModal() {

${T.releaseNotesContent}`);

function closeRN() { closeReleaseNotesModal(); }

//#region [JS-17] SHORTCUTS, EXPORTS & UTILS
function isElementVisibleByClass(selector, className = 'show') {
  const el = document.querySelector(selector);
  return !!el && el.classList.contains(className);
}

function closeOutlinePanel() {
  outlineOpen = false;
  document.getElementById('outline-panel').classList.remove('show');
  document.getElementById('outline-check').style.opacity = '0';
}

const closableUiRegistry = [
  {
    name: 'doc-modal',
    priority: 110,
    isOpen: () => isElementVisibleByClass('#doc-modal'),
    close: closeDocModal
  },
  {
    name: 'release-notes-modal',
    priority: 100,
    isOpen: () => isElementVisibleByClass('#rn-modal'),
    close: closeRN
  },
  {
    name: 'history-modal',
    priority: 90,
    isOpen: () => isElementVisibleByClass('#history-modal'),
    close: closeHistory
  },
  {
    name: 'search-replace-panel',
    priority: 80,
    isOpen: () => isElementVisibleByClass('#sr-panel'),
    close: closeSearchPanel
  },
  {
    name: 'menu-dropdown',
    priority: 70,
    isOpen: () => !!document.querySelector('.menu-dropdown.open'),
    close: closeMenus
  },
  {
    name: 'spell-check-panel',
    priority: 60,
    isOpen: () => isElementVisibleByClass('#spell-panel'),
    close: closeSpellPanel
  },
  {
    name: 'outline-panel',
    priority: 50,
    isOpen: () => isElementVisibleByClass('#outline-panel'),
    close: closeOutlinePanel
  }
].sort((a, b) => b.priority - a.priority);

function handleGlobalEscape(e) {
  if (e.key !== 'Escape' || e.isComposing || e.keyCode === 229) return;

  const targetUi = closableUiRegistry.find(ui => ui.isOpen());
  if (!targetUi) return;

  targetUi.close();
  e.preventDefault();
  e.stopPropagation();
}

document.addEventListener('keydown', handleGlobalEscape);

window.addEventListener('keydown', e => {
  const m = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if (key === 'a' && m && previewOpen && isPreviewActive && !isEditableSelectionTarget(e.target)) {
    e.preventDefault();
    selectPreviewContents();
    return;
  }
  if (key === 's' && m) { e.preventDefault(); handleSave(e.shiftKey); }
  if (key === 'o' && m) { e.preventDefault(); handleOpen(); }
  if (key === 'f' && m) { e.preventDefault(); openSearchPanel('find'); }
});

function resetDocumentIdentity(filename = 'untitled.md') {
  filenameInput.value = filename;
  fileHandle = null;
  syncFilenameInputState();
}

async function newFile() {
  if (isDirty && !confirm(T.confirmNew)) return;
  await saveToHistoryList(filenameInput.value, editor.value);
  editor.value = T.defaultMd; resetDocumentIdentity(); update(); markSaved();
  await triggerAutoSave();
}

async function closeFile() {
  if (isDirty && !confirm(T.confirmClose)) return;
  await saveToHistoryList(filenameInput.value, editor.value);
  editor.value = ''; resetDocumentIdentity(); update(); markSaved();
  secureRemoveItem(AUTOSAVE_TXT_KEY);
  secureRemoveItem(AUTOSAVE_NAME_KEY);
  toast(T.closedToast);
}

async function execEdit(action) {
  editor.focus(); if (action === 'selectAll') editor.select(); else document.execCommand(action);
}

function exportHtml() {
  const html = `<html><body style="max-width:800px;margin:auto;padding:40px">${safeMarkdownHtml(editor.value)}</body></html>`;
  triggerDownload(html, filenameInput.value.replace('.md', '.html'), 'text/html');
}

let printPrepState = null;

function preparePrintPreview() {
  if (printPrepState) return;

  printPrepState = {
    wasPreviewOpen: previewOpen,
    prevWidth: previewWrap.style.width,
    wasPreviewActive: isPreviewActive,
    previewCheckOpacity: document.getElementById('preview-check')?.style.opacity || '',
    previewEntryActive: document.getElementById('m-preview-entry')?.classList.contains('active') || false,
    previewBtnActive: document.getElementById('preview-toggle-btn')?.classList.contains('active') || false,
    previewBtnPressed: document.getElementById('preview-toggle-btn')?.getAttribute('aria-pressed') || 'false'
  };

  if (!previewOpen) {
    previewOpen = true;
    previewWrap.classList.add('open');
    mainContainer.classList.add('preview-on');
  }

  renderPreview(true);
}

function cleanupPrintPreview() {
  if (!printPrepState) return;

  const {
    wasPreviewOpen,
    prevWidth,
    wasPreviewActive,
    previewCheckOpacity,
    previewEntryActive,
    previewBtnActive,
    previewBtnPressed
  } = printPrepState;

  if (!wasPreviewOpen) {
    previewOpen = false;
    previewWrap.classList.remove('open');
    mainContainer.classList.remove('preview-on');
    previewWrap.style.width = prevWidth || '';
    isPreviewActive = wasPreviewActive;

    const previewCheck = document.getElementById('preview-check');
    const previewEntry = document.getElementById('m-preview-entry');
    const previewBtn = document.getElementById('preview-toggle-btn');

    if (previewCheck) previewCheck.style.opacity = previewCheckOpacity;
    if (previewEntry) previewEntry.classList.toggle('active', previewEntryActive);
    if (previewBtn) {
      previewBtn.classList.toggle('active', previewBtnActive);
      previewBtn.setAttribute('aria-pressed', previewBtnPressed);
    }
  }

  printPrepState = null;
}

window.addEventListener('beforeprint', preparePrintPreview);
window.addEventListener('afterprint', cleanupPrintPreview);

function exportPdf() {
  closeMenus();
  preparePrintPreview();
  requestAnimationFrame(() => window.print());
}
//#endregion
