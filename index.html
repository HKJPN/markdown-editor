<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; object-src 'none'; base-uri 'none';">

<title>MD//WORKS Editor</title>

<script>
  (function() {
    try {
      const saved = localStorage.getItem('mdworks_theme_mode');
      if (saved && (saved === 'paper' || saved === 'warm')) {
        document.documentElement.classList.add('theme-' + saved);
      }
    } catch(e) {}
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/marked@18.0.3/lib/marked.umd.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.5/dist/purify.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/typo-js@1.2.3/typo.js" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CSS INDEX
   [CSS-01] VARIABLES & BASE SETTINGS
   [CSS-02] UI: MENUBAR
   [CSS-03] UI: TITLEBAR
   [CSS-04] UI: TOOLBAR
   [CSS-05] EDITOR & BACKDROP ENGINE
   [CSS-06] PREVIEW AREA
   [CSS-07] SEARCH & REPLACE PANEL
   [CSS-08] STATUS BAR, TOAST & LOADER
   [CSS-09] SPELL CHECK PANEL
   [CSS-10] OUTLINE & HISTORY PANELS
   [CSS-11] RELEASE NOTES MODAL (NEW)
   [CSS-12] THEME VARIANTS (PAPER / WARM)
   [CSS-13] RESPONSIVE & PRINT STYLES
   ========================================================================== */

/* #region [CSS-01] VARIABLES & BASE SETTINGS */
:root {
  --bg:#090b11;
  --surface:#0f131c;
  --surface2:#141a26;
  --surface3:#1b2331;
  --border:#293246;
  --border2:#3a4760;
  --accent:#8f82ff;
  --accent2:#d2cbff;
  --accent-dim:rgba(143,130,255,.14);
  --text:#eef2ff;
  --text2:#aab5d1;
  --text3:#6b7897;
  --success:#5ad7a0;
  --warn:#ebb05b;
  --danger:#f17786;
  --mono:'JetBrains Mono',monospace;
  --serif:'Noto Serif JP',serif;
  --sans:'Zen Kaku Gothic New',sans-serif;
  --shadow-lg:0 24px 64px rgba(0,0,0,.50);
  --shadow-md:0 14px 36px rgba(0,0,0,.34);
  --glow:0 0 0 1px rgba(210,203,255,.055) inset;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--sans);
  color:var(--text);
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(circle at 0% 0%, rgba(143,130,255,.14), transparent 26%),
    radial-gradient(circle at 100% 0%, rgba(90,215,160,.06), transparent 18%),
    linear-gradient(180deg, #0b0e15 0%, #090b11 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(180deg, rgba(255,255,255,.018), transparent 14%, transparent 86%, rgba(255,255,255,.012)),
    radial-gradient(circle at center top, rgba(255,255,255,.03), transparent 46%);
  mix-blend-mode:screen;
}
button,input,textarea{font:inherit}
/* #endregion */

/* #region [CSS-02] UI: MENUBAR */
#menubar{
  height:28px;
  background:rgba(12,15,23,.82);
  border-bottom:1px solid rgba(255,255,255,.045);
  display:flex;
  align-items:stretch;
  padding:0 6px;
  flex-shrink:0;
  position:relative;
  z-index:100;
  box-shadow:var(--glow);
  backdrop-filter:blur(16px);
}
.menu-item{position:relative;display:flex;align-items:center}
.menu-trigger{
  border:none;background:transparent;color:var(--text2);
  font-family:var(--sans);font-size:12px;font-weight:500;
  padding:0 10px;cursor:pointer;border-radius:8px;
  transition:all .12s;height:100%;
}
.menu-trigger:hover,.menu-trigger.open{
  background:rgba(255,255,255,.055);
  color:var(--text);
}
.menu-dropdown{
  display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:260px;
  background:linear-gradient(180deg, rgba(26,32,45,.96), rgba(15,19,28,.97));
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px;padding:6px;
  box-shadow:var(--shadow-lg), var(--glow);
  z-index:200;
  max-height:calc(100vh - 72px);
  overflow-y:auto;
  overscroll-behavior:contain;
}
.menu-dropdown.open{display:block}
.menu-entry{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;border-radius:10px;font-size:13px;color:var(--text2);
  cursor:pointer;transition:all .1s;gap:16px;user-select:none;
}
.menu-entry:hover{
  background:linear-gradient(90deg, rgba(143,130,255,.13), rgba(143,130,255,.04));
  color:var(--text);
}
.menu-entry.active{
  background:linear-gradient(90deg, rgba(143,130,255,.16), rgba(143,130,255,.05));
  color:var(--accent2)
}
.menu-entry.active .menu-check{opacity:1}
.menu-check{opacity:0;color:var(--accent2);font-size:11px;transition:opacity .1s}
.menu-shortcut{font-family:var(--mono);font-size:11px;color:var(--text3)}
.menu-label-with-icon {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.menu-icon {
  width: 1.2em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  font-size: 13px;
  line-height: 1;
}
.menu-entry:hover .menu-icon,
.menu-entry.active .menu-icon {
  color: var(--accent2);
}
.menu-sep-line{height:1px;background:var(--border);margin:5px 0}
.menu-section-label{
  padding:7px 10px 4px;
  font-family:var(--mono);font-size:10px;font-weight:700;
  color:var(--text3);letter-spacing:.08em;text-transform:uppercase;
  user-select:none;opacity:.9;
}
/* #endregion */

/* #region [CSS-03] UI: TITLEBAR */
#titlebar{
  height:56px;background:rgba(15,19,28,.76);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;gap:12px;flex-shrink:0;box-shadow:var(--glow);
}
.title-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#app-name{
  font-size:12px;font-weight:700;color:rgba(210,203,255,.94);
  letter-spacing:.18em;text-transform:uppercase;font-family:var(--mono);
  flex-shrink:0;opacity:.95;
}
#filename-display{
  font-size:13px;color:var(--text2);font-family:var(--mono);
  padding:9px 12px;
  background:linear-gradient(180deg, rgba(255,255,255,.042), rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.085);
  border-radius:14px;
  min-width:220px;max-width:540px;width:100%;
  cursor:text;outline:none;
  transition:border-color .18s,color .18s,box-shadow .18s,transform .12s;
  box-shadow:var(--glow);
}
#filename-display:focus{
  border-color:rgba(143,130,255,.5);color:var(--text);
  box-shadow:0 0 0 4px rgba(143,130,255,.11), var(--glow);
}
#filename-display.locked{
  cursor:default;
  color:var(--text3);
}
#filename-display.locked:focus{
  border-color:rgba(255,255,255,.085);
  box-shadow:var(--glow);
}
.title-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.title-btn{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid rgba(255,255,255,.09);
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.018));
  color:var(--text2);font-size:12px;font-weight:600;
  padding:8px 11px;border-radius:12px;cursor:pointer;transition:all .16s;
  white-space:nowrap;box-shadow:var(--glow);
}
.title-btn:hover{
  background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
  color:var(--text);transform:translateY(-1px);box-shadow:var(--shadow-md), var(--glow);
}
.title-btn.primary{
  background:linear-gradient(180deg, rgba(143,130,255,.26), rgba(143,130,255,.11));
  border-color:rgba(143,130,255,.38);color:var(--accent2);
  box-shadow:0 8px 22px rgba(143,130,255,.16), var(--glow);
}
.title-btn.active{
  background:linear-gradient(180deg, rgba(143,130,255,.24), rgba(143,130,255,.10));
  border-color:rgba(143,130,255,.58);
  color:var(--accent2);
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,.30),
    0 0 0 1px rgba(210,203,255,.10) inset,
    0 0 14px rgba(143,130,255,.12);
  transform:translateY(1px);
}
.title-btn.active::after{
  content:"";
  position:absolute;
  right:7px;
  bottom:5px;
  width:5px;
  height:5px;
  border-radius:999px;
  background:var(--accent2);
  box-shadow:0 0 8px rgba(210,203,255,.7);
}
.title-btn.primary.active{
  background:linear-gradient(180deg, rgba(90,215,160,.24), rgba(90,215,160,.09));
  border-color:rgba(90,215,160,.50);
  color:var(--success);
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,.30),
    0 0 0 1px rgba(90,215,160,.10) inset,
    0 0 14px rgba(90,215,160,.12);
  transform:translateY(1px);
}
.title-btn.primary.active::after{
  background:var(--success);
  box-shadow:0 0 8px rgba(90,215,160,.65);
}

.title-btn.icon-only{
  min-width:38px;
  padding-left:10px;
  padding-right:10px;
  font-size:15px;
  line-height:1;
}
.save-state{
  font-family:var(--mono);font-size:11px;color:var(--success);
  padding:4px 9px;border:1px solid rgba(90,215,160,.25);border-radius:999px;
  white-space:nowrap;flex-shrink:0;
  background:linear-gradient(180deg, rgba(90,215,160,.10), rgba(90,215,160,.03));
  box-shadow:var(--glow);
}
#file-input{display:none}
/* #endregion */

/* #region [CSS-04] UI: TOOLBAR */
#toolbar{
  height:46px;background:rgba(14,18,27,.78);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.045);
  display:flex;align-items:center;padding:0 10px;gap:8px;
  flex-shrink:0;overflow-x:auto;box-shadow:var(--glow);
}
#toolbar::-webkit-scrollbar{height:8px}
#toolbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:999px}
.tool-group{
  display:flex;align-items:center;gap:2px;padding:4px;
  background:linear-gradient(180deg, rgba(255,255,255,.032), rgba(255,255,255,.012));
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;flex-shrink:0;box-shadow:var(--glow);
}
.tool-btn{
  border:none;background:transparent;color:var(--text2);
  font-family:var(--mono);font-size:12px;font-weight:500;
  padding:6px 9px;border-radius:10px;cursor:pointer;transition:all .12s;
  white-space:nowrap;flex-shrink:0;
}
.tool-btn:hover{
  background:linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.022));
  color:var(--text);
}
.tool-btn:active{transform:scale(.97)}
.tool-btn.heading{color:var(--accent2);font-weight:700;text-shadow:0 0 18px rgba(143,130,255,.16)}
/* #endregion */

/* #region [CSS-05] EDITOR & BACKDROP ENGINE */
#main-container{position:relative;display:flex;flex:1;overflow:hidden}

#editor-wrap{
  flex:1;min-width:260px;position:relative;display:flex;
  background:
    linear-gradient(180deg, rgba(255,255,255,.012), transparent 18%),
    linear-gradient(180deg, rgba(12,15,22,.82), rgba(10,13,19,.76));
}
#editor, #editor-backdrop{
  font-family:var(--mono);font-size:14.5px;line-height:1.82;
  padding:30px 34px;tab-size:2;white-space:pre-wrap;word-wrap:break-word;
  overflow-wrap:break-word;width:100%;height:100%;border:none;outline:none;margin:0;
}
#editor-backdrop{
  position:absolute;inset:0;color:transparent;pointer-events:none;z-index:1;
  overflow-y:auto;background:transparent;
}

#editor-backdrop .editor-line{
  display:block;
  min-height:1.82em;
  margin: 0 -0.18em;
  padding: 0 0.18em;
  border-radius:8px;
}
#editor-backdrop .editor-line.blank{ min-height:1.82em; }

#editor-backdrop .task-open-line{
  background:linear-gradient(90deg, rgba(235,176,91,.16), rgba(235,176,91,.045) 48%, transparent 84%);
  box-shadow:inset 0 0 0 1px rgba(235,176,91,.06);
}
#editor-backdrop .task-done-line{
  background:linear-gradient(90deg, rgba(90,215,160,.13), rgba(90,215,160,.04) 48%, transparent 84%);
  box-shadow:inset 0 0 0 1px rgba(90,215,160,.055);
}

#editor-backdrop mark{
  background:rgba(143,130,255,.30);
  color:transparent;
  border-radius:4px;
  box-shadow:0 0 0 1px rgba(143,130,255,.08);
}
#editor-backdrop mark.active{
  background:rgba(235,176,91,.56);
  box-shadow:0 0 0 1px rgba(235,176,91,.22);
}
#editor-backdrop mark.spell-error {
  background: rgba(241, 119, 134, 0.15);
  border-bottom: 2px dashed rgba(241, 119, 134, 0.8);
  border-radius: 2px;
  box-shadow: none;
}

#editor-backdrop .invis{
  position:relative;
  color:transparent;
}
#editor-backdrop .invis::after{
  pointer-events:none;
  user-select:none;
  color:var(--text3);
  opacity:.55;
  position:absolute;
  left:0;
  top:0;
}
#editor-backdrop .invis-zenkaku::after{content:'□'}
#editor-backdrop .invis-tab{
  background:rgba(107,120,151,.10);
  border-radius:3px;
}
#editor-backdrop .invis-tab::after{
  content:'→';
  left:.12em;
  opacity:.75;
}
#editor-backdrop .invis-eol-space::after{content:'·'}
#editor-backdrop .invis-nl{
  display:inline-block;
  width:0;
  height:1em;
  line-height:1;
  position:relative;
  vertical-align:baseline;
  overflow:visible;
}
#editor-backdrop .invis-nl::after{
  content:'↵';
  pointer-events:none;
  user-select:none;
  color:var(--text3);
  opacity:.55;
  position:absolute;
  left:.15em;
  top:0;
  line-height:1;
}

#editor{
  position:absolute;inset:0;z-index:2;resize:none;background:transparent;
  color:#f2f5ff;caret-color:var(--accent2);
}
#editor::placeholder{color:#7482a1}
#editor::selection{background:rgba(124,106,247,.35)}

#splitter{width:10px;background:transparent;cursor:col-resize;display:none;position:relative;flex-shrink:0; touch-action:none;}
#splitter::after{
  content:"";position:absolute;top:50%;left:50%;width:4px;height:62px;
  transform:translate(-50%,-50%);border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.22), rgba(255,255,255,.06));
  box-shadow:0 0 0 1px rgba(255,255,255,.05);
}
#splitter:hover::after{background:var(--accent2)}
#main-container.preview-on #splitter{display:block}
/* #endregion */

/* #region [CSS-06] PREVIEW AREA */
#preview-wrap{
  width:0;min-width:0;overflow:hidden;
  background:linear-gradient(180deg, rgba(16,20,30,.88), rgba(10,13,19,.95));
  transition:width .25s cubic-bezier(.4,0,.2,1);
  border-left:1px solid rgba(255,255,255,.055);
  box-shadow:inset 1px 0 0 rgba(255,255,255,.03);
}
#preview-wrap.open{ width:42%;min-width:320px;border-left-width:0;overflow-y:auto }
#preview{ font-family:var(--serif);font-size:15px;line-height:1.95;color:#eef1fc; padding:42px 50px;max-width:760px }
#preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6{ font-family:var(--sans);font-weight:700;margin:1.6em 0 .5em;line-height:1.3;color:var(--text) }
#preview h1{ font-size:29px;padding-bottom:.35em;border-bottom:1px solid rgba(255,255,255,.13);letter-spacing:.01em }
#preview h2{ font-size:21px;padding-bottom:.25em;border-bottom:1px solid rgba(255,255,255,.09) }
#preview h3{ font-size:17px;color:var(--accent2) }
#preview h4{ font-size:15px }
#preview p{ margin:.7em 0 }
#preview ul,#preview ol{ margin:.7em 0;padding-left:1.6em }
#preview li{ margin:.25em 0 }
#preview a{ color:var(--accent2);text-decoration:none }
#preview a:hover{ text-decoration:underline }
#preview strong{ font-weight:700;color:var(--text) }
#preview em{ font-style:italic;color:var(--text2) }
#preview code{ font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:1px 6px;color:var(--accent2) }
#preview pre{ background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.018)); border:1px solid rgba(255,255,255,.085);border-radius:14px; padding:16px 20px;overflow-x:auto;margin:1em 0;box-shadow:var(--glow) }
#preview pre code{ background:none;border:none;padding:0;color:var(--text);font-size:13.5px }
#preview blockquote{ border-left:3px solid rgba(143,130,255,.9);margin:1.1em 0;padding:8px 16px; color:var(--text2); background:linear-gradient(90deg, rgba(143,130,255,.13), rgba(143,130,255,.035)); border-radius:0 12px 12px 0 }
#preview hr{ border:none;border-top:1px solid var(--border2);margin:1.5em 0 }
#preview table{ border-collapse:separate;border-spacing:0;width:100%;margin:1em 0; font-family:var(--sans);font-size:14px;overflow:hidden;border-radius:14px; border:1px solid rgba(255,255,255,.08) }
#preview th,#preview td{ border-bottom:1px solid rgba(255,255,255,.06);padding:10px 12px }
#preview th{ background:rgba(255,255,255,.045);font-weight:500;color:var(--accent2) }
#preview tr:nth-child(even) td{ background:rgba(255,255,255,.02) }
#preview img{ max-width:100%;border-radius:6px;border:1px solid var(--border) }
#preview sup,
#preview sub {
  font-size: 75%;
  line-height: 0;
  position: relative;
  vertical-align: baseline;
}

#preview sup {
  bottom: 0.5em;
}

#preview sub {
  top: 0.25em;
}

#preview li.task-open-item, #preview li.task-done-item{ list-style:none; display:flex; align-items:flex-start; gap:.72em; margin:.28em 0; padding:.42em .58em .42em .48em; border-radius:10px; transition:background-color .16s ease, opacity .16s ease, color .16s ease; }
#preview li.task-open-item:hover, #preview li.task-done-item:hover{ background:rgba(255,255,255,.032); }
#preview li.task-open-item input[type="checkbox"], #preview li.task-done-item input[type="checkbox"]{ flex:0 0 auto; margin:.18em 0 0; width:15px; height:15px; accent-color:var(--accent2); opacity:.95; transform:scale(.96); }
#preview li.task-open-item{ color:var(--text); opacity:.98; }
#preview li.task-open-item:hover{ background:linear-gradient(90deg, rgba(143,130,255,.08), rgba(143,130,255,.02)); }
#preview li.task-done-item{ color:var(--text2); opacity:.72; text-decoration:line-through; text-decoration-color:rgba(255,255,255,.14); text-decoration-thickness:1px; text-underline-offset:.14em; }
#preview li.task-done-item:hover{ background:rgba(255,255,255,.022); opacity:.82; }
#preview li.task-done-item strong, #preview li.task-done-item em, #preview li.task-done-item code, #preview li.task-done-item a{ opacity:.86; }
#preview li.task-done-item a{ color:var(--text2) }
#preview li.task-done-item a:hover{ color:var(--accent2) }
/* #endregion */

/* #region [CSS-07] SEARCH & REPLACE PANEL */
#sr-panel{
  position:absolute;top:12px;right:18px;width:392px;
  background:linear-gradient(180deg, rgba(29,35,49,.95), rgba(17,21,31,.96));
  border:1px solid rgba(255,255,255,.085); border-radius:18px;
  box-shadow:var(--shadow-lg), var(--glow);
  z-index:150;display:none;flex-direction:column;font-family:var(--sans);
  overflow:hidden;backdrop-filter:blur(16px)
}
#sr-panel.show{display:flex}
#sr-tabs{display:flex;background:rgba(255,255,255,.015);border-bottom:1px solid var(--border)}
.sr-tab{flex:1;background:none;border:none;color:var(--text3);padding:9px 0;font-size:12px;font-weight:700;cursor:pointer;transition:color .1s}
.sr-tab:hover{color:var(--text)}
.sr-tab.active{color:var(--accent2);border-bottom:2px solid var(--accent2)}
#sr-close{background:none;border:none;color:var(--text3);padding:0 12px;cursor:pointer;font-size:14px;transition:color .1s}
#sr-close:hover{color:var(--text)}
#sr-body{padding:12px}
.sr-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sr-input-wrapper{flex:1;position:relative;display:flex;align-items:center}
.sr-input{
  width:100%;height:36px;background:rgba(255,255,255,.026);
  border:1px solid rgba(255,255,255,.08);color:var(--text);
  font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:10px;outline:none
}
.sr-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(143,130,255,.1)}
.sr-count{font-size:11px;color:var(--text3);font-family:var(--mono);position:absolute;right:10px;pointer-events:none}
.sr-nav-btn,.sr-action-btn{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.085); color:var(--text2);border-radius:10px;cursor:pointer; transition:all .1s
}
.sr-nav-btn{height:36px;padding:4px 10px;font-size:12px}
.sr-action-btn{height:36px;padding:6px 12px;font-size:12px;font-weight:500;flex:1}
.sr-nav-btn:hover,.sr-action-btn:hover{ background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.03)); color:var(--text) }
.sr-options{display:flex;gap:12px;font-size:11px;color:var(--text2);margin-bottom:8px;user-select:none;flex-wrap:wrap}
.sr-options label{display:flex;align-items:center;gap:4px;cursor:pointer}
.sr-options input[type="checkbox"]{accent-color:var(--accent)}
.sr-error-msg{color:var(--danger);font-size:11px;margin-bottom:8px;display:none}
#sr-replace-area{display:none}
/* #endregion */

/* #region [CSS-08] STATUS BAR, TOAST & LOADER */
#statusbar{
  height:26px;background:rgba(12,15,23,.74);
  border-top:1px solid rgba(255,255,255,.045);
  display:flex;align-items:center;padding:0 12px;gap:14px;flex-shrink:0;box-shadow:var(--glow)
}
.stat-item{font-family:var(--mono);font-size:10.5px;color:var(--text3);display:flex;align-items:center;gap:5px}
.stat-label{color:var(--text3)}
.stat-val{color:var(--text2);font-weight:500}
.stat-item.accent .stat-val{color:var(--accent2)}
#spell-status{font-family:var(--mono);font-size:10.5px;color:var(--text3);margin-left:auto;margin-right:10px}
#spell-status.on{color:var(--warn)}
#storage-badge {font-family:var(--mono);font-size:10px;font-weight:600;color:var(--accent2);padding:2px 6px;border-radius:4px;background:var(--surface3);}

#toast{
  position:fixed;bottom:38px;left:50%; transform:translateX(-50%) translateY(20px);
  background:linear-gradient(180deg, rgba(29,34,48,.97), rgba(18,23,33,.98));
  border:1px solid rgba(255,255,255,.08);color:var(--text);
  font-family:var(--sans);font-size:13px;padding:9px 18px;border-radius:14px;
  opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;z-index:999;
  box-shadow:var(--shadow-lg), var(--glow)
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#global-loader{
  display:none;position:fixed;inset:0;background:rgba(10,11,16,.76);
  backdrop-filter:blur(6px);z-index:9999;align-items:center;justify-content:center;flex-direction:column
}
#global-loader.show{display:flex}
.loader-spinner{
  width:48px;height:48px;border:3px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px
}
.loader-text{font-family:var(--mono);font-size:13px;color:var(--text2);letter-spacing:.05em}
/* #endregion */

/* #region [CSS-09] SPELL CHECK PANEL */
#spell-panel{
  position:fixed;bottom:36px;right:20px;width:332px;
  background:linear-gradient(180deg, rgba(29,35,49,.95), rgba(17,21,31,.96));
  border:1px solid rgba(255,255,255,.085); border-radius:18px;padding:0;z-index:300;display:none;
  box-shadow:var(--shadow-lg), var(--glow);overflow:hidden;backdrop-filter:blur(16px)
}
#spell-panel.show{display:block}
#sph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 9px;border-bottom:1px solid var(--border)}
#sph h3{font-size:11px;color:var(--text3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
#spell-close{border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;border-radius:3px;transition:color .1s}
#spell-close:hover{color:var(--text)}
#spell-loading{padding:14px 12px;font-family:var(--mono);font-size:12px;color:var(--text3);display:none;align-items:center;gap:8px}
#spell-loading.show{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-icon{width:12px;height:12px;border:1.5px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
#spell-list{max-height:260px;overflow-y:auto;padding:4px}
#spell-list::-webkit-scrollbar{width:8px}
#spell-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:999px}
#spell-empty{font-size:13px;color:var(--success);padding:12px;display:none}
.spell-word{padding:6px 8px;border-radius:8px;margin-bottom:2px}
.spell-word:hover{background:rgba(255,255,255,.03)}
.spell-word-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
.spell-word-text{font-family:var(--mono);font-size:13px;color:var(--danger);flex:1}
.spell-actions{display:flex;gap:4px;flex-shrink:0}
.spell-btn{ font-size:10px;color:var(--text3);padding:2px 7px;border:1px solid var(--border); border-radius:8px;cursor:pointer;background:transparent;font-family:var(--sans);transition:all .1s;white-space:nowrap }
.spell-btn:hover{color:var(--text2);border-color:var(--border2);background:var(--surface3)}
.spell-btn.add{color:var(--accent2);border-color:rgba(124,106,247,.3)}
.spell-btn.add:hover{background:var(--accent-dim)}
.spell-suggestions{display:flex;flex-wrap:wrap;gap:4px}
.spell-sug{ font-size:11px;font-family:var(--mono);color:var(--text2);padding:2px 7px; background:var(--surface3);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .1s }
.spell-sug:hover{color:var(--accent2);border-color:rgba(124,106,247,.4);background:var(--accent-dim)}
#spell-footer{font-family:var(--mono);font-size:11px;color:var(--text3);padding:7px 12px;border-top:1px solid var(--border);display:none}
#spell-footer span{color:var(--danger);font-weight:500}
/* #endregion */

/* #region [CSS-10] OUTLINE & HISTORY PANELS */
#outline-panel {
  position:fixed; top:90px; right:20px; width:280px; 
  background:linear-gradient(180deg, rgba(29,35,49,.95), rgba(17,21,31,.96));
  border:1px solid rgba(255,255,255,.085); border-radius:16px;
  box-shadow:var(--shadow-lg), var(--glow); z-index:140; display:none; 
  flex-direction:column; overflow:hidden; backdrop-filter:blur(16px);
  max-height: calc(100vh - 140px);
}
#outline-panel.show { display:flex; }
#outline-panel .op-head { display:flex; align-items:center; justify-content:space-between; padding:10px 12px 9px; border-bottom:1px solid var(--border); }
#outline-panel .op-head h3 { font-size:11px; color:var(--text3); font-weight:500; letter-spacing:.06em; text-transform:uppercase; font-family:var(--mono); }
#outline-list { overflow-y:auto; padding:6px; flex:1; }
#outline-list::-webkit-scrollbar{width:8px}
#outline-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:999px}
.ol-item { padding:6px 10px; font-size:13px; color:var(--text2); cursor:pointer; border-radius:8px; transition:all 0.1s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; font-family:var(--sans); }
.ol-item:hover { background:var(--surface3); color:var(--text); }
.ol-h1 { font-weight:700; color:var(--accent2); margin-top:4px; font-size:13.5px; }
.ol-h2 { padding-left:18px; }
.ol-h3 { padding-left:28px; font-size:12px; }
.ol-h4, .ol-h5, .ol-h6 { padding-left:38px; font-size:11.5px; opacity:0.8; }

#history-modal {
  position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px);
}
#history-modal.show { display:flex; }
.hist-content {
  background:linear-gradient(180deg, rgba(29,35,49,.98), rgba(17,21,31,.98));
  border: 1px solid rgba(255,255,255,.085); border-radius: 18px; width: 440px; max-width:90%; padding: 20px; box-shadow: var(--shadow-lg), var(--glow); display:flex; flex-direction:column;
}
.hist-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:10px; }
.hist-head h3 { font-size:14px; font-weight:700; color:var(--text); font-family:var(--sans); }
#hist-list { max-height:40vh; overflow-y:auto; font-size:13px; padding-right:4px;}
#hist-list::-webkit-scrollbar{width:8px}
#hist-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:999px}
.hist-item {
  padding: 12px; border: 1px solid transparent; border-bottom-color: rgba(255,255,255,.04); cursor: pointer; transition: all 0.12s; border-radius:10px; display:flex; justify-content:space-between; align-items:center; gap:12px;
}
.hist-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,.08); }
.hist-name { font-family:var(--mono); color:var(--accent2); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hist-date { font-size:11px; color:var(--text3); font-family:var(--mono); flex-shrink:0; }
/* #endregion */

/* #region [CSS-11] RELEASE NOTES MODAL (NEW) */
#rn-modal,
#doc-modal {
  position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px);
}
#rn-modal.show,
#doc-modal.show { display:flex; }
.rn-content,
.doc-content {
  background:linear-gradient(180deg, rgba(29,35,49,.98), rgba(17,21,31,.98));
  border: 1px solid rgba(255,255,255,.085); border-radius: 18px; width: 600px; max-width:90%; max-height: 85vh; display:flex; flex-direction:column; box-shadow: var(--shadow-lg), var(--glow); overflow:hidden;
}
.rn-head,
.doc-head { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); background:rgba(0,0,0,0.2); }
.rn-head h3,
.doc-head h3 { font-size:15px; font-weight:700; color:var(--text); font-family:var(--sans); margin:0; }
.rn-body,
.doc-body { padding:20px; overflow-y:auto; font-family:var(--sans); font-size:14px; line-height:1.6; color:var(--text2); }
.rn-body h2,
.doc-body h2 { color:var(--text); font-size:18px; margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:6px;}
.rn-body h3,
.doc-body h3 { color:var(--accent2); font-size:15px; margin:16px 0 8px; }
.rn-body p,
.doc-body p { margin-bottom:12px; }
.rn-body ul,
.doc-body ul { padding-left:20px; margin-bottom:12px; }
.rn-body li,
.doc-body li { margin-bottom:6px; }
.rn-body a,
.doc-body a { color:var(--accent2); }
.rn-body code,
.doc-body code { font-family:var(--mono); background:rgba(255,255,255,0.06); padding:2px 5px; border-radius:4px; font-size:0.9em; color:var(--accent2); }
.rn-foot,
.doc-foot { padding:12px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; background:rgba(0,0,0,0.2); }
.rn-btn,
.doc-btn { background:var(--accent); color:#fff; border:none; padding:8px 24px; border-radius:8px; cursor:pointer; font-weight:600; font-family:var(--sans); transition:opacity 0.2s;}
.rn-btn:hover,
.doc-btn:hover { opacity:0.8; }
/* #endregion */

/* #region [CSS-12] THEME VARIANTS (PAPER / WARM)
   Midnight remains the default :root theme. Paper and Warm only override
   visual variables and presentation styles; editing/saving logic is untouched.
   ========================================================================== */

/* Paper Theme: clean, light, document-first. Intended as a future Lite default. */
body.theme-paper {
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface2:#f1f4f9;
  --surface3:#e8edf5;
  --border:#d8dee9;
  --border2:#c6cfdd;
  --accent:#6d5dfc;
  --accent2:#5146d8;
  --accent-dim:rgba(109,93,252,.10);
  --text:#1f2937;
  --text2:#4b5563;
  --text3:#8a94a6;
  --success:#15803d;
  --warn:#b7791f;
  --danger:#dc2626;
  --shadow-lg:0 18px 44px rgba(30,41,59,.14);
  --shadow-md:0 10px 24px rgba(30,41,59,.10);
  --glow:0 0 0 1px rgba(15,23,42,.035) inset;
  background:
    radial-gradient(circle at 0% 0%, rgba(109,93,252,.06), transparent 26%),
    linear-gradient(180deg, #fbfcff 0%, #f5f7fb 100%);
}

/* Sepia / Warm Theme: softer long-form writing mode. */
body.theme-warm {
  --bg:#f3eadb;
  --surface:#fff8ec;
  --surface2:#f7eddc;
  --surface3:#eadcc8;
  --border:#dccab2;
  --border2:#cbb390;
  --accent:#b7791f;
  --accent2:#8a5a16;
  --accent-dim:rgba(183,121,31,.12);
  --text:#2f2418;
  --text2:#5f4b36;
  --text3:#9a856b;
  --success:#4f7d3a;
  --warn:#a16207;
  --danger:#b45309;
  --shadow-lg:0 18px 44px rgba(92,64,38,.16);
  --shadow-md:0 10px 24px rgba(92,64,38,.11);
  --glow:0 0 0 1px rgba(92,64,38,.035) inset;
  background:
    radial-gradient(circle at 0% 0%, rgba(183,121,31,.08), transparent 28%),
    linear-gradient(180deg, #fff8ec 0%, #f3eadb 100%);
}

body.theme-paper::before,
body.theme-warm::before{
  mix-blend-mode:normal;
  background:
    linear-gradient(180deg, rgba(255,255,255,.25), transparent 20%, transparent 84%, rgba(255,255,255,.16)),
    radial-gradient(circle at center top, rgba(255,255,255,.28), transparent 50%);
}
body.theme-warm::before{
  background:
    linear-gradient(180deg, rgba(255,248,236,.36), transparent 20%, transparent 84%, rgba(92,64,38,.05)),
    radial-gradient(circle at center top, rgba(255,248,236,.36), transparent 50%);
}

/* Shared light-theme surfaces */
body.theme-paper #menubar,
body.theme-paper #titlebar,
body.theme-paper #toolbar,
body.theme-paper #statusbar,
body.theme-warm #menubar,
body.theme-warm #titlebar,

  backdrop-filter:blur(16px);
}
body.theme-warm #menubar,
body.theme-warm #titlebar,

  background:rgba(255,248,236,.78);
}

body.theme-warm .menu-trigger,

body.theme-paper #app-name,
body.theme-warm .menu-entry.active,

  color:var(--accent2);
}
body.theme-warm #preview code{background:rgba(92,64,38,.06)}
body.theme-paper #preview pre,
body.theme-warm #preview pre{
  background:linear-gradient(180deg, rgba(255,255,255,.76), rgba(255,255,255,.42));
  border-color:var(--border);
}
body.theme-warm #preview pre{
  background:linear-gradient(180deg, rgba(255,248,236,.76), rgba(247,237,220,.46));
}
body.theme-paper #preview blockquote,
body.theme-warm #preview blockquote{
  border-left-color:var(--accent);
  background:var(--accent-dim);
  color:var(--text2);
}
body.theme-paper #preview table,
body.theme-warm #preview table{border-color:var(--border)}
body.theme-paper #preview th,
body.theme-warm #preview th{
  background:var(--surface2);
  color:var(--accent2);
}
body.theme-paper #preview th,
body.theme-paper #preview td,
body.theme-warm #preview th,
body.theme-warm #preview td{border-bottom-color:var(--border)}

/* Warm is intentionally a little more relaxed for long-form writing. */
body.theme-warm #editor,
body.theme-warm #editor-backdrop{
  font-size:15.5px;
  line-height:1.9;
}
body.theme-warm #preview{
  font-size:15.5px;
  line-height:2.0;
}
body.theme-warm #preview li.task-done-item,
body.theme-paper #preview li.task-done-item{color:var(--text2)}

body.theme-paper #toast,
body.theme-warm #toast{
  background:linear-gradient(180deg, var(--surface), var(--surface2));
  border-color:var(--border);
  color:var(--text);
}

/* #endregion */

/* #region [CSS-13] RESPONSIVE & PRINT STYLES */
@media (max-width: 1024px) {
  #menubar { height: 44px; padding: 0 10px; }
  .menu-trigger { padding: 0 16px; font-size: 14px; }
  .menu-entry { padding: 12px 16px; font-size: 15px; }
  .menu-shortcut { font-size: 13px; }
  #titlebar { height: 60px; }
  .title-btn { padding: 10px 14px; font-size: 13px; }
  #toolbar { height: 50px; }
  .tool-btn { padding: 8px 12px; font-size: 14px; }
}
@media (max-width:980px){
  #titlebar{padding:0 10px;gap:8px}
  #filename-display{min-width:140px;max-width:none}
  .title-actions{gap:6px}
  .title-btn{padding:6px 8px;font-size:11px}
  #sr-panel{right:10px;left:10px;width:auto}
  #preview{padding:28px}
}
@media (max-width:760px){
  #app-name{display:none}
  .save-state{display:none}
  #toolbar{height:42px}
  #preview-wrap.open{width:100%!important;min-width:0}
  #main-container.preview-on #splitter{display:none}
  #outline-panel{right:10px; left:10px; width:auto; max-height:40vh;}
}
@media print{
  html,body{
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    overflow:visible!important;
    background:#fff!important;
  }
  #menubar,#titlebar,#toolbar,#statusbar,#editor-wrap,#splitter,#spell-panel,#toast,#sr-panel,#outline-panel,#history-modal,#rn-modal,#doc-modal{display:none!important}
  body{display:block!important;color:#000!important}
  #main-container{
    display:block!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    overflow:visible!important
  }
  #preview-wrap{
    display:block!important;
    width:auto!important;
    min-width:0!important;
    max-width:none!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    overflow:visible!important;
    position:static!important;
    border:none!important;
    background:#fff!important;
    box-shadow:none!important
  }
  #preview{
    display:block!important;
    width:auto!important;
    max-width:none!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    overflow:visible!important;
    padding:0!important;
    color:#000!important;
    background:#fff!important
  }
  #preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6,#preview p,#preview li,#preview strong{color:black!important}
  #preview em{color:#333!important}
  #preview code{border:1px solid #ccc!important;color:black!important;background:transparent!important}
  #preview pre{border:1px solid #ccc!important;background:transparent!important;page-break-inside:avoid}
  #preview blockquote{border-left-color:#999!important;background:transparent!important;color:#444!important}
  #preview table{width:100%!important;border-collapse:collapse!important}
  #preview th{background:#f0f0f0!important;color:black!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h1,h2,h3{page-break-after:avoid}
  img{max-width:100%!important;page-break-inside:avoid}
}
/* Zen Mode (Focus Mode) */
body.zen-mode #menubar, body.zen-mode #titlebar, body.zen-mode #toolbar, body.zen-mode #statusbar, body.zen-mode #splitter, body.zen-mode #preview-wrap { display: none !important; }
body.zen-mode #main-container { height: 100vh; }
body.zen-mode #editor-wrap { max-width: 840px; margin: 0 auto; border-left: 1px solid rgba(255,255,255,.05); border-right: 1px solid rgba(255,255,255,.05); }

#zen-exit-btn {
  position: fixed; top: 24px; right: 24px; width: 48px; height: 48px; border-radius: 24px;
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.1); color: var(--text2); font-size: 18px; z-index: 9999;
  cursor: pointer; backdrop-filter: blur(12px); box-shadow: var(--shadow-lg), var(--glow);
  display: none; align-items: center; justify-content: center; transition: all 0.2s ease;
}
#zen-exit-btn:hover, #zen-exit-btn:active {
  color: var(--text); background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); transform: scale(1.05);
}
body.zen-mode #zen-exit-btn { display: flex; }
/* #endregion */

<script>
/* ==========================================================================
   JAVASCRIPT INDEX
   [JS-01] ENVIRONMENT & I18N (DICTIONARY)
   [JS-02] DOM REFERENCES & STATE VARIABLES
   [JS-03] SECURE STORAGE & ENCRYPTION LOGIC (NEW: Auto/Private mode via IndexedDB)
   [JS-04] BOOTSTRAP & AUTO-SAVE LOGIC
   [JS-05] UI TOGGLES & MENU HANDLING
   [JS-06] EDITOR EVENTS & STATS UPDATER (w/ Image Drag & Drop)
   [JS-07] PREVIEW RENDERING & DECORATION
   [JS-08] BACKDROP ENGINE (TINT & HIGHLIGHT)
   [JS-09] LIST & TASK BULK TOGGLING
   [JS-10] SEARCH & REPLACE LOGIC
   [JS-11] SPELL CHECK (HUNSPELL)
   [JS-12] TEXT INSERTION HELPERS
   [JS-13] WORD IMPORT (MAMMOTH + TURNDOWN)
   [JS-14] FILE SYSTEM (OPEN / SAVE / STANDALONE)
   [JS-15] OUTLINE, HISTORY & LINTER
   [JS-16] RELEASE NOTES LOGIC
   [JS-17] SHORTCUTS, EXPORTS & UTILS
   ========================================================================== */

//#region [JS-01] ENVIRONMENT & I18N (DICTIONARY)
const isIPadOS = (navigator.platform === 'MacIntel' || /Macintosh/i.test(navigator.userAgent)) && navigator.maxTouchPoints > 1;
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || isIPadOS || (navigator.maxTouchPoints > 0 && window.innerWidth <= 1024);

const isJa = (navigator.language || navigator.languages?.[0] || '').startsWith('ja');
document.documentElement.lang = isJa ? 'ja' : 'en';
const APP_VERSION = '1.5.5';
const RELEASE_NOTES_STORAGE_KEY = 'mdworks_seen_release_notes_version';

const T = {
  menuFile:    isJa ? 'ファイル' : 'File',
  menuView:    isJa ? '表示'     : 'View',
  menuEdit:    isJa ? '編集'     : 'Edit',
  menuHelp:    isJa ? 'ヘルプ'   : 'Help',
  newFile:     isJa ? '新規作成' : 'New',
  closeMenu:   isJa ? '閉じる'   : 'Close',
  confirmClose:isJa ? '編集中の内容は失われます。ファイルを閉じますか？' : 'Unsaved changes will be lost. Close file?',
  closedToast: isJa ? 'ファイルを閉じました' : 'File closed',
  open:        isJa ? '開く'     : 'Open',

## Quick Start

MD//WORKS は、1つのHTMLで動くMarkdownエディタです。下書き、プレビュー、保存、スタンドアロン書き出しを同じ画面で行えます。

### 1. 書き始める
* 中央のエディタにMarkdownを入力します。
* 見出し、リスト、引用、コード、表はツールバーからも挿入できます。
* 画像は小さなローカル画像をドラッグ＆ドロップできます。

### 2. プレビューする
* **View > Preview** またはタイトルバーの **Preview** で表示を切り替えます。
* Markdownは安全のためサニタイズされたHTMLとして表示されます。

### 3. 保存する
* **File > Save** でMarkdownファイルとして保存します。
* **File > Export as App** で、現在の原稿を含んだスタンドアロンHTMLを書き出せます。
* Auto encrypted では、ローカルの下書きと履歴を平文のまま保存しないようにします。
* **Private Storage** を使うと、ローカルの下書きと履歴にパスフレーズによる追加保護をかけられます。

### 4. 探す・整える
* **Edit > Find** / **Replace** で検索と置換を行います。
* **Edit > Format Markdown** で余分な空行や行末スペースを整えます。

### 5. オフラインで使う
* スタンドアロンHTMLはネットワークがなくても開けます。
* このヘルプ本文はアプリ内に埋め込まれているため、外部ドキュメントの取得は行いません。

## Quick Start

MD//WORKS is a single-file Markdown editor for drafting, previewing, saving, and exporting standalone documents.

### 1. Start writing
* Type Markdown in the central editor.
* Use the toolbar to insert headings, lists, quotes, code blocks, links, tables, and rules.
* Drop small local images into the editor when you want embedded assets.

### 2. Preview safely
* Toggle **View > Preview** or the title-bar **Preview** button.
* Markdown is rendered as sanitized HTML before it is shown.

### 3. Save your work
* Use **File > Save** to save a Markdown file.
* Use **File > Export as App** to export a standalone HTML file containing the current draft and editor.
* **Auto encrypted** helps avoid storing local drafts and history as plain text.
* Enable **Private Storage** when you want passphrase-based protection for local drafts and history.

### 4. Find and tidy
* Use **Edit > Find** / **Replace** for search and replacement.
* Use **Edit > Format Markdown** to clean excess blank lines and trailing spaces.

### 5. Work offline
* Standalone HTML exports can open without a network connection.
* This help content is embedded in the app and never fetched from an external document.

## About MD//WORKS

MD//WORKS is a Markdown editor focused on safe writing, previewing, and portable standalone exports.

### Focus
* **Standalone first**: Export the editor and the current draft as a single HTML file.
* **Privacy aware**: Drafts and history stay local. Auto encrypted helps avoid plain-text local storage, and Private Storage adds optional passphrase-based protection.

* MD//WORKS v1.5.5

## v1.5.5 - Writing Comfort and File Handling Improvements

* **不可視文字の表示に対応しました。**
  全角スペース、タブ、行末スペース、改行を画面上で確認できるようになりました。日本語文書やMarkdown原稿の表記ゆれ・余分な空白の確認に便利です。

* **Tab操作を強化しました。**
  Tab入力、複数行インデント、Shift+Tabによるアウトデントに対応し、リストやコード、引用ブロックの編集がしやすくなりました。

## v1.5.5 - Writing Comfort and File Handling Improvements

* **Invisible characters can now be shown.**
  Full-width spaces, tabs, trailing spaces, and line breaks can now be displayed in the editor, making it easier to clean up Markdown drafts and Japanese documents.

* **Tab editing has been improved.**
  You can now insert tabs, indent multiple selected lines, and outdent lines with Shift+Tab. This makes lists, code blocks, and quoted sections easier to edit.

* **Zen Mode and Fullscreen have been added.**
  You can switch to a cleaner writing environment with fewer on-screen distractions.

* **File handling has been improved.**
  After using New or Close, Open can more easily return to the previously used folder. An issue where .md could be lost when saving Japanese filenames has also been fixed.

* **Storage protection and safety have been improved.**
  Local Auto Save data is protected against plain-text storage extraction. Private Storage remains available when you want additional passphrase-based protection. Word import and image handling have also received minor safety improvements.

function isSafeLocalOrDataImage(src) {
  if (!src) return false;
  const value = String(src).trim();
  if (/^data:image\/(png|gif|jpeg|jpg|webp);base64,/i.test(value)) return true;
  if (/^(?:\.\.?\/|\/|#|\?)/.test(value)) return true;
  return !/^[a-z][a-z0-9+.-]*:/i.test(value);
}

function setupDOMPurifyHooks() {
  if (!window.DOMPurify || window.__mdworksPurifyHooksReady) return;
  window.__mdworksPurifyHooksReady = true;
  DOMPurify.addHook('afterSanitizeAttributes', (node) => {
    if (!node || !node.tagName) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'a') {
      const href = node.getAttribute('href') || '';
      if (/^javascript:/i.test(href)) node.removeAttribute('href');
      if (node.hasAttribute('href')) {
        node.setAttribute('target', '_blank');
        node.setAttribute('rel', 'noopener noreferrer nofollow');
      }
    }
    if (tag === 'img') {
      const src = node.getAttribute('src') || '';
      if (!isSafeLocalOrDataImage(src)) node.removeAttribute('src');
      node.removeAttribute('srcset');
      node.removeAttribute('loading');
    }
    if (tag === 'input') {
      if ((node.getAttribute('type') || '').toLowerCase() !== 'checkbox') {
        node.remove(); return;
      }
      node.setAttribute('disabled', 'disabled');
    }
  });
}

function sanitizeHtml(html, config = MARKDOWN_SANITIZE_CONFIG) {
  if (!window.DOMPurify) return '';
  setupDOMPurifyHooks();
  return DOMPurify.sanitize(String(html || ''), config);
}
function safeMarkdownHtml(markdownText) {
  if (!window.marked || !window.DOMPurify) return '';
  return sanitizeHtml(marked.parse(String(markdownText || '')), MARKDOWN_SANITIZE_CONFIG);

// ----------------------------------------------------
// Web Crypto API (Auto & Private Mode)
// ----------------------------------------------------
let AUTOSAVE_TXT_KEY = "mdworks_secure_draft_text_v2";
let AUTOSAVE_NAME_KEY = "mdworks_secure_draft_name_v2";
const HISTORY_KEY = "mdworks_secure_history_v2";
const META_KEY = "mdworks_secure_meta_v2";
const AUTO_DB_NAME = "mdworks_auto_crypto_db";
const AUTO_DB_STORE = "keys";
const AUTO_KEY_ID = "auto-aes-key";
const FALLBACK_AUTO_JWK_KEY = "mdworks_auto_key_jwk_fallback";
const LEGACY_TEXT_KEY = "md_editor_draft_text"; // old plaintext
const LEGACY_NAME_KEY = "md_editor_draft_name";

let privateSession = { passphrase: null, key: null };
let secureStoreUnavailable = false;

function bytesToB64(bytes) {
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
  return out;
}
const enc = new TextEncoder();
const dec = new TextDecoder();

function getMeta() {
  try { return JSON.parse(localStorage.getItem(META_KEY) || "{}"); } catch { return {}; }
}
function setMeta(meta) {
  localStorage.setItem(META_KEY, JSON.stringify({ v: 2, mode: "auto", ...meta }));
  renderStorageBadge();
}
function currentMode() {
  return getMeta().mode === "private" ? "private" : "auto";
}

function openKeyDb() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
    const req = indexedDB.open(AUTO_DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(AUTO_DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("IndexedDB open failed"));
  });
}
async function idbGetKey() {
  const db = await openKeyDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUTO_DB_STORE, "readonly");
    const req = tx.objectStore(AUTO_DB_STORE).get(AUTO_KEY_ID);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error || new Error("key get failed"));
    tx.oncomplete = () => db.close();
  });
}
async function idbSetKey(key) {
  const db = await openKeyDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUTO_DB_STORE, "readwrite");
    tx.objectStore(AUTO_DB_STORE).put(key, AUTO_KEY_ID);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error || new Error("key set failed")); };
  });
}

async function getAutoKey() {
  if (!window.crypto || !crypto.subtle) throw new Error("Crypto API not found");
  try {
    const existing = await idbGetKey();
    if (existing) return existing;
    const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    await idbSetKey(key);
    return key;
  } catch (e) {
    console.warn("IndexedDB failed, falling back to JWK localStorage", e);
    const stored = localStorage.getItem(FALLBACK_AUTO_JWK_KEY);
    if (stored) return crypto.subtle.importKey("jwk", JSON.parse(stored), { name: "AES-GCM" }, true, ["encrypt", "decrypt"]);
    const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    localStorage.setItem(FALLBACK_AUTO_JWK_KEY, JSON.stringify(await crypto.subtle.exportKey("jwk", key)));
    return key;
  }
}

async function derivePrivateKey(passphrase, saltB64) {
  const salt = b64ToBytes(saltB64);
  const material = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
  );
}

async function getPrivateKey() {
  const meta = getMeta();
  if (!meta.privateSalt) throw new Error("Private Storage salt is missing");
  if (privateSession.key) return privateSession.key;
  const passphrase = window.prompt("Private Storageのパスフレーズを入力してください。\n※標準のAuto暗号化モードでは通常この入力は不要です。") || "";
  if (!passphrase) throw new Error("Passphrase cancelled");
  privateSession.passphrase = passphrase;
  privateSession.key = await derivePrivateKey(passphrase, meta.privateSalt);
  return privateSession.key;
}

async function getActiveKey() {
  return currentMode() === "private" ? getPrivateKey() : getAutoKey();
}

async function encryptString(value, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(value));
  return JSON.stringify({ v: 2, alg: "AES-GCM", iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(cipher)) });
}

async function decryptString(payload, key) {
  const box = JSON.parse(payload);
  if (box.v !== 2) throw new Error("Unsupported version");
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(box.iv) }, key, b64ToBytes(box.data));
  return dec.decode(plain);
}

async function secureSetItem(key, value) {
  try {
    const cryptoKey = await getActiveKey();
    const payload = await encryptString(String(value ?? ""), cryptoKey);
    localStorage.setItem(key, payload);
    return true;
  } catch (err) {
    secureStoreUnavailable = true;
    console.warn("secureSetItem failed", err);
    return false;
  }
}

async function secureGetItem(key) {
  const payload = localStorage.getItem(key);
  if (!payload) return null;
  // Handle old plaintext fallback if it exists (legacy support)
  if (!payload.startsWith('{')) return payload; 
  try {
    return await decryptString(payload, await getActiveKey());
  } catch (err) {
    console.warn("secureGetItem failed", err);
    alert(isJa ? 'ローカル保存データの復号に失敗しました。パスフレーズを確認してください。' : 'Failed to decrypt local data.');
    return null;
  }
}

function secureRemoveItem(key) {
  localStorage.removeItem(key);
}

function getStandaloneAutosaveSuffix(filename, content) {
  const name = String(filename || 'untitled.md');
  const text = String(content || '');
  let hash = 2166136261;
  const seed = `${name}\n${text}`;
  for (let i = 0; i < seed.length; i += 1) {
    hash ^= seed.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  const namePart = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'document';
  return `${namePart}_${(hash >>> 0).toString(16)}`;
}

// -- Storage Security Menu Functions --
async function getCurrentHistoryForMigration() {
  const payload = localStorage.getItem(HISTORY_KEY);
  if (!payload) return { ok: true, history: [] };

  try {
    const raw = payload.startsWith('{')
      ? await decryptString(payload, await getActiveKey())
      : payload;
    const parsed = JSON.parse(raw || '[]');
    return { ok: true, history: Array.isArray(parsed) ? parsed : [] };
  } catch (err) {
    console.warn('Failed to read history before storage migration', err);
    if (currentMode() === "private") privateSession = { passphrase: null, key: null };
    return { ok: false, history: null, error: err };
  }
}

async function migrateToMode(mode, passphrase = null) {
  const currentText = editor.value;
  const currentName = filenameInput.value || "untitled.md";
  const historyResult = await getCurrentHistoryForMigration();
  if (!historyResult.ok) {
    throw new Error('Failed to decrypt current history. Storage mode was not changed.');
  }
  const currentHistory = historyResult.history;

  if (mode === "private") {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    setMeta({ mode: "private", privateSalt: bytesToB64(salt) });
    privateSession.passphrase = passphrase;
    privateSession.key = await derivePrivateKey(passphrase, bytesToB64(salt));
  } else {
    setMeta({ mode: "auto" });
    privateSession = { passphrase: null, key: null };
  }

  await secureSetItem(AUTOSAVE_TXT_KEY, currentText);
  await secureSetItem(AUTOSAVE_NAME_KEY, currentName);
  await secureSetItem(HISTORY_KEY, JSON.stringify(currentHistory));
  historyCache = currentHistory;
}

}

function isEditableSelectionTarget(target) {

function replaceClipboardTaskCheckboxes(container) {

    input.replaceWith(document.createTextNode(checked ? '☑ ' : '☐ '));

function cleanPreviewClipboardHtml(container) {
  replaceClipboardTaskCheckboxes(container);
  container.querySelectorAll('button, textarea, select, input, svg, [hidden], [aria-hidden="true"]').forEach(node => node.remove());

  const allowedAttrs = new Set(['href', 'title', 'alt', 'src', 'colspan', 'rowspan', 'align']);
  const allowedTags = new Set(['H1','H2','H3','H4','H5','H6','P','BR','HR','STRONG','B','EM','I','S','DEL','CODE','PRE','BLOCKQUOTE','UL','OL','LI','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','A','IMG','SPAN','SUP','SUB']);
  container.querySelectorAll('*').forEach(el => {
    if (!allowedTags.has(el.tagName)) {
      el.replaceWith(...Array.from(el.childNodes));
      return;
    }
    Array.from(el.attributes).forEach(attr => {
      if (!allowedAttrs.has(attr.name.toLowerCase())) el.removeAttribute(attr.name);
    });
    if (el.tagName === 'A') {
      const href = el.getAttribute('href') || '';
      if (/^javascript:/i.test(href)) el.removeAttribute('href');
      el.style.color = '#0645ad';
      el.style.textDecoration = 'underline';
    }
    if (el.tagName === 'IMG') {
      el.style.maxWidth = '100%';
      el.style.height = 'auto';
    }
    if (el.tagName === 'PRE') {
      el.style.whiteSpace = 'pre-wrap';
      el.style.background = '#f5f5f5';
      el.style.color = '#000';
      el.style.fontFamily = 'monospace';
      el.style.padding = '12px';
      el.style.border = '1px solid #ddd';
    }
    if (el.tagName === 'CODE') {
      el.style.fontFamily = 'monospace';
      el.style.background = '#f5f5f5';
      el.style.color = '#000';
    }
    if (el.tagName === 'BLOCKQUOTE') {
      el.style.borderLeft = '4px solid #999';
      el.style.margin = '1em 0';
      el.style.padding = '0.2em 1em';
      el.style.color = '#000';
      el.style.background = '#fff';
    }
    if (el.tagName === 'TABLE') {
      el.style.borderCollapse = 'collapse';
      el.style.border = '1px solid black';
      el.style.width = '100%';
    }
    if (el.tagName === 'TH' || el.tagName === 'TD') {
      el.style.border = '1px solid black';
      el.style.padding = '4px 6px';
      el.style.verticalAlign = 'top';
      el.style.color = '#000';
      el.style.background = '#fff';
    }
    if (el.tagName === 'TH') {
      el.style.fontWeight = 'bold';
      el.style.background = '#f2f2f2';
    }
  });
}

function buildPreviewClipboardPayload(selection) {
  const range = selection.getRangeAt(0);
  const container = document.createElement('div');
  container.appendChild(range.cloneContents());
  cleanPreviewClipboardHtml(container);
  const plainText = (container.innerText || container.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  const html = `<div style="color: #000; background: #fff; font-family: sans-serif;">${container.innerHTML}</div>`;
  return { html, plainText };
}

function handlePreviewCopy(e) {
  const selection = window.getSelection();
  if (!isPreviewSelection(selection) || !e.clipboardData) return;
  const payload = buildPreviewClipboardPayload(selection);
  e.preventDefault();
  e.clipboardData.setData('text/html', payload.html);
  e.clipboardData.setData('text/plain', payload.plainText);
}

function update() {
  renderPreview();
  refreshBackdrop();
  if (outlineOpen) renderOutline(); 
  
  const text = editor.value;
  const lines = text.length === 0 ? 1 : text.split('\n').length;
  let words = 0;
  if (segmenter) { for (const s of segmenter.segment(text)) { if (s.isWordLike) words++; } }
  else words = text.trim() ? text.trim().split(/\s+/).length : 0;
  set('s-lines', lines); set('s-words', words); set('s-chars', text.replace(/[\n\r]/g, '').length);
}

let isEditorComposing = false;
editor.addEventListener('compositionstart', () => { isEditorComposing = true; });
editor.addEventListener('compositionend', () => { isEditorComposing = false; });

function refreshAfterEditorTabChange() {
  update();
  markDirty();
  if (spellEnabled) runSpellCheck();
  if (srPanelOpen) performSearch(false);
  clearTimeout(autoSaveTimeout);
  autoSaveTimeout = setTimeout(triggerAutoSave, 1500);
}

function getSelectedLineRange() {
  const value = editor.value;
  const selectionStart = editor.selectionStart;
  const selectionEnd = editor.selectionEnd;
  const lineStart = value.lastIndexOf('\n', Math.max(0, selectionStart - 1)) + 1;
  let lineEnd;

  if (selectionEnd > selectionStart && value[selectionEnd - 1] === '\n') {
    lineEnd = selectionEnd - 1;
  } else {
    lineEnd = value.indexOf('\n', selectionEnd);
    if (lineEnd === -1) lineEnd = value.length;
  }

  return { value, selectionStart, selectionEnd, lineStart, lineEnd };
}

function indentSelectedLines() {
  const { value, lineStart, lineEnd } = getSelectedLineRange();
  const block = value.slice(lineStart, lineEnd);
  const nextBlock = block.split('\n').map(line => `\t${line}`).join('\n');
  editor.value = value.slice(0, lineStart) + nextBlock + value.slice(lineEnd);
  editor.setSelectionRange(lineStart, lineStart + nextBlock.length);
}

function countOutdentChars(line) {
  if (line.startsWith('\t')) return 1;
  const spaces = line.match(/^ {1,2}/);
  return spaces ? spaces[0].length : 0;
}

function outdentLine(line) {
  return line.slice(countOutdentChars(line));
}

function outdentSelectedLines() {
  const { value, selectionStart, selectionEnd, lineStart, lineEnd } = getSelectedLineRange();
  const block = value.slice(lineStart, lineEnd);
  const nextBlock = block.split('\n').map(outdentLine).join('\n');
  editor.value = value.slice(0, lineStart) + nextBlock + value.slice(lineEnd);

  if (selectionStart === selectionEnd) {
    const removedBeforeCursor = Math.min(countOutdentChars(block), Math.max(0, selectionStart - lineStart));
    const nextCursor = selectionStart - removedBeforeCursor;
    editor.setSelectionRange(nextCursor, nextCursor);
  } else {
    editor.setSelectionRange(lineStart, lineStart + nextBlock.length);
  }
}

function indentOrInsertTab() {
  const { selectionStart, selectionEnd } = editor;
  if (selectionStart === selectionEnd) {
    editor.setRangeText('\t', selectionStart, selectionEnd, 'end');
    return;
  }

  indentSelectedLines();
}

function handleEditorTabKey(e) {
  if (e.key !== 'Tab' || e.isComposing || e.keyCode === 229 || isEditorComposing) return;

  e.preventDefault();

  if (e.shiftKey) {
    outdentSelectedLines();
  } else {
    indentOrInsertTab();
  }

  refreshAfterEditorTabChange();
}

editor.addEventListener('keydown', handleEditorTabKey);

editor.addEventListener('scroll', () => {

    if (editorScrollable > 0) {
      const ratio = editor.scrollTop / editorScrollable;
      const previewScrollable = previewWrap.scrollHeight - previewWrap.clientHeight;
      if (Math.abs(previewWrap.scrollTop - (ratio * previewScrollable)) > 2) {
        previewWrap.scrollTop = ratio * previewScrollable;
      }
    }
  }
});

function scrollToY(targetY, screenRatio) {
  const ratio = Math.min(1, Math.max(0, Number(screenRatio) || 0));
  editor.scrollTop = Math.max(0, targetY - (editor.clientHeight * ratio));
}

let suppressInputHandling = false;

function runWhenIdle(fn) {
  return new Promise(resolve => {
    const run = () => {
      try { fn(); }
      finally { resolve(); }
    };
    if ('requestIdleCallback' in window) {
      requestIdleCallback(run, { timeout: 220 });
    } else {
      setTimeout(run, 0);
    }
  });
}

function updateStatsOnly() {

  if (segmenter) {

      if (s.isWordLike) words++;
    }
  } else {
    words = text.trim() ? text.trim().split(/\s+/).length : 0;
  }
  set('s-lines', lines);
  set('s-words', words);
  set('s-chars', text.replace(/[\n\r]/g, '').length);
}

async function runDeferredLargePasteUpdate() {
  updateStatsOnly();
  await runWhenIdle(() => renderPreview());
  await runWhenIdle(() => refreshBackdrop());
  if (outlineOpen) await runWhenIdle(() => renderOutline());
  if (spellEnabled) await runWhenIdle(() => runSpellCheck());
  if (srPanelOpen) await runWhenIdle(() => performSearch(false));
}

async function handlePlainTextPaste(text) {
  if (!text) return;
  if (text.length > 10000) {
    showLoader(T.processingPasteToast);
    setStatusBadge(T.processingPasteStatus);
    await new Promise(resolve => setTimeout(resolve, 50));
    suppressInputHandling = true;
    try {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.setRangeText(text, start, end, 'end');
      markDirty();
      await runDeferredLargePasteUpdate();
      await triggerAutoSave();
    } finally {
      suppressInputHandling = false;
      hideLoader();
      renderStorageBadge();
    }
  } else {
    document.execCommand('insertText', false, text);
    markDirty();
    triggerAutoSave();
  }
}

function renderPreview(force = false) {

//#region [JS-08] BACKDROP ENGINE (TINT & HIGHLIGHT)
function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function invisSpan(cls, text) {
  return `<span class="invis ${cls}">${escapeHtml(text)}</span>`;
}

function decorateInvisibles(text, options = {}) {
  if (!showInvisibles || !text) return escapeHtml(text);
  const startOffset = options.startOffset || 0;
  const lineTrailingStart = Number.isFinite(options.lineTrailingStart) ? options.lineTrailingStart : Infinity;
  let html = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const absoluteOffset = startOffset + i;
    if (ch === '　') {
      html += invisSpan('invis-zenkaku', ch);
    } else if (ch === '\t') {
      html += invisSpan('invis-tab', ch);
    } else if (ch === ' ' && absoluteOffset >= lineTrailingStart) {
      html += invisSpan('invis-eol-space', ch);
    } else {
      html += escapeHtml(ch);
    }
  }
  return html;
}

function renderBackdropTextChunk(line, start, end, lineTrailingStart) {
  return decorateInvisibles(line.slice(start, end), { startOffset: start, lineTrailingStart });
}

function getTaskLineKind(line) {
  if (/^\s*-\s\[\s\]\s/.test(line)) return 'open';
  if (/^\s*-\s\[x\]\s/i.test(line)) return 'done';
  return '';
}

function refreshBackdrop() {
  const text = editor.value.replace(/\r/g, '');
  if (text === '') {
    backdrop.innerHTML = '<span class="editor-line blank">&#8203;</span>';
    return;
  }

  const lines = text.split('\n');
  const showSearch = srPanelOpen && srMatches.length > 0;
  const showSpell = spellEnabled && spellMatches.length > 0; 

  let globalPos = 0;
  const lineHtml = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const lineStart = globalPos;
    const lineEnd = globalPos + line.length;
    const taskKind = getTaskLineKind(line);
    const trailingSpaces = (line.match(/ *$/) || [''])[0].length;
    const lineTrailingStart = trailingSpaces > 0 ? line.length - trailingSpaces : Infinity;
    const hasFollowingNewline = i < lines.length - 1;

    let html = '';
    let cursor = 0;
    let lineIntersects = [];

    if (showSearch) {
      lineIntersects.push(...srMatches
        .map((m, idx) => ({ start: m.start, end: m.end, type: 'search', idx: idx }))
      );
    }
    if (showSpell) {
      lineIntersects.push(...spellMatches
        .map(m => ({ start: m.start, end: m.end, type: 'spell' }))
      );
    }

    if (lineIntersects.length > 0) {
      const intersects = lineIntersects
        .map(m => ({
          type: m.type,
          idx: m.idx,
          start: Math.max(m.start, lineStart) - lineStart,
          end: Math.min(m.end, lineEnd) - lineStart
        }))
        .filter(r => r.end > r.start)
        .sort((a, b) => a.start !== b.start ? a.start - b.start : (a.type === 'search' ? -1 : 1));

      for (let r of intersects) {
        if (r.start < cursor) r.start = cursor;
        if (r.start >= r.end) continue;
        if (r.start > cursor) {
          html += renderBackdropTextChunk(line, cursor, r.start, lineTrailingStart);
        }
        let cls = '';
        if (r.type === 'search') {
          cls = (r.idx === srCurrentIdx) ? 'active' : '';
        } else if (r.type === 'spell') {
          cls = 'spell-error';
        }
        html += `<mark class="${cls}">${renderBackdropTextChunk(line, r.start, r.end, lineTrailingStart)}</mark>`;
        cursor = r.end;
      }
    }

    if (cursor < line.length) {
      html += renderBackdropTextChunk(line, cursor, line.length, lineTrailingStart);
    }

    if (showInvisibles && hasFollowingNewline) {
      html += '<span class="invis invis-nl" aria-hidden="true"></span>';
    }
    if (!html) html = '&#8203;';

    const classes = ['editor-line'];
    if (line.length === 0) classes.push('blank');
    if (taskKind === 'open') classes.push('task-open-line');
    if (taskKind === 'done') classes.push('task-done-line');

    lineHtml.push(`<span class="${classes.join(' ')}">${html}</span>`);
    globalPos = lineEnd + 1;
  }

  backdrop.innerHTML = lineHtml.join('');
  backdrop.scrollTop = editor.scrollTop;
  backdrop.scrollLeft = editor.scrollLeft;
}
//#endregion

//#region [JS-09] LIST & TASK BULK TOGGLING
function getSelectedBlockInfo() {
  const value = editor.value;
  const s = editor.selectionStart;
  const e = editor.selectionEnd;
  const lineStart = value.lastIndexOf('\n', Math.max(0, s - 1)) + 1;
  let lineEnd = value.indexOf('\n', e);
  if (lineEnd === -1) lineEnd = value.length;
  const block = value.slice(lineStart, lineEnd);
  const lines = block.split('\n');
  return { value, s, e, lineStart, lineEnd, block, lines };
}

function replaceSelectedLines(transformer) {
  const { value, lineStart, lineEnd, lines } = getSelectedBlockInfo();
  const nextLines = transformer(lines.slice());
  const nextBlock = nextLines.join('\n');
  editor.value = value.slice(0, lineStart) + nextBlock + value.slice(lineEnd);
  editor.setSelectionRange(lineStart, lineStart + nextBlock.length);
  update();
  markDirty();
  triggerAutoSave();
  editor.focus();
}

function stripListPrefix(line) {
  return line.replace(/^\s*-\s\[[ xX]\]\s+/, '').replace(/^\s*-\s+/, '').replace(/^\s*\d+\.\s+/, '');
}
function isPlainBullet(line) { return /^\s*-\s(?!\[[ xX]\]\s)/.test(line); }
function isOrderedLine(line) { return /^\s*\d+\.\s+/.test(line); }
function taskStateOf(line) {
  if (/^\s*-\s\[\s\]\s/.test(line)) return 'open';
  if (/^\s*-\s\[x\]\s/i.test(line)) return 'done';
  return 'none';
}

function toggleBulletList() {
  replaceSelectedLines(lines => {
    const nonEmpty = lines.filter(l => l.trim() !== '');
    const allBullets = nonEmpty.length > 0 && nonEmpty.every(isPlainBullet);
    if (allBullets) return lines.map(line => line.replace(/^(\s*)-\s+/, '$1'));
    return lines.map(line => {
      if (line.trim() === '') return line;
      return `- ${stripListPrefix(line).trim()}`;
    });
  });
}

function toggleOrderedList() {
  replaceSelectedLines(lines => {
    const nonEmpty = lines.filter(l => l.trim() !== '');
    const allOrdered = nonEmpty.length > 0 && nonEmpty.every(isOrderedLine);
    if (allOrdered) return lines.map(line => line.replace(/^(\s*)\d+\.\s+/, '$1'));
    let n = 1;
    return lines.map(line => {
      if (line.trim() === '') return line;
      return `${n++}. ${stripListPrefix(line).trim()}`;
    });
  });
}

function cycleSingleTaskLine(line) {
  const state = taskStateOf(line);
  const content = stripListPrefix(line).trim();
  if (state === 'none') return `- [ ] ${content}`.trimEnd();
  if (state === 'open') return `- [x] ${content}`.trimEnd();
  return content;
}

function toggleTaskList() {
  replaceSelectedLines(lines => {
    const nonEmpty = lines.filter(l => l.trim() !== '');
    if (nonEmpty.length <= 1) return lines.map(line => line.trim() === '' ? line : cycleSingleTaskLine(line));
    const states = nonEmpty.map(taskStateOf);
    const allOpen = states.every(s => s === 'open');
    const allDone = states.every(s => s === 'done');
    if (allOpen) {
      return lines.map(line => {
        if (line.trim() === '') return line;
        return `- [x] ${stripListPrefix(line).trim()}`.trimEnd();
      });
    }
    if (allDone) {
      return lines.map(line => {
        if (line.trim() === '') return line;
        return stripListPrefix(line).trim();
      });
    }
    return lines.map(line => {
      if (line.trim() === '') return line;
      return `- [ ] ${stripListPrefix(line).trim()}`.trimEnd();
    });
  });
}

document.getElementById('tb-list-btn').onclick = toggleBulletList;
document.getElementById('tb-olist-btn').onclick = toggleOrderedList;
document.getElementById('tb-task-btn').onclick = toggleTaskList;
