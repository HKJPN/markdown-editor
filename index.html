//#region [JS-14] OUTLINE, HISTORY & LINTER (NEW)
// ========== アウトライン (目次) ==========
function toggleOutline() {
  outlineOpen = !outlineOpen;
  const panel = document.getElementById('outline-panel');
  const check = document.getElementById('outline-check');
  const entry = document.getElementById('m-outline-entry');
  
  panel.classList.toggle('show', outlineOpen);
  check.style.opacity = outlineOpen ? '1' : '0';
  entry.classList.toggle('active', outlineOpen);
  
  if (outlineOpen) renderOutline();
  closeMenus();
}

function renderOutline() {
  if (!outlineOpen) return;
  const lines = editor.value.split('\n');
  const container = document.getElementById('outline-list');
  container.innerHTML = '';
  
  let found = false;
  let charOffset = 0;
  
  lines.forEach(line => {
    const m = line.match(/^(#{1,6})\s+(.+)/);
    if (m) {
      found = true;
      const level = m[1].length;
      const text = m[2];
      const div = document.createElement('div');
      div.className = `ol-item ol-h${level}`;
      div.textContent = text;
      const targetOffset = charOffset;
      div.onclick = () => jumpToOffset(targetOffset);
      container.appendChild(div);
    }
    charOffset += line.length + 1; // +1 for newline
  });
  
  if (!found) {
    container.innerHTML = `<div style="padding:10px; color:var(--text3); font-size:12px;">${T.outlineEmpty}</div>`;
  }
}

function jumpToOffset(offset) {
  editor.focus();
  editor.setSelectionRange(offset, offset);
  
  // スクロール位置の計算 (行数ベースでの概算)
  const textBefore = editor.value.substring(0, offset);
  const linesBefore = textBefore.split('\n').length;
  
  requestAnimationFrame(() => {
    const lineHeight = parseFloat(getComputedStyle(editor).lineHeight);
    const paddingTop = parseFloat(getComputedStyle(editor).paddingTop);
    const targetTop = (linesBefore - 1) * lineHeight + paddingTop - (editor.clientHeight / 3);
    
    editor.scrollTop = Math.max(0, targetTop);
    backdrop.scrollTop = editor.scrollTop;
  });
}

// ========== 作業履歴 (History) ==========
const HIST_KEY = 'md_editor_history_list';

function saveToHistoryList(filename, content) {
  if (!content || content.trim() === '' || content === T.defaultMd) return;
  let hist = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
  
  // 同じファイル名の履歴があれば削除して最新を先頭に
  hist = hist.filter(h => h.filename !== filename);
  hist.unshift({ filename, content, date: Date.now() });
  
  // 最大10件まで保持
  if (hist.length > 10) hist.pop();
  localStorage.setItem(HIST_KEY, JSON.stringify(hist));
}

function openHistory() {
  closeMenus();
  const list = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
  const container = document.getElementById('hist-list');
  container.innerHTML = '';
  
  if (list.length === 0) {
    container.innerHTML = `<div style="color:var(--text3); font-size:13px; padding:10px 0;">${T.historyEmpty}</div>`;
  } else {
    list.forEach(h => {
      const div = document.createElement('div');
      div.className = 'hist-item';
      
      const nameDiv = document.createElement('div');
      nameDiv.className = 'hist-name';
      nameDiv.textContent = h.filename;
      
      const dateDiv = document.createElement('div');
      dateDiv.className = 'hist-date';
      dateDiv.textContent = new Date(h.date).toLocaleString();
      
      div.appendChild(nameDiv);
      div.appendChild(dateDiv);
      
      div.onclick = () => {
        if (isDirty && editor.value !== T.defaultMd && !confirm(T.confirmNew)) return;
        saveToHistoryList(filenameInput.value, editor.value); // 今開いているものを退避
        editor.value = h.content;
        filenameInput.value = h.filename;
        fileHandle = null;
        update();
        markDirty();
        closeHistory();
      };
      container.appendChild(div);
    });
  }
  document.getElementById('history-modal').classList.add('show');
}

function closeHistory() {
  document.getElementById('history-modal').classList.remove('show');
}

// ========== Markdown整形補助 (Linter/Formatter) ==========
function formatDoc() {
  closeMenus();
  let val = editor.value;
  
  // 1. 3行以上の連続する空行を2行に圧縮
  val = val.replace(/\n{3,}/g, '\n\n');
  
  // 2. 見出し(#)と文字の間にスペースがない場合に自動挿入 (例: ##見出し -> ## 見出し)
  val = val.replace(/^(#{1,6})([^#\s\n])/gm, '$1 $2');
  
  // 3. 各行の行末の無駄な空白(Trailing spaces)を削除 (Markdownの改行用2スペースは残す)
  val = val.split('\n').map(line => {
    if (line.endsWith('  ')) return line; // 強制改行の2スペースは維持
    return line.trimEnd();
  }).join('\n');
  
  editor.value = val;
  markDirty();
  update();
  toast(T.formatDone);
}

}

//#region [JS-16] SHORTCUTS, EXPORTS & UTILS
window.addEventListener('keydown', e => {
  const meta = e.ctrlKey || e.metaKey;

  if (e.key === 'Escape') {
    if (document.body.classList.contains('zen-mode')) toggleZenMode();
    if (srPanelOpen) { e.preventDefault(); closeSearchPanel(); }
    if (document.getElementById('history-modal').classList.contains('show')) closeHistory();
    if (document.getElementById('rn-modal').classList.contains('show')) closeRN();
    return;
  }

  if (meta && e.key.toLowerCase() === 'n') { e.preventDefault(); newFile(); }
  if (meta && e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); handleSave(true); return; }
  if (meta && !e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); handleSave(false); }
  if (meta && e.key.toLowerCase() === 'o') { e.preventDefault(); handleOpen(); }
  if (meta && e.key.toLowerCase() === 'f') { e.preventDefault(); openSearchPanel('find'); }
  if (meta && e.key.toLowerCase() === 'h') { e.preventDefault(); openSearchPanel('replace'); }
  
  if (meta && e.key.toLowerCase() === 'b') {
    e.preventDefault(); 
    if (document.activeElement === editor && !isEditorComposing) wrap('**');
  }
  if (meta && e.key.toLowerCase() === 'i') {
    e.preventDefault();
    if (document.activeElement === editor && !isEditorComposing) wrap('*');
  }
});

window.addEventListener('beforeunload', (e) => {
  if (isDirty && editor.value.trim() !== '' && editor.value !== T.defaultMd) {
    e.preventDefault();
    e.returnValue = ''; 
  }
});

function closeFile() {
  closeMenus();
  if (isDirty && editor.value.trim() !== '' && editor.value !== T.defaultMd) {
    if (!confirm(T.confirmClose)) return;
  }
  saveToHistoryList(filenameInput.value, editor.value); // 閉じる前に履歴へ
  editor.value = '';
  filenameInput.value = 'untitled.md';
  fileHandle = null;
  update();
  markSaved();
  triggerAutoSave();
  toast(T.closedToast);
}

async function execEdit(action) {
  closeMenus();
  editor.focus();
  
  if (action === 'selectAll') {
    editor.select();
    return;
  }
  
  if (action === 'paste') {
    try {
      const text = await navigator.clipboard.readText();
      document.execCommand('insertText', false, text.normalize('NFC'));
      markDirty();
      triggerAutoSave();
    } catch (err) {
      toast(T.errPaste);
    }
    return;
  }
  
  document.execCommand(action);
  if (action === 'cut' || action === 'undo' || action === 'redo') {
    markDirty();
    triggerAutoSave();
  }
}

function toggleZenMode() {
  const isZen = document.body.classList.toggle('zen-mode');
  const chk = document.getElementById('zen-check');
  const entry = document.getElementById('m-zen-entry');
  
  if (chk) chk.style.opacity = isZen ? '1' : '0';
  if (entry) entry.classList.toggle('active', isZen);
  
  closeMenus();
  if (isZen) {
    toast('Zenモード起動 (Escで解除)');
  }
}

function exportHtml() {
  closeMenus();
  if (!window.marked) return;
  if (!window.DOMPurify) {
    alert(isJa ? 'セキュリティエラー: 処理を中止しました。' : 'Security Error');
    return;
  }
  const safeHtml = DOMPurify.sanitize(marked.parse(editor.value));
  const title = filenameInput.value.replace(/\.[^/.]+$/, '') || 'document';
  const fullHtml = `<!DOCTYPE html>\n<html lang="${isJa ? 'ja' : 'en'}">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>${title}</title>\n<style>body{font-family:'Helvetica Neue',Arial,sans-serif;line-height:1.8;color:#333;max-width:800px;margin:0 auto;padding:40px 20px}h1,h2,h3,h4,h5,h6{font-family:sans-serif;font-weight:bold;margin-top:1.5em;margin-bottom:.5em}h1{border-bottom:2px solid #eee;padding-bottom:5px}h2{border-bottom:1px solid #eee;padding-bottom:5px}code{background-color:#f4f4f4;padding:2px 5px;border-radius:4px;font-family:monospace;font-size:.9em}pre{background-color:#f6f8fa;border-radius:6px;padding:16px;overflow-x:auto;border:1px solid #e1e4e8}pre code{background:none;border:none;padding:0}blockquote{border-left:4px solid #dfe2e5;margin:1em 0;padding-left:16px;color:#6a737d}table{border-collapse:collapse;width:100%;margin:1em 0}th,td{border:1px solid #dfe2e5;padding:8px 13px}th{background-color:#f6f8fa;font-weight:600}tr:nth-child(even){background-color:#fcfcfc}img{max-width:100%;height:auto}</style>\n</head>\n<body>\n${safeHtml}\n</body>\n</html>`;

  if (isMobile) {
    const file = new File([fullHtml], title + '.html', { type: 'text/html;charset=utf-8' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: title + '.html' }).catch(() => {});
    } else {
      triggerDownload(fullHtml, title + '.html', 'text/html');
    }
  } else {
    triggerDownload(fullHtml, title + '.html', 'text/html');
    toast(T.downloaded);
  }
}

function exportPdf() {
  closeMenus();
  if (window.marked) {
    if (!window.DOMPurify) return;
    preview.innerHTML = DOMPurify.sanitize(marked.parse(editor.value));
    decoratePreviewTasks();
  }
  setTimeout(() => window.print(), 100);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
//#endregion
</script>
