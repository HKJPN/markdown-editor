let AUTOSAVE_TXT_KEY = "mdworks_secure_draft_text_v2";
let AUTOSAVE_NAME_KEY = "mdworks_secure_draft_name_v2";
const HISTORY_KEY = "mdworks_secure_history_v2";
const META_KEY = "mdworks_secure_meta_v2";
const AUTO_DB_NAME = "mdworks_auto_crypto_db";
const AUTO_DB_STORE = "keys";
const AUTO_KEY_ID = "auto-aes-key";
const FALLBACK_AUTO_JWK_KEY = "mdworks_auto_key_jwk_fallback";
const LEGACY_TEXT_KEY = "md_editor_draft_text"; // old plaintext
const LEGACY_NAME_KEY = "md_editor_draft_name";

let privateSession = { passphrase: null, key: null };
let secureStoreUnavailable = false;

function bytesToB64(bytes) {
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
  return out;
}
const enc = new TextEncoder();
const dec = new TextDecoder();

function getMeta() {
  try { return JSON.parse(localStorage.getItem(META_KEY) || "{}"); } catch { return {}; }
}
function setMeta(meta) {
  localStorage.setItem(META_KEY, JSON.stringify({ v: 2, mode: "auto", ...meta }));
  renderStorageBadge();
}
function currentMode() {
  return getMeta().mode === "private" ? "private" : "auto";
}

function openKeyDb() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
    const req = indexedDB.open(AUTO_DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(AUTO_DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("IndexedDB open failed"));
  });
}
async function idbGetKey() {
  const db = await openKeyDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUTO_DB_STORE, "readonly");
    const req = tx.objectStore(AUTO_DB_STORE).get(AUTO_KEY_ID);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error || new Error("key get failed"));
    tx.oncomplete = () => db.close();
  });
}
async function idbSetKey(key) {
  const db = await openKeyDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUTO_DB_STORE, "readwrite");
    tx.objectStore(AUTO_DB_STORE).put(key, AUTO_KEY_ID);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error || new Error("key set failed")); };
  });
}

async function getAutoKey() {
  if (!window.crypto || !crypto.subtle) throw new Error("Crypto API not found");
  try {
    const existing = await idbGetKey();
    if (existing) return existing;
    const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    await idbSetKey(key);
    return key;
  } catch (e) {
    console.warn("IndexedDB failed, falling back to JWK localStorage", e);
    const stored = localStorage.getItem(FALLBACK_AUTO_JWK_KEY);
    if (stored) return crypto.subtle.importKey("jwk", JSON.parse(stored), { name: "AES-GCM" }, true, ["encrypt", "decrypt"]);
    const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    localStorage.setItem(FALLBACK_AUTO_JWK_KEY, JSON.stringify(await crypto.subtle.exportKey("jwk", key)));
    return key;
  }
}

async function derivePrivateKey(passphrase, saltB64) {
  const salt = b64ToBytes(saltB64);
  const material = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
  );
}

async function getPrivateKey() {
  const meta = getMeta();
  if (!meta.privateSalt) throw new Error("Private Storage salt is missing");
  if (privateSession.key) return privateSession.key;
  const passphrase = window.prompt("Private Storageのパスフレーズを入力してください。\n※標準のAuto暗号化モードでは通常この入力は不要です。") || "";
  if (!passphrase) throw new Error("Passphrase cancelled");
  privateSession.passphrase = passphrase;
  privateSession.key = await derivePrivateKey(passphrase, meta.privateSalt);
  return privateSession.key;
}

async function getActiveKey() {
  return currentMode() === "private" ? getPrivateKey() : getAutoKey();
}

async function encryptString(value, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(value));
  return JSON.stringify({ v: 2, alg: "AES-GCM", iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(cipher)) });
}

async function decryptString(payload, key) {
  const box = JSON.parse(payload);
  if (box.v !== 2) throw new Error("Unsupported version");
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(box.iv) }, key, b64ToBytes(box.data));
  return dec.decode(plain);
}

async function secureSetItem(key, value) {
  try {
    const cryptoKey = await getActiveKey();
    const payload = await encryptString(String(value ?? ""), cryptoKey);
    localStorage.setItem(key, payload);
    return true;
  } catch (err) {
    secureStoreUnavailable = true;
    console.warn("secureSetItem failed", err);
    return false;
  }
}

async function secureGetItem(key) {
  const payload = localStorage.getItem(key);
  if (!payload) return null;
  // Handle old plaintext fallback if it exists (legacy support)
  if (!payload.startsWith('{')) return payload; 
  try {
    return await decryptString(payload, await getActiveKey());
  } catch (err) {
    console.warn("secureGetItem failed", err);
    alert(isJa ? 'ローカル保存データの復号に失敗しました。パスフレーズを確認してください。' : 'Failed to decrypt local data.');
    return null;
  }
}

function getStandaloneAutosaveSuffix(filename, content) {
  const name = String(filename || 'untitled.md');
  const text = String(content || '');
  let hash = 2166136261;
  const seed = `${name}\n${text}`;
  for (let i = 0; i < seed.length; i += 1) {
    hash ^= seed.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  const namePart = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'document';
  return `${namePart}_${(hash >>> 0).toString(16)}`;
}

      editor.scrollLeft = Math.min(

function normalizePreviewWidth(reason = '') {
  if (previewFocusOpen || !previewOpen || !previewWrap || !mainContainer || isDraggingSplitter) return;

  const containerRect = mainContainer.getBoundingClientRect();
  const containerWidth = containerRect.width;
  if (!Number.isFinite(containerWidth) || containerWidth <= 0) return;

  if (window.innerWidth <= 760) {
    if (previewWrap.style.width) previewWrap.style.width = '';
    return;
  }

  const previewWidth = previewWrap.getBoundingClientRect().width;
  if (!Number.isFinite(previewWidth) || previewWidth <= 0) return;

  const tooWide = previewWidth > containerWidth * 0.78;
  const tooNarrow = previewWidth < 280;
  const editorTooNarrow = containerWidth - previewWidth < 220;

  if (tooWide || tooNarrow || editorTooNarrow) {
    previewWrap.style.width = '';
  }
}

function scheduleViewportRefresh(reason = '') {
  if (viewportRefreshRaf !== null) cancelAnimationFrame(viewportRefreshRaf);
  viewportRefreshRaf = requestAnimationFrame(() => {
    viewportRefreshRaf = null;
    refreshLayoutAfterViewportChange(reason);
  });

  clearTimeout(viewportRefreshTimer);
  viewportRefreshTimer = setTimeout(() => {
    viewportRefreshTimer = null;
    refreshLayoutAfterViewportChange(reason);
  }, 120);
}

function setupLayoutResizeObserver() {
  if (layoutObserver || !window.ResizeObserver || !mainContainer) return;

  const initialRect = mainContainer.getBoundingClientRect();
  lastObservedMainSize = {
    width: Math.round(initialRect.width),
    height: Math.round(initialRect.height)
  };

  layoutObserver = new ResizeObserver(entries => {
    for (const entry of entries) {
      if (entry.target !== mainContainer) continue;

      const width = Math.round(entry.contentRect.width);
      const height = Math.round(entry.contentRect.height);
      if (
        Math.abs(width - lastObservedMainSize.width) < 2 &&
        Math.abs(height - lastObservedMainSize.height) < 2
      ) {
        continue;
      }

      lastObservedMainSize = { width, height };
      scheduleViewportRefresh('observer');
    }
  });

  layoutObserver.observe(mainContainer);
}

// -- Storage Security Menu Functions --
async function getCurrentHistoryForMigration() {
  const payload = localStorage.getItem(HISTORY_KEY);
  if (!payload) return { ok: true, history: [] };

  try {
    const raw = payload.startsWith('{')
      ? await decryptString(payload, await getActiveKey())
      : payload;
    const parsed = JSON.parse(raw || '[]');
    return { ok: true, history: Array.isArray(parsed) ? parsed : [] };
  } catch (err) {
    console.warn('Failed to read history before storage migration', err);
    if (currentMode() === "private") privateSession = { passphrase: null, key: null };
    return { ok: false, history: null, error: err };
  }
}

async function migrateToMode(mode, passphrase = null) {
  const currentText = editor.value;
  const currentName = filenameInput.value || "untitled.md";
  const historyResult = await getCurrentHistoryForMigration();
  if (!historyResult.ok) {
    throw new Error('Failed to decrypt current history. Storage mode was not changed.');
  }
  const currentHistory = historyResult.history;

  if (mode === "private") {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    setMeta({ mode: "private", privateSalt: bytesToB64(salt) });
    privateSession.passphrase = passphrase;
    privateSession.key = await derivePrivateKey(passphrase, bytesToB64(salt));
  } else {
    setMeta({ mode: "auto" });
    privateSession = { passphrase: null, key: null };
  }

  await secureSetItem(AUTOSAVE_TXT_KEY, currentText);
  await secureSetItem(AUTOSAVE_NAME_KEY, currentName);
  await secureSetItem(HISTORY_KEY, JSON.stringify(currentHistory));
  historyCache = currentHistory;
}

function cleanPreviewClipboardHtml(container) {
  replaceClipboardTaskCheckboxes(container);
  container.querySelectorAll('button, textarea, select, input, svg, [hidden], [aria-hidden="true"]').forEach(node => node.remove());

  const allowedAttrs = new Set(['href', 'title', 'alt', 'src', 'colspan', 'rowspan', 'align']);
  const allowedTags = new Set(['H1','H2','H3','H4','H5','H6','P','BR','HR','STRONG','B','EM','I','S','DEL','CODE','PRE','BLOCKQUOTE','UL','OL','LI','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','A','IMG','SPAN','SUP','SUB']);
  container.querySelectorAll('*').forEach(el => {
    if (!allowedTags.has(el.tagName)) {
      el.replaceWith(...Array.from(el.childNodes));
      return;
    }
    Array.from(el.attributes).forEach(attr => {
      if (!allowedAttrs.has(attr.name.toLowerCase())) el.removeAttribute(attr.name);
    });
    if (el.tagName === 'A') {
      const href = el.getAttribute('href') || '';
      if (/^javascript:/i.test(href)) el.removeAttribute('href');
      el.style.color = '#0645ad';
      el.style.textDecoration = 'underline';
    }
    if (el.tagName === 'IMG') {
      el.style.maxWidth = '100%';
      el.style.height = 'auto';
    }
    if (el.tagName === 'PRE') {
      el.style.whiteSpace = 'pre-wrap';
      el.style.background = '#f5f5f5';
      el.style.color = '#000';
      el.style.fontFamily = 'monospace';
      el.style.padding = '12px';
      el.style.border = '1px solid #ddd';
    }
    if (el.tagName === 'CODE') {
      el.style.fontFamily = 'monospace';
      el.style.background = '#f5f5f5';
      el.style.color = '#000';
    }
    if (el.tagName === 'BLOCKQUOTE') {
      el.style.borderLeft = '4px solid #999';
      el.style.margin = '1em 0';
      el.style.padding = '0.2em 1em';
      el.style.color = '#000';
      el.style.background = '#fff';
    }
    if (el.tagName === 'TABLE') {
      el.style.borderCollapse = 'collapse';
      el.style.border = '1px solid black';
      el.style.width = '100%';
    }
    if (el.tagName === 'TH' || el.tagName === 'TD') {
      el.style.border = '1px solid black';
      el.style.padding = '4px 6px';
      el.style.verticalAlign = 'top';
      el.style.color = '#000';
      el.style.background = '#fff';
    }
    if (el.tagName === 'TH') {
      el.style.fontWeight = 'bold';
      el.style.background = '#f2f2f2';
    }
  });
}

function buildPreviewClipboardPayload(selection) {
  const range = selection.getRangeAt(0);
  const container = document.createElement('div');
  container.appendChild(range.cloneContents());
  cleanPreviewClipboardHtml(container);
  const plainText = (container.innerText || container.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  const html = `<div style="color: #000; background: #fff; font-family: sans-serif;">${container.innerHTML}</div>`;
  return { html, plainText };
}

function handlePreviewCopy(e) {
  const selection = window.getSelection();
  if (!isPreviewSelection(selection) || !e.clipboardData) return;
  const payload = buildPreviewClipboardPayload(selection);
  e.preventDefault();
  e.clipboardData.setData('text/html', payload.html);
  e.clipboardData.setData('text/plain', payload.plainText);
}

document.addEventListener('copy', handlePreviewCopy);


splitter.addEventListener('mousedown', () => {

//#region [JS-06] EDITOR EVENTS & STATS UPDATER (w/ Image Drag & Drop)
function markDirty() {
  isDirty = true;
  inlineSaveState.textContent = T.unsaved;
  inlineSaveState.style.color = 'var(--warn)';
  inlineSaveState.style.borderColor = 'rgba(232,168,74,.25)';

  const saveBtn = document.getElementById('save-btn');
  if (saveBtn) {
    saveBtn.classList.remove('active');
    saveBtn.setAttribute('aria-pressed', 'false');
  }
}

function markSaved() {
  isDirty = false;
  inlineSaveState.textContent = T.saved;
  inlineSaveState.style.color = 'var(--success)';
  inlineSaveState.style.borderColor = 'rgba(78,203,143,.28)';

  const saveBtn = document.getElementById('save-btn');
  if (saveBtn) {
    saveBtn.classList.add('active');
    saveBtn.setAttribute('aria-pressed', 'true');
  }
}

function update() {
  renderPreview();
  refreshBackdrop();
  if (outlineOpen) renderOutline(); 
  
  const text = editor.value;
  const lines = text.length === 0 ? 1 : text.split('\n').length;
  let words = 0;
  if (segmenter) { for (const s of segmenter.segment(text)) { if (s.isWordLike) words++; } }
  else words = text.trim() ? text.trim().split(/\s+/).length : 0;
  set('s-lines', lines); set('s-words', words); set('s-chars', text.replace(/[\n\r]/g, '').length);
}

let isEditorComposing = false;
editor.addEventListener('compositionstart', () => { isEditorComposing = true; });
editor.addEventListener('compositionend', () => { isEditorComposing = false; updateCurrentLineHighlight(); });

function refreshAfterEditorTabChange() {
  update();
  markDirty();
  if (spellEnabled) runSpellCheck();
  if (srPanelOpen) performSearch(false);
  clearTimeout(autoSaveTimeout);
  autoSaveTimeout = setTimeout(triggerAutoSave, 1500);
}

function getSelectedLineRange() {
  const value = editor.value;
  const selectionStart = editor.selectionStart;
  const selectionEnd = editor.selectionEnd;
  const lineStart = value.lastIndexOf('\n', Math.max(0, selectionStart - 1)) + 1;
  let lineEnd;

  if (selectionEnd > selectionStart && value[selectionEnd - 1] === '\n') {
    lineEnd = selectionEnd - 1;
  } else {
    lineEnd = value.indexOf('\n', selectionEnd);
    if (lineEnd === -1) lineEnd = value.length;
  }

  return { value, selectionStart, selectionEnd, lineStart, lineEnd };
}

function indentSelectedLines() {
  const { value, lineStart, lineEnd } = getSelectedLineRange();
  const block = value.slice(lineStart, lineEnd);
  const nextBlock = block.split('\n').map(line => `\t${line}`).join('\n');
  editor.value = value.slice(0, lineStart) + nextBlock + value.slice(lineEnd);
  editor.setSelectionRange(lineStart, lineStart + nextBlock.length);
}

function countOutdentChars(line) {
  if (line.startsWith('\t')) return 1;
  const spaces = line.match(/^ {1,2}/);
  return spaces ? spaces[0].length : 0;
}

function outdentLine(line) {
  return line.slice(countOutdentChars(line));
}

function outdentSelectedLines() {
  const { value, selectionStart, selectionEnd, lineStart, lineEnd } = getSelectedLineRange();
  const block = value.slice(lineStart, lineEnd);
  const nextBlock = block.split('\n').map(outdentLine).join('\n');
  editor.value = value.slice(0, lineStart) + nextBlock + value.slice(lineEnd);

  if (selectionStart === selectionEnd) {
    const removedBeforeCursor = Math.min(countOutdentChars(block), Math.max(0, selectionStart - lineStart));
    const nextCursor = selectionStart - removedBeforeCursor;
    editor.setSelectionRange(nextCursor, nextCursor);
  } else {
    editor.setSelectionRange(lineStart, lineStart + nextBlock.length);
  }
}

function indentOrInsertTab() {
  const { selectionStart, selectionEnd } = editor;
  if (selectionStart === selectionEnd) {
    editor.setRangeText('\t', selectionStart, selectionEnd, 'end');
    return;
  }

  indentSelectedLines();
}

function handleEditorTabKey(e) {
  if (e.key !== 'Tab' || e.isComposing || e.keyCode === 229 || isEditorComposing) return;

  e.preventDefault();

  if (e.shiftKey) {
    outdentSelectedLines();
  } else {
    indentOrInsertTab();
  }

  refreshAfterEditorTabChange();
}

editor.addEventListener('keydown', handleEditorTabKey);
editor.addEventListener('keyup', updateCurrentLineHighlight);
editor.addEventListener('click', updateCurrentLineHighlight);
editor.addEventListener('select', updateCurrentLineHighlight);
document.addEventListener('selectionchange', () => {
  if (document.activeElement === editor) updateCurrentLineHighlight();
});

editor.addEventListener('scroll', () => {
  backdrop.scrollTop = editor.scrollTop;
  backdrop.scrollLeft = editor.scrollLeft;
  if (suppressPreviewScrollSync || previewFocusOpen) return;
  
  if (previewOpen) {
    const editorScrollable = editor.scrollHeight - editor.clientHeight;
    if (editorScrollable > 0) {
      const ratio = editor.scrollTop / editorScrollable;
      const previewScrollable = previewWrap.scrollHeight - previewWrap.clientHeight;
      if (Math.abs(previewWrap.scrollTop - (ratio * previewScrollable)) > 2) {
        previewWrap.scrollTop = ratio * previewScrollable;
      }
    }
  }
});

function scrollToY(targetY, screenRatio) {
  const ratio = Math.min(1, Math.max(0, Number(screenRatio) || 0));
  editor.scrollTop = Math.max(0, targetY - (editor.clientHeight * ratio));
}

function getLineIndexFromOffset(text, offset) {
  const safeOffset = Math.max(0, Math.min(Number(offset) || 0, text.length));
  let line = 0;

  for (let i = 0; i < safeOffset; i += 1) {
    if (text.charCodeAt(i) === 10) line += 1;
  }

  return line;
}

function getEditorLineHeightPx() {
  const cssValue = getComputedStyle(editor).lineHeight;
  const parsed = Number.parseFloat(cssValue);

  if (Number.isFinite(parsed) && parsed > 0) return parsed;

  const variableValue = getComputedStyle(document.documentElement)
    .getPropertyValue('--editor-line-height');
  const variableParsed = Number.parseFloat(variableValue);

  if (Number.isFinite(variableParsed) && variableParsed > 0) return variableParsed;

  return 26;
}

const SEARCH_CONTEXT_LINES_BEFORE = 5;

function getSearchContextLinesBefore() {
  if (window.innerWidth <= 760) return 3;
  return SEARCH_CONTEXT_LINES_BEFORE;
}

function scrollToSearchMatch(match) {
  if (!match) return;

  const lineHeight = getEditorLineHeightPx();
  const contextLines = getSearchContextLinesBefore();
  const contextY = contextLines * lineHeight;
  const activeMark = backdrop.querySelector('mark.active');
  let targetY;

  if (activeMark) {
    const markRect = activeMark.getBoundingClientRect();
    const backdropRect = backdrop.getBoundingClientRect();
    const markY = markRect.top - backdropRect.top + backdrop.scrollTop;

    if (Number.isFinite(markY)) {
      targetY = Math.max(0, markY - contextY);
    }
  }

  if (!Number.isFinite(targetY)) {
    const lineIndex = getLineIndexFromOffset(editor.value, match.start);
    const targetLine = Math.max(0, lineIndex - contextLines);
    targetY = targetLine * lineHeight;
  }

  scrollToY(targetY, 0);

  if (!wrapLinesEnabled && activeMark) {
    const markRect = activeMark.getBoundingClientRect();
    const backdropRect = backdrop.getBoundingClientRect();
    const markX = markRect.left - backdropRect.left + backdrop.scrollLeft;
    const horizontalContext = 40;
    const maxScrollLeft = Math.max(0, editor.scrollWidth - editor.clientWidth);

    if (Number.isFinite(markX)) {
      editor.scrollLeft = Math.min(
        maxScrollLeft,
        Math.max(0, markX - horizontalContext)
      );
    }
  }

  backdrop.scrollTop = editor.scrollTop;
  backdrop.scrollLeft = editor.scrollLeft;
}

const PASTE_SET_RANGE_TEXT_THRESHOLD = 10000;
let suppressInputHandling = false;
let pasteSuppressSeq = 0;
let tocSuppressSeq = 0;
let replaceAllSuppressSeq = 0;
let isReplaceAllRunning = false;
let pendingReplaceAllUndoRestore = null;
let replaceAllUndoRestoreSeq = 0;

function clearPendingReplaceAllUndoRestore() {
  pendingReplaceAllUndoRestore = null;
}

function setEditorDocumentValue(value) {
  clearPendingReplaceAllUndoRestore();
  editor.value = value;
}

function shouldDeferPasteUpdate(pasteLength, nextLength) {
  return (
    pasteLength >= 2000 ||
    nextLength >= 30000 ||
    (previewOpen && nextLength >= 20000) ||
    (showInvisibles && nextLength >= 20000) ||
    ((spellEnabled || srPanelOpen) && nextLength >= 15000)
  );
}

function shouldShowPasteLoader(pasteLength, nextLength) {
  return (
    pasteLength >= 10000 ||
    nextLength >= 150000 ||
    (spellEnabled && nextLength >= 50000) ||
    (previewOpen && nextLength >= 100000)
  );
}

function yieldToBrowserPaint() {
  return new Promise(resolve => {
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(() => setTimeout(resolve, 0));
    } else {
      setTimeout(resolve, 0);
    }
  });
}

function waitForNextPaint() {
  return new Promise(resolve => {
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(() => {
        requestAnimationFrame(resolve);
      });
    } else {
      setTimeout(resolve, 0);
    }
  });
}

function scheduleReplaceAllUndoSelectionRestore(snapshot) {
  if (!snapshot) return;

  const restore = () => {
    const maxLength = editor.value.length;

    const start = Math.max(0, Math.min(snapshot.start, maxLength));
    const end = Math.max(start, Math.min(snapshot.end, maxLength));
    const direction = ['forward', 'backward', 'none'].includes(snapshot.direction)
      ? snapshot.direction
      : 'none';

    editor.focus({ preventScroll: true });
    editor.setSelectionRange(start, end, direction);

    const maxScrollTop = Math.max(0, editor.scrollHeight - editor.clientHeight);
    const maxScrollLeft = Math.max(0, editor.scrollWidth - editor.clientWidth);

    editor.scrollTop = Math.max(0, Math.min(snapshot.scrollTop, maxScrollTop));
    editor.scrollLeft = Math.max(0, Math.min(snapshot.scrollLeft, maxScrollLeft));

    backdrop.scrollTop = editor.scrollTop;
    backdrop.scrollLeft = editor.scrollLeft;

    if (typeof updateCurrentLineHighlight === 'function') {
      updateCurrentLineHighlight();
    }
  };

  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(() => {
      requestAnimationFrame(restore);
    });
  } else {
    setTimeout(restore, 0);
  }
}

function deferPasteTask(fn, preferIdle) {
  return new Promise((resolve, reject) => {
    const run = () => {
      try {
        fn();
        resolve();
      } catch (error) {
        reject(error);
      }
    };

    if (preferIdle && typeof requestIdleCallback === 'function') {
      requestIdleCallback(run, { timeout: 250 });
    } else {
      setTimeout(run, 0);
    }
  });
}

function updateStatsOnly() {
  const text = editor.value;
  const lines = text.length === 0 ? 1 : text.split('\n').length;
  let words = 0;
  if (segmenter) {
    for (const s of segmenter.segment(text)) {
      if (s.isWordLike) words++;
    }
  } else {
    words = text.trim() ? text.trim().split(/\s+/).length : 0;
  }
  set('s-lines', lines);
  set('s-words', words);
  set('s-chars', text.replace(/[\n\r]/g, '').length);
}

async function handlePlainTextPaste(text) {
  if (!text) return;

  const normalizedText = String(text).normalize('NFC');
  const pasteLength = normalizedText.length;
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const currentLength = editor.value.length;
  const nextLength = currentLength - (end - start) + pasteLength;

  const useSetRangeText = pasteLength >= PASTE_SET_RANGE_TEXT_THRESHOLD;
  const deferUpdate = shouldDeferPasteUpdate(pasteLength, nextLength);
  const showPasteLoader = shouldShowPasteLoader(pasteLength, nextLength);

  if (showPasteLoader) {
    showLoader(T.processingPasteToast);
    setStatusBadge(T.processingPasteStatus);
    await new Promise(resolve => setTimeout(resolve, 30));
  }

  const suppressSeq = ++pasteSuppressSeq;
  suppressInputHandling = true;
  const tasks = [];

  try {
    if (useSetRangeText) {
      editor.setRangeText(normalizedText, start, end, 'end');
    } else {
      const insertTextSupported = document.queryCommandSupported &&
        document.queryCommandSupported('insertText');

      if (insertTextSupported) {
        document.execCommand('insertText', false, normalizedText);
      } else {
        editor.setRangeText(normalizedText, start, end, 'end');
      }
    }

    markDirty();
    updateStatsOnly();

    const preferIdle = deferUpdate || showPasteLoader;
    tasks.push(deferPasteTask(() => refreshBackdrop(), preferIdle));

    if (previewOpen) {
      tasks.push(deferPasteTask(() => renderPreview(), preferIdle));
    }

    if (outlineOpen) {
      tasks.push(deferPasteTask(() => renderOutline(), preferIdle));
    }

    if (srPanelOpen) {
      tasks.push(deferPasteTask(() => performSearch(false), preferIdle));
    }

    if (spellEnabled) {
      tasks.push(deferPasteTask(() => runSpellCheck(), preferIdle));
    }

    clearTimeout(autoSaveTimeout);
    autoSaveTimeout = setTimeout(triggerAutoSave, 1500);
  } finally {
    // Some browsers dispatch execCommand's input event after the next task.
    setTimeout(() => {
      const release = () => {
        if (suppressSeq === pasteSuppressSeq) {
          suppressInputHandling = false;
        }
      };

      if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(release);
      } else {
        release();
      }
    }, 50);
  }

  if (showPasteLoader) {
    try {
      await Promise.all(tasks);
    } finally {
      hideLoader();
      renderStorageBadge();
    }
  } else {
    Promise.all(tasks).catch(error => console.warn('Deferred paste update failed', error));
  }
}

let autoSaveTimeout;
editor.addEventListener('input', event => {
  const isHistoryUndo =
    event && event.inputType === 'historyUndo';

  let replaceAllUndoSnapshot = null;

  if (isHistoryUndo && pendingReplaceAllUndoRestore) {
    replaceAllUndoSnapshot = pendingReplaceAllUndoRestore;
    pendingReplaceAllUndoRestore = null;
  }

  if (suppressInputHandling && !isHistoryUndo) return;

  if (pendingReplaceAllUndoRestore && !isHistoryUndo && !suppressInputHandling) {
    clearPendingReplaceAllUndoRestore();
  }

  update();
  markDirty();
  if (spellEnabled) runSpellCheck();
  if (srPanelOpen) performSearch(false);
  clearTimeout(autoSaveTimeout);
  autoSaveTimeout = setTimeout(triggerAutoSave, 1500);

  if (replaceAllUndoSnapshot) {
    scheduleReplaceAllUndoSelectionRestore(replaceAllUndoSnapshot);
  }
});

filenameInput.addEventListener('input', () => {
  if (filenameInput.readOnly) {
    filenameInput.value = fileHandle?.name || filenameInput.value;
    return;
  }
  markDirty();
  clearTimeout(autoSaveTimeout);
  autoSaveTimeout = setTimeout(triggerAutoSave, 800);
});

editor.addEventListener('paste', e => {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
  handlePlainTextPaste(text);
});

const IMAGE_DROP_MAX_BYTES = 300 * 1024;
let isImageDropProcessing = false;

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('File read failed'));
    reader.readAsDataURL(file);
  });
}

function getDroppedImageHeading(filename) {
  const normalized = String(filename || '')
    .replace(/[\r\n]+/g, ' ')
    .trim();
  const withoutExtension = normalized.replace(/\.[^.]+$/, '').trim();
  return withoutExtension || (isJa ? '画像' : 'Image');
}

function escapeMarkdownImageAlt(text) {
  return String(text || '')
    .replace(/\\/g, '\\\\')
    .replace(/\]/g, '\\]');
}

function normalizeDroppedImageMarkdownSpacing(markdown, dropSelection) {
  const before = editor.value.slice(0, dropSelection.s);
  const after = editor.value.slice(dropSelection.e);
  let nextMarkdown = markdown;

  if (before && !before.endsWith('\n\n')) {
    nextMarkdown = (before.endsWith('\n') ? '\n' : '\n\n') + nextMarkdown;
  }

  if (after && !after.startsWith('\n\n')) {
    nextMarkdown += after.startsWith('\n') ? '\n' : '\n\n';
  }

  return nextMarkdown;
}

function notifySkippedImageDrops(skipped) {
  if (!skipped.length) return;
  toast(`${T.imageDropSkippedTitle} ${skipped.join(' / ')}`);
}

editor.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
editor.addEventListener("drop", async (e) => {
  e.preventDefault();
  const files = Array.from(e.dataTransfer?.files || []);
  if (!files.length || isImageDropProcessing) return;

  isImageDropProcessing = true;
  const dropSelection = getPos();
  const snippets = [];
  const skipped = [];

  showLoader(T.loadingDroppedImages(0, files.length));
  await yieldToBrowserPaint();

  try {
    for (let index = 0; index < files.length; index += 1) {
      const file = files[index];

      if (!file.type.startsWith("image/")) {
        skipped.push(T.imageDropNotImage(file.name));
      } else if (file.type === "image/svg+xml") {
        skipped.push(T.imageDropSvgUnsupported(file.name));
      } else if (file.size > IMAGE_DROP_MAX_BYTES) {
        skipped.push(T.imageDropTooLarge(file.name));
      } else {
        try {
          const dataUrl = await readFileAsDataUrl(file);
          const heading = getDroppedImageHeading(file.name);
          const alt = escapeMarkdownImageAlt(file.name);
          snippets.push(`## ${heading}\n\n![${alt}](${dataUrl})`);
        } catch (error) {
          console.warn('Image drop read failed', file.name, error);
          skipped.push(T.imageDropReadFailed(file.name));
        }
      }

      set('loader-msg', T.loadingDroppedImages(index + 1, files.length));
      await yieldToBrowserPaint();
    }

    if (snippets.length) {
      set('loader-msg', T.insertingDroppedImages);
      await yieldToBrowserPaint();

      const markdown = normalizeDroppedImageMarkdownSpacing(snippets.join('\n\n'), dropSelection);
      setRange(dropSelection.s, dropSelection.e);
      ins(markdown, false);
      update();
      if (spellEnabled) runSpellCheck();
      if (srPanelOpen) performSearch(false);
      await yieldToBrowserPaint();
    }
  } finally {
    isImageDropProcessing = false;
    hideLoader();
    renderStorageBadge();
  }

  notifySkippedImageDrops(skipped);
});

//#region [JS-07] PREVIEW RENDERING & DECORATION
function renderPreview(force = false) {
  if ((!previewOpen && !force) || !window.marked) return;
  if (window.DOMPurify) {
    preview.innerHTML = safeMarkdownHtml(editor.value);
    decoratePreviewTasks();
  } else {
    preview.innerHTML = `<div style="color:var(--danger); border: 1px solid var(--danger); padding: 15px; border-radius: 8px; font-family: var(--sans); background: rgba(240,112,112,0.1); margin: 20px;"><b>Security Error:</b><br>Preview disabled because DOMPurify failed to load.</div>`;
  }
}

function decoratePreviewTasks() {
  preview.querySelectorAll('li').forEach(li => {
    const cb = li.querySelector('input[type="checkbox"]');
    li.classList.remove('task-open-item', 'task-done-item');
    if (!cb) return;
    li.classList.add(cb.checked ? 'task-done-item' : 'task-open-item');
  });
}
//#endregion

//#region [JS-08] BACKDROP ENGINE (TINT & HIGHLIGHT)
function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function invisSpan(cls, text) {
  return `<span class="invis ${cls}">${escapeHtml(text)}</span>`;
}

function decorateInvisibles(text, options = {}) {
  if (!showInvisibles || !text) return escapeHtml(text);
  const startOffset = options.startOffset || 0;
  const lineTrailingStart = Number.isFinite(options.lineTrailingStart) ? options.lineTrailingStart : Infinity;
  let html = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const absoluteOffset = startOffset + i;
    if (ch === '　') {
      html += invisSpan('invis-zenkaku', ch);
    } else if (ch === '\t') {
      html += invisSpan('invis-tab', ch);
    } else if (ch === ' ' && absoluteOffset >= lineTrailingStart) {
      html += invisSpan('invis-eol-space', ch);
    } else {
      html += escapeHtml(ch);
    }
  }
  return html;
}

function renderBackdropTextChunk(line, start, end, lineTrailingStart) {
  return decorateInvisibles(line.slice(start, end), { startOffset: start, lineTrailingStart });
}

function getTaskLineKind(line) {
  if (/^\s*-\s\[\s\]\s/.test(line)) return 'open';
  if (/^\s*-\s\[x\]\s/i.test(line)) return 'done';
  return '';
}

function getCurrentLineIndex() {
  const pos = editor.selectionStart || 0;
  return editor.value.slice(0, pos).split('\n').length - 1;
}

function updateCurrentLineHighlight() {
  const prev = backdrop.querySelector('.editor-line.current-line');
  if (prev) prev.classList.remove('current-line');
  if (!highlightCurrentLine) return;
  const next = backdrop.children[getCurrentLineIndex()];
  if (next) next.classList.add('current-line');
}

function refreshBackdrop() {
  const text = editor.value.replace(/\r/g, '');
  const currentLineIndex = getCurrentLineIndex();
  if (text === '') {
    const currentClass = highlightCurrentLine ? ' current-line' : '';
    const lineNumberHtml = showLineNumbers ? '<span class="line-number" aria-hidden="true">1</span>' : '';
    backdrop.innerHTML = `<span class="editor-line blank${currentClass}">${lineNumberHtml}&#8203;</span>`;
    return;
  }

  const lines = text.split('\n');
  const showSearch = srPanelOpen && srMatches.length > 0;
  const showSpell = spellEnabled && spellMatches.length > 0; 

  let globalPos = 0;
  const lineHtml = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const lineStart = globalPos;
    const lineEnd = globalPos + line.length;
    const taskKind = getTaskLineKind(line);
    const trailingSpaces = (line.match(/ *$/) || [''])[0].length;
    const lineTrailingStart = trailingSpaces > 0 ? line.length - trailingSpaces : Infinity;
    const hasFollowingNewline = i < lines.length - 1;

    let html = '';
    let cursor = 0;
    let lineIntersects = [];

    if (showSearch) {
      lineIntersects.push(...srMatches
        .map((m, idx) => ({ start: m.start, end: m.end, type: 'search', idx: idx }))
      );
    }
    if (showSpell) {
      lineIntersects.push(...spellMatches
        .map(m => ({ start: m.start, end: m.end, type: 'spell' }))
      );
    }

    if (lineIntersects.length > 0) {
      const intersects = lineIntersects
        .map(m => ({
          type: m.type,
          idx: m.idx,
          start: Math.max(m.start, lineStart) - lineStart,
          end: Math.min(m.end, lineEnd) - lineStart
        }))
        .filter(r => r.end > r.start)
        .sort((a, b) => a.start !== b.start ? a.start - b.start : (a.type === 'search' ? -1 : 1));

      for (let r of intersects) {
        if (r.start < cursor) r.start = cursor;
        if (r.start >= r.end) continue;
        if (r.start > cursor) {
          html += renderBackdropTextChunk(line, cursor, r.start, lineTrailingStart);
        }
        let cls = '';
        if (r.type === 'search') {
          cls = (r.idx === srCurrentIdx) ? 'active' : '';
        } else if (r.type === 'spell') {
          cls = 'spell-error';
        }
        html += `<mark class="${cls}">${renderBackdropTextChunk(line, r.start, r.end, lineTrailingStart)}</mark>`;
        cursor = r.end;
      }
    }

    if (cursor < line.length) {
      html += renderBackdropTextChunk(line, cursor, line.length, lineTrailingStart);
    }

    if (showInvisibles && hasFollowingNewline) {
      html += '<span class="invis invis-nl" aria-hidden="true"></span>';
    }
    if (!html) html = '&#8203;';

    const classes = ['editor-line'];
    if (line.length === 0) classes.push('blank');
    if (taskKind === 'open') classes.push('task-open-line');
    if (taskKind === 'done') classes.push('task-done-line');
    if (highlightCurrentLine && i === currentLineIndex) classes.push('current-line');

    const lineNumberHtml = showLineNumbers ? `<span class="line-number" aria-hidden="true">${i + 1}</span>` : '';
    lineHtml.push(`<span class="${classes.join(' ')}">${lineNumberHtml}${html}</span>`);
    globalPos = lineEnd + 1;
  }

  backdrop.innerHTML = lineHtml.join('');
  backdrop.scrollTop = editor.scrollTop;
  backdrop.scrollLeft = editor.scrollLeft;
}
//#endregion

//#region [JS-09] LIST & TASK BULK TOGGLING
function getSelectedBlockInfo() {
  const value = editor.value;
  const s = editor.selectionStart;
  const e = editor.selectionEnd;
  const lineStart = value.lastIndexOf('\n', Math.max(0, s - 1)) + 1;
  let lineEnd = value.indexOf('\n', e);
  if (lineEnd === -1) lineEnd = value.length;
  const block = value.slice(lineStart, lineEnd);
  const lines = block.split('\n');
  return { value, s, e, lineStart, lineEnd, block, lines };
}

function replaceSelectedLines(transformer) {
  const { value, lineStart, lineEnd, lines } = getSelectedBlockInfo();
  const nextLines = transformer(lines.slice());
  const nextBlock = nextLines.join('\n');
  editor.value = value.slice(0, lineStart) + nextBlock + value.slice(lineEnd);
  editor.setSelectionRange(lineStart, lineStart + nextBlock.length);
  update();
  markDirty();
  triggerAutoSave();
  editor.focus();
}

function stripListPrefix(line) {
  return line.replace(/^\s*-\s\[[ xX]\]\s+/, '').replace(/^\s*-\s+/, '').replace(/^\s*\d+\.\s+/, '');
}
function isPlainBullet(line) { return /^\s*-\s(?!\[[ xX]\]\s)/.test(line); }
function isOrderedLine(line) { return /^\s*\d+\.\s+/.test(line); }
function taskStateOf(line) {
  if (/^\s*-\s\[\s\]\s/.test(line)) return 'open';
  if (/^\s*-\s\[x\]\s/i.test(line)) return 'done';
  return 'none';
}

function toggleBulletList() {
  replaceSelectedLines(lines => {
    const nonEmpty = lines.filter(l => l.trim() !== '');
    const allBullets = nonEmpty.length > 0 && nonEmpty.every(isPlainBullet);
    if (allBullets) return lines.map(line => line.replace(/^(\s*)-\s+/, '$1'));
    return lines.map(line => {
      if (line.trim() === '') return line;
      return `- ${stripListPrefix(line).trim()}`;
    });
  });
}

function toggleOrderedList() {
  replaceSelectedLines(lines => {
    const nonEmpty = lines.filter(l => l.trim() !== '');
    const allOrdered = nonEmpty.length > 0 && nonEmpty.every(isOrderedLine);
    if (allOrdered) return lines.map(line => line.replace(/^(\s*)\d+\.\s+/, '$1'));
    let n = 1;
    return lines.map(line => {
      if (line.trim() === '') return line;
      return `${n++}. ${stripListPrefix(line).trim()}`;
    });
  });
}

function cycleSingleTaskLine(line) {
  const state = taskStateOf(line);
  const content = stripListPrefix(line).trim();
  if (state === 'none') return `- [ ] ${content}`.trimEnd();
  if (state === 'open') return `- [x] ${content}`.trimEnd();
  return content;
}

function toggleTaskList() {
  replaceSelectedLines(lines => {
    const nonEmpty = lines.filter(l => l.trim() !== '');
    if (nonEmpty.length <= 1) return lines.map(line => line.trim() === '' ? line : cycleSingleTaskLine(line));
    const states = nonEmpty.map(taskStateOf);
    const allOpen = states.every(s => s === 'open');
    const allDone = states.every(s => s === 'done');
    if (allOpen) {
      return lines.map(line => {
        if (line.trim() === '') return line;
        return `- [x] ${stripListPrefix(line).trim()}`.trimEnd();
      });
    }
    if (allDone) {
      return lines.map(line => {
        if (line.trim() === '') return line;
        return stripListPrefix(line).trim();
      });
    }
    return lines.map(line => {
      if (line.trim() === '') return line;
      return `- [ ] ${stripListPrefix(line).trim()}`.trimEnd();
    });
  });
}

document.getElementById('tb-list-btn').onclick = toggleBulletList;
document.getElementById('tb-olist-btn').onclick = toggleOrderedList;
document.getElementById('tb-task-btn').onclick = toggleTaskList;
//#endregion

//#region [JS-10] SEARCH & REPLACE LOGIC
const srPanel = document.getElementById('sr-panel');
const srInput = document.getElementById('sr-search-input');
const srReplaceInput = document.getElementById('sr-replace-input');
const srCount = document.getElementById('sr-count');
const srError = document.getElementById('sr-error');

let srPanelOpen = false;
let srMode = 'find';
let srMatches = [];
let srCurrentIdx = -1;
let isComposing = false;

srInput.addEventListener('compositionstart', () => { isComposing = true; });
srInput.addEventListener('compositionend', () => { isComposing = false; performSearch(true); });

function openSearchPanel(mode) {
  if (!guardEditorCommand()) return;
  closeMenus();
  srPanelOpen = true;
  srMode = mode;
  srPanel.classList.add('show');
  if (mode === 'find') {
    document.getElementById('tab-find').classList.add('active');
    document.getElementById('tab-replace').classList.remove('active');
    document.getElementById('sr-replace-area').style.display = 'none';
  } else {
    document.getElementById('tab-replace').classList.add('active');
    document.getElementById('tab-find').classList.remove('active');
    document.getElementById('sr-replace-area').style.display = 'block';
  }
  const selText = editor.value.slice(editor.selectionStart, editor.selectionEnd);
  if (selText && !selText.includes('\n')) srInput.value = selText;
  srInput.focus();
  srInput.select();
  performSearch(true);
}

function closeSearchPanel() {
  srPanelOpen = false;
  srPanel.classList.remove('show');
  srMatches = [];
  srCurrentIdx = -1;
  refreshBackdrop();
  editor.focus();
}

document.getElementById('tab-find').onclick = () => openSearchPanel('find');
document.getElementById('tab-replace').onclick = () => openSearchPanel('replace');
document.getElementById('sr-close').onclick = closeSearchPanel;

function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function decodeRegexReplacementEscapes(value) {
  let result = '';
  for (let i = 0; i < value.length; i += 1) {
    const char = value[i];
    if (char !== '\\') { result += char; continue; }
    if (i === value.length - 1) { result += '\\'; continue; }
    const next = value[i + 1];
    switch (next) {
      case 'n': result += '\n'; i += 1; break;
      case 'r': result += '\r'; i += 1; break;
      case 't': result += '\t'; i += 1; break;
      case '\\': result += '\\'; i += 1; break;
      default: result += '\\' + next; i += 1; break;
    }
  }
  return result;
}
function getReplacementString() {
  const repStr = srReplaceInput.value;
  return document.getElementById('sr-opt-regex').checked ? decodeRegexReplacementEscapes(repStr) : repStr;
}
function buildRegex(isGlobal = true) {
  const query = srInput.value;
  if (!query) return null;
  const useRegex = document.getElementById('sr-opt-regex').checked;
  const matchCase = document.getElementById('sr-opt-case').checked;
  const wholeWord = document.getElementById('sr-opt-word').checked;
  let patternStr = useRegex ? query : escapeRegExp(query);
  if (wholeWord) patternStr = `\\b${patternStr}\\b`;
  let flags = 'm';
  if (isGlobal) flags += 'g';
  if (!matchCase) flags += 'i';
  try { return new RegExp(patternStr, flags); } catch (e) { return null; }
}

function setSearchCount() {
  if (srMatches.length === 0 || srCurrentIdx === -1) { srCount.textContent = T.noMatches; return; }
  srCount.textContent = `${srCurrentIdx + 1} / ${srMatches.length}`;
}

function performSearch(jumpToClosest = false) {
  srMatches = [];
  srError.style.display = 'none';
  const query = srInput.value;
  if (!query) { srCount.textContent = ''; srCurrentIdx = -1; refreshBackdrop(); return; }
  const regex = buildRegex(true);
  if (!regex) { srError.style.display = 'block'; srCount.textContent = ''; srCurrentIdx = -1; refreshBackdrop(); return; }
  const text = editor.value;
  let match;
  while ((match = regex.exec(text)) !== null) {
    if (match.index === regex.lastIndex) regex.lastIndex++;
    srMatches.push({ start: match.index, end: match.index + match[0].length, text: match[0] });
  }
  if (srMatches.length === 0) { srCurrentIdx = -1; srCount.textContent = T.noMatches; refreshBackdrop(); return; }
  if (jumpToClosest) {
    const cursorPos = editor.selectionStart;
    srCurrentIdx = srMatches.findIndex(m => m.start >= cursorPos);
    if (srCurrentIdx === -1) srCurrentIdx = 0;
    highlightCurrentMatch();
  } else {
    if (srCurrentIdx >= srMatches.length) srCurrentIdx = srMatches.length - 1;
    else if (srCurrentIdx === -1) srCurrentIdx = 0;
    setSearchCount();
    refreshBackdrop();
  }
}

function highlightCurrentMatch() {
  if (srMatches.length === 0 || srCurrentIdx === -1) {
    refreshBackdrop();
    return;
  }

  const m = srMatches[srCurrentIdx];

  if (isComposing) {
    setSearchCount();
    refreshBackdrop();
    return;
  }

  const activeEl = document.activeElement;
  const shouldRestoreSearchFocus = activeEl && activeEl.closest('#sr-panel');

  editor.focus();
  editor.setSelectionRange(m.start, m.end);

  setSearchCount();
  refreshBackdrop();

  requestAnimationFrame(() => {
    scrollToSearchMatch(m);
    refreshBackdrop();

    if (shouldRestoreSearchFocus && document.contains(activeEl)) {
      activeEl.focus();
    }
  });
}

function navMatch(dir) {
  if (srMatches.length === 0) return;
  srCurrentIdx += dir;
  if (srCurrentIdx >= srMatches.length) srCurrentIdx = 0;
  if (srCurrentIdx < 0) srCurrentIdx = srMatches.length - 1;
  highlightCurrentMatch();
}

document.getElementById('sr-next').onclick = () => navMatch(1);
document.getElementById('sr-prev').onclick = () => navMatch(-1);

[srInput, document.getElementById('sr-opt-regex'), document.getElementById('sr-opt-case'), document.getElementById('sr-opt-word')].forEach(el => {
  el.addEventListener('input', (e) => { if (e.isComposing || isComposing) return; performSearch(true); });
  el.addEventListener('change', () => performSearch(true));
});

srPanel.addEventListener('keydown', e => {
  if (e.isComposing) return;
  if (e.key === 'Enter') { e.preventDefault(); navMatch(e.shiftKey ? -1 : 1); }
});

document.getElementById('sr-btn-replace').onclick = () => {
  if (!guardEditorCommand()) return;
  if (srMatches.length === 0 || srCurrentIdx === -1) return;
  const m = srMatches[srCurrentIdx];
  if (editor.selectionStart !== m.start || editor.selectionEnd !== m.end) { highlightCurrentMatch(); return; }
  const regex = buildRegex(false);
  if (!regex) return;
  const repStr = getReplacementString();
  const newSubText = m.text.replace(regex, repStr);
  editor.focus();
  document.execCommand('insertText', false, newSubText);
  markDirty();
  performSearch(true);
};

const replaceAllControlIds = [
  'sr-btn-replace',
  'sr-btn-replace-all',
  'sr-search-input',
  'sr-replace-input',
  'sr-opt-regex',
  'sr-opt-case',
  'sr-opt-word'
];

function setSearchReplaceControlsDisabled(disabled) {
  const previousStates = new Map();
  replaceAllControlIds.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    previousStates.set(el, el.disabled);
    el.disabled = disabled;
  });
  return () => {
    previousStates.forEach((wasDisabled, el) => {
      el.disabled = wasDisabled;
    });
  };
}

document.getElementById('sr-btn-replace-all').onclick = async () => {
  if (isReplaceAllRunning) return;
  if (!guardEditorCommand()) return;
  if (srMatches.length === 0) return;
  const count = srMatches.length;
  if (!confirm(T.confirmRepAll(count))) return;
  const regex = buildRegex(true);
  if (!regex) return;
  const repStr = getReplacementString();
  const oldFullText = editor.value;
  const scrollTop = editor.scrollTop;
  const scrollLeft = editor.scrollLeft;
  const replaceAllUndoSnapshot = {
    token: ++replaceAllUndoRestoreSeq,
    start: editor.selectionStart,
    end: editor.selectionEnd,
    direction: editor.selectionDirection || 'none',
    scrollTop,
    scrollLeft,
    beforeLength: oldFullText.length
  };

  let suppressSeq = 0;
  let completed = false;
  let failure = null;
  let replaceAttempted = false;
  let replaceAllCommitted = false;
  const restoreSearchReplaceControls = setSearchReplaceControlsDisabled(true);

  isReplaceAllRunning = true;
  showLoader(T.replacingAll);
  setStatusBadge(T.replacingAllStatus);

  try {
    await yieldToBrowserPaint();

    const newFullText = oldFullText.replace(regex, repStr);

    suppressSeq = ++replaceAllSuppressSeq;
    suppressInputHandling = true;

    try {
      editor.focus();
      editor.setSelectionRange(0, oldFullText.length);
      const before = editor.value;
      replaceAttempted = true;
      document.execCommand('insertText', false, newFullText);

      if (editor.value === before && newFullText !== oldFullText) {
        editor.setRangeText(newFullText, 0, oldFullText.length, 'end');
      }

      replaceAllCommitted = editor.value === newFullText;
      editor.setSelectionRange(0, 0);
      editor.scrollTop = scrollTop;
      editor.scrollLeft = scrollLeft;
      backdrop.scrollTop = editor.scrollTop;
      backdrop.scrollLeft = editor.scrollLeft;
    } finally {
      if (suppressSeq) {
        // Some browsers dispatch execCommand's input event after the next task.
        setTimeout(() => {
          const release = () => {
            if (suppressSeq === replaceAllSuppressSeq) {
              suppressInputHandling = false;

              if (replaceAllCommitted) {
                pendingReplaceAllUndoRestore = replaceAllUndoSnapshot;
              }
            }
          };

          if (typeof requestAnimationFrame === 'function') {
            requestAnimationFrame(release);
          } else {
            release();
          }
        }, 50);
      }
    }

    markDirty();
    updateStatsOnly();

    const tasks = [];
    const preferIdle = true;

    if (srPanelOpen) {
      tasks.push(deferPasteTask(() => performSearch(true), preferIdle));
    } else {
      tasks.push(deferPasteTask(() => refreshBackdrop(), preferIdle));
    }

    if (previewOpen) {
      tasks.push(deferPasteTask(() => renderPreview(), preferIdle));
    }

    if (outlineOpen) {
      tasks.push(deferPasteTask(() => renderOutline(), preferIdle));
    }

    if (spellEnabled) {
      tasks.push(deferPasteTask(() => runSpellCheck(), preferIdle));
    }

    clearTimeout(autoSaveTimeout);
    autoSaveTimeout = setTimeout(triggerAutoSave, 1500);

    await Promise.all(tasks);
    completed = true;
  } catch (error) {
    failure = error;
    console.error('Replace all failed', error);
    if (replaceAttempted) {
      console.error('Replace all may have partially modified the document.', {
        originalLength: oldFullText.length,
        currentLength: editor.value.length,
        expectedMatches: count
      });
    }
  } finally {
    hideLoader();
    renderStorageBadge();
    restoreSearchReplaceControls();
    isReplaceAllRunning = false;
  }

  if (completed) {
    toast(T.replacedN(count));
  } else if (failure) {
    alert(T.replaceAllFailed);
  }
};
//#endregion

//#region [JS-11] SPELL CHECK (HUNSPELL)
let dictReady = false;
let typo = null;
let isDictLoading = false;
let currentSpellRun = 0;
let spellMatches = []; 

async function initDict() {
  if (isDictLoading || dictReady) return;
  isDictLoading = true;
  try {
    const [aff, dic] = await Promise.all([
      fetch('https://cdn.jsdelivr.net/npm/typo-js@1.2.3/dictionaries/en_US/en_US.aff').then(r => r.text()),
      fetch('https://cdn.jsdelivr.net/npm/typo-js@1.2.3/dictionaries/en_US/en_US.dic').then(r => r.text())
    ]);
    typo = new Typo('en_US', aff, dic);
    dictReady = true;
    if (spellEnabled) runSpellCheck();
  } catch (e) {
    set('sp-loading-text', T.dictFailed);
  }
}

function toggleSpell() {
  if (!guardEditorCommand()) return;
  spellEnabled = !spellEnabled;
  const titleBtn = document.getElementById('spell-toggle-title-btn');
  const entry = document.getElementById('m-spell-entry');
  const chk = document.getElementById('spell-check');
  const status = document.getElementById('spell-status');
  if (titleBtn) {
    titleBtn.classList.toggle('active', spellEnabled);
    titleBtn.setAttribute('aria-pressed', spellEnabled ? 'true' : 'false');
  }
  if (entry) {
    entry.classList.toggle('active', spellEnabled);
    entry.setAttribute('aria-pressed', spellEnabled ? 'true' : 'false');
  }
  if (chk) chk.style.opacity = spellEnabled ? '1' : '0';
  if (spellEnabled) {
    status.textContent = T.spellOn;
    status.classList.add('on');
    initDict();
    runSpellCheck();
  } else {
    status.textContent = '';
    status.classList.remove('on');
    closeSpellPanel();
    spellMatches = []; 
    refreshBackdrop(); 
  }
  closeMenus();
}

function closeSpellPanel() {
  document.getElementById('spell-panel').classList.remove('show');
}

let spellTimer = null;
function runSpellCheck() {
  if (!spellEnabled) return;
  clearTimeout(spellTimer);
  spellTimer = setTimeout(doSpellCheck, 350);
}

function maskMarkdown(src) {
  return src
    .replace(/```[\s\S]*?```/g, m => ' '.repeat(m.length))
    .replace(/`[^`\n]+`/g, m => ' '.repeat(m.length))
    .replace(/!\[[^\]]*\]\([^)]*\)/g, m => ' '.repeat(m.length))
    .replace(/(\[[^\]]*\])\(([^)]*)\)/g, (m, p1, p2) => p1 + '(' + ' '.repeat(p2.length) + ')')
    .replace(/^#{1,6}\s+/gm, m => ' '.repeat(m.length))
    .replace(/^[-*+]\s+/gm, m => ' '.repeat(m.length))
    .replace(/^\d+\.\s+/gm, m => ' '.repeat(m.length))
    .replace(/^>\s*/gm, m => ' '.repeat(m.length))
    .replace(/[*_~|\\]/g, ' ');
}

function doSpellCheck() {
  if (!spellEnabled) return;
  const panel = document.getElementById('spell-panel');
  const list = document.getElementById('spell-list');
  const empty = document.getElementById('spell-empty');
  const loading = document.getElementById('spell-loading');
  panel.classList.add('show');
  if (!dictReady || !typo) {
    loading.classList.add('show');
    set('sp-loading-text', T.dictLoading);
    return;
  }
  currentSpellRun++;
  const thisRun = currentSpellRun;
  const text = editor.value.replace(/\r/g, ''); 
  const stripped = maskMarkdown(text);
  const wordRe = /\b([a-zA-Z]{2,}(?:'[a-zA-Z]+)?)\b/g;
  const seen = new Set();
  const misspellings = [];
  const tempMatches = []; 
  let m;
  while ((m = wordRe.exec(stripped)) !== null) {
    const raw = m[1];
    const lower = raw.toLowerCase();
    if (/[A-Z]/.test(raw.slice(1))) continue;
    if (/\d/.test(raw)) continue;
    if (ignoredWords.has(lower) || customDict.has(lower)) continue;
    const ok = typo.check(raw) || typo.check(raw.charAt(0).toUpperCase() + raw.slice(1));
    if (!ok) {
      tempMatches.push({ start: m.index, end: m.index + raw.length });
      if (!seen.has(lower)) { seen.add(lower); misspellings.push({ word: raw, lower }); }
    }
  }
  spellMatches = tempMatches;
  refreshBackdrop();
  list.innerHTML = '';
  empty.style.display = 'none';
  if (misspellings.length === 0) {
    loading.classList.remove('show');
    empty.style.display = 'block';
    return;
  }
  loading.classList.add('show');
  let i = 0;
  function processNext() {
    if (currentSpellRun !== thisRun || !spellEnabled) return;
    if (i >= misspellings.length) { loading.classList.remove('show'); return; }
    const item = misspellings[i];
    let sugs = [];
    try { sugs = typo.suggest(item.word).slice(0, 5); } catch (e) {}
    renderSpellRow(item.word, item.lower, sugs);
    i++;
    setTimeout(processNext, 5);
  }
  processNext();
}

function renderSpellRow(word, lower, sugs) {
  const list = document.getElementById('spell-list');
  const row = document.createElement('div');
  row.className = 'spell-word'; row.id = 'sw-' + lower;
  const topRow = document.createElement('div');
  topRow.className = 'spell-word-row';
  const wordSpan = document.createElement('span');
  wordSpan.className = 'spell-word-text'; wordSpan.textContent = word;
  const actions = document.createElement('div');
  actions.className = 'spell-actions';
  const ignBtn = document.createElement('button');
  ignBtn.className = 'spell-btn'; ignBtn.textContent = T.spellIgnore;
  ignBtn.onclick = () => { ignoredWords.add(lower); removeSpellRow(lower); runSpellCheck(); };
  const addBtn = document.createElement('button');
  addBtn.className = 'spell-btn add'; addBtn.textContent = T.spellAdd;
  addBtn.onclick = () => { customDict.add(lower); removeSpellRow(lower); runSpellCheck(); };
  actions.append(ignBtn, addBtn);
  topRow.append(wordSpan, actions); row.appendChild(topRow);
  if (sugs.length > 0) {
    const sugDiv = document.createElement('div');
    sugDiv.className = 'spell-suggestions';
    sugs.forEach(sug => {
      const s = document.createElement('span');
      s.className = 'spell-sug'; s.textContent = sug;
      s.onclick = () => replaceWord(word, sug);
      sugDiv.appendChild(s);
    });
    row.appendChild(sugDiv);
  }
  list.appendChild(row);
}

function removeSpellRow(lower) {
  const el = document.getElementById('sw-' + lower);
  if (el) el.remove();
}

function replaceWord(original, replacement) {
  if (!guardEditorCommand()) return;
  const val = editor.value;
  const esc = original.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('\\b' + esc + '\\b', 'i');
  const m = re.exec(val);
  if (!m) return;
  const rep = m[0][0] === m[0][0].toUpperCase() && m[0][0] !== m[0][0].toLowerCase()
      ? replacement.charAt(0).toUpperCase() + replacement.slice(1)
      : replacement;
  editor.setSelectionRange(m.index, m.index + m[0].length);
  editor.focus();
  document.execCommand('insertText', false, rep);
  markDirty();
  runSpellCheck();
}

const MDWORKS_TOC_START = '<!-- mdworks-toc:start -->';
const MDWORKS_TOC_END = '<!-- mdworks-toc:end -->';
const TOC_MAX_DEPTH = 3;
const TOC_LOADER_TEXT_THRESHOLD = 15000;
const TOC_LOADER_HEADING_THRESHOLD = 40;
const TOC_LOADER_REPLACEMENT_THRESHOLD = 2500;

function detectLineEnding(text) {
  return String(text || '').includes('\r\n') ? '\r\n' : '\n';
}

function findTocBlockRange(text) {
  const source = String(text || '');
  const start = source.indexOf(MDWORKS_TOC_START);
  if (start < 0) return null;
  const endMarker = source.indexOf(MDWORKS_TOC_END, start + MDWORKS_TOC_START.length);
  return {
    start,
    end: endMarker < 0 ? source.length : endMarker + MDWORKS_TOC_END.length
  };
}

function maskRange(chars, start, end) {
  for (let i = start; i < end; i++) {
    if (chars[i] !== '\r' && chars[i] !== '\n') chars[i] = ' ';
  }
}

function maskMarkdownForToc(text) {
  const source = String(text || '');
  const masked = source.split('');
  const tocRange = findTocBlockRange(source);
  if (tocRange) maskRange(masked, tocRange.start, tocRange.end);

  let fence = null;
  let offset = 0;
  source.split(/\r?\n/).forEach(line => {
    const lineEnd = offset + line.length;
    const lineInToc = tocRange && offset < tocRange.end && lineEnd >= tocRange.start;
    const candidate = line.replace(/^ {0,3}(?:> ?)* {0,3}/, '');
    const marker = candidate.match(/^(`{3,}|~{3,})/);
    if (lineInToc) {
      maskRange(masked, offset, lineEnd);
    } else if (fence) {
      maskRange(masked, offset, lineEnd);
      if (marker && marker[1][0] === fence.char && marker[1].length >= fence.length &&
          candidate.slice(marker[1].length).trim() === '') {
        fence = null;
      }
    } else if (marker) {
      fence = { char: marker[1][0], length: marker[1].length };
      maskRange(masked, offset, lineEnd);
    }
    offset = lineEnd + (source.slice(lineEnd, lineEnd + 2) === '\r\n' ? 2 : 1);
  });

  let commentStart = -1;
  for (let i = 0; i < source.length; i++) {
    if (commentStart < 0 && masked[i] !== ' ' && source.startsWith('<!--', i)) {
      commentStart = i;
      i += 3;
    } else if (commentStart >= 0 && source.startsWith('-->', i)) {
      maskRange(masked, commentStart, i + 3);
      commentStart = -1;
      i += 2;
    }
  }
  if (commentStart >= 0) maskRange(masked, commentStart, source.length);
  return masked.join('');
}

function stripFootnoteReferencesFromHeadingSource(text) {
  const source = String(text || '');
  let output = '';
  let i = 0;
  while (i < source.length) {
    const char = source[i];
    if (char === '\\') {
      output += source.slice(i, i + 2);
      i += 2;
      continue;
    }
    if (char === '`') {
      const tickMatch = source.slice(i).match(/^`+/);
      const ticks = tickMatch ? tickMatch[0] : '`';
      const end = source.indexOf(ticks, i + ticks.length);
      if (end >= 0) {
        output += source.slice(i, end + ticks.length);
        i = end + ticks.length;
      } else {
        output += char;
        i += 1;
      }
      continue;
    }
    if (source.startsWith('[^', i)) {
      const end = source.indexOf(']', i + 2);
      if (end > i + 2) {
        const label = source.slice(i + 2, end);
        if (normalizeFootnoteLabel(label)) {
          i = end + 1;
          continue;
        }
      }
    }
    output += char;
    i += 1;
  }
  return output;
}

function stripInlineMarkdownForHeading(text) {
  const container = document.createElement('div');
  if (window.marked && window.DOMPurify) {
    container.innerHTML = sanitizeHtml((mdworksMarked || marked).parseInline(stripFootnoteReferencesFromHeadingSource(text)), MARKDOWN_SANITIZE_CONFIG);
    return (container.textContent || '').trim();
  }
  return stripFootnoteReferencesFromHeadingSource(text)
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/<[^>]+>/g, '')
    .replace(/[*_`~]/g, '')
    .replace(/\\([\\[\]])/g, '$1')
    .trim();
}

function extractMarkdownHeadings(text, options = {}) {
  const maxDepth = Math.min(6, Math.max(1, options.maxDepth || TOC_MAX_DEPTH));
  const maskedLines = maskMarkdownForToc(text).split(/\r?\n/);
  const sourceLines = String(text || '').split(/\r?\n/);
  const headings = [];
  maskedLines.forEach((line, index) => {
    const match = line.match(/^ {0,3}(?:> ?)* {0,3}(#{1,6})(?!#)[ \t]+(.+)$/);
    if (!match) return;
    const level = match[1].length;
    if (level > maxDepth) return;
    const sourceMatch = sourceLines[index].match(/^ {0,3}(?:> ?)* {0,3}#{1,6}(?!#)[ \t]+(.+)$/);
    if (!sourceMatch) return;
    const raw = sourceMatch[1].replace(/[ \t]+#+[ \t]*$/, '').trim();
    const title = stripInlineMarkdownForHeading(raw);
    if (!title || title === '目次' || title === 'Table of Contents') return;
    headings.push({ level, title });
  });
  return headings;
}

function slugifyHeading(text, used) {
  const registry = used || Object.create(null);
  let slug = String(text || '')
    .replace(/<[^>]+>/g, '')
    .replace(/[*_`~\[\]!\\]/g, '')
    .trim()
    .toLowerCase()
    .replace(/\s+/g, '-')
    .replace(/[!"#$%&'()*+,./:;<=>?@^`{|}~・、。]/g, '')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
  if (!slug) slug = 'section';
  const base = slug;
  let suffix = 2;
  while (registry[slug]) slug = `${base}-${suffix++}`;
  registry[slug] = true;
  return slug;
}

function escapeMarkdownLinkText(text) {
  return String(text || '').replace(/([\[\]\\])/g, '\\$1');
}

function buildTocMarkdown(headings, lineEnding = '\n') {
  const baseLevel = Math.min(...headings.map(heading => heading.level));
  const used = Object.create(null);
  const items = headings.map(heading => {
    const indent = '  '.repeat(Math.max(0, heading.level - baseLevel));
    const title = escapeMarkdownLinkText(heading.title);
    const slug = slugifyHeading(heading.title, used);
    return `${indent}- [${title}](#${slug})`;
  });
  return [
    MDWORKS_TOC_START,
    '',
    `## ${T.tocTitle}`,
    '',
    ...items,
    '',
    MDWORKS_TOC_END
  ].join(lineEnding);
}

function replaceEditorText(start, end, replacement) {
  if (!guardEditorCommand()) return;
  editor.focus();
  editor.setSelectionRange(start, end);
  const before = editor.value;
  document.execCommand('insertText', false, replacement);
  if (editor.value === before && (start !== end || replacement)) {
    editor.setRangeText(replacement, start, end, 'end');
  }
}

async function insertOrUpdateToc() {
  if (!guardEditorCommand()) return;
  closeMenus();
  const text = editor.value;
  const existing = findTocBlockRange(text);
  if (existing && !confirm(T.tocUpdateConfirm)) return;

  let tocLoaderVisible = false;
  const showTocLoader = async () => {
    if (tocLoaderVisible) return;
    tocLoaderVisible = true;
    showLoader(T.processingTocToast);
    setStatusBadge(T.processingTocStatus);
    await yieldToBrowserPaint();
  };

  try {
    if (text.length >= TOC_LOADER_TEXT_THRESHOLD) {
      await showTocLoader();
    }

    const headings = extractMarkdownHeadings(text, { maxDepth: TOC_MAX_DEPTH });
    if (!headings.length) {
      toast(T.tocNoHeadings);
      return;
    }

    const lineEnding = detectLineEnding(text);
    const toc = buildTocMarkdown(headings, lineEnding);
    const isLargeToc = (
      text.length >= TOC_LOADER_TEXT_THRESHOLD ||
      headings.length >= TOC_LOADER_HEADING_THRESHOLD ||
      toc.length >= TOC_LOADER_REPLACEMENT_THRESHOLD
    );

    if (isLargeToc) {
      await showTocLoader();
    }

    let start;
    let end;
    let replacement = toc;
    if (existing) {
      start = existing.start;
      end = existing.end;
    } else {
      start = editor.selectionStart;
      end = editor.selectionEnd;
      const needsLeadingBreak = start > 0 && !/[\r\n]$/.test(text.slice(0, start));
      const needsTrailingBreak = end < text.length && !/^[\r\n]/.test(text.slice(end));
      replacement = `${needsLeadingBreak ? lineEnding : ''}${toc}${needsTrailingBreak ? lineEnding : ''}`;
    }

    let suppressSeq = 0;
    if (isLargeToc) {
      suppressSeq = ++tocSuppressSeq;
      suppressInputHandling = true;
    }

    try {
      replaceEditorText(start, end, replacement);
      const cursor = start + replacement.length;
      editor.setSelectionRange(cursor, cursor);
    } finally {
      if (isLargeToc) {
        // Some browsers dispatch execCommand's input event after the next task.
        setTimeout(() => {
          const release = () => {
            if (suppressSeq === tocSuppressSeq) {
              suppressInputHandling = false;
            }
          };

          if (typeof requestAnimationFrame === 'function') {
            requestAnimationFrame(release);
          } else {
            release();
          }
        }, 50);
      }
    }

    markDirty();
    updateStatsOnly();

    const tasks = [];
    tasks.push(deferPasteTask(() => refreshBackdrop(), isLargeToc));
    if (previewOpen) tasks.push(deferPasteTask(() => renderPreview(), isLargeToc));
    if (outlineOpen) tasks.push(deferPasteTask(() => renderOutline(), isLargeToc));
    if (srPanelOpen) tasks.push(deferPasteTask(() => performSearch(false), isLargeToc));
    if (spellEnabled) tasks.push(deferPasteTask(() => runSpellCheck(), isLargeToc));

    clearTimeout(autoSaveTimeout);
    autoSaveTimeout = setTimeout(triggerAutoSave, 1500);

    if (isLargeToc) {
      await Promise.all(tasks);
    } else {
      Promise.all(tasks).catch(error => console.warn('Deferred TOC update failed', error));
    }

    toast(existing ? T.tocUpdated : T.tocInserted);
  } finally {
    if (tocLoaderVisible) {
      hideLoader();
      renderStorageBadge();
    }
  }
}

//#region [JS-12] TEXT INSERTION HELPERS
function getPos() { return { s: editor.selectionStart, e: editor.selectionEnd }; }
function setRange(s, e) {
  editor.selectionStart = s;
  editor.selectionEnd = e;
  editor.focus();
}
function ins(text, lineStart) {
  if (!guardEditorCommand()) return;
  const { s } = getPos();
  if (lineStart) {
    const val = editor.value;
    const ls = val.lastIndexOf('\n', s - 1) + 1;
    editor.setSelectionRange(ls, ls);
  }
  editor.focus();
  document.execCommand('insertText', false, text);
  markDirty();
  triggerAutoSave();
}
function wrap(mark) {
  if (!guardEditorCommand()) return;
  const { s, e } = getPos();
  const value = editor.value;
  const scrollTop = editor.scrollTop;
  const scrollLeft = editor.scrollLeft;
  const hasSelection = s !== e;
  const sel = value.slice(s, e) || (isJa ? '文字' : 'text');
  const replaceAndSelect = (rangeStart, rangeEnd, replacement, selectStart, selectEnd) => {
    editor.focus();
    editor.setSelectionRange(rangeStart, rangeEnd);
    document.execCommand('insertText', false, replacement);
    setRange(selectStart, selectEnd);
    editor.scrollTop = scrollTop;
    editor.scrollLeft = scrollLeft;
    markDirty();
    triggerAutoSave();
  };

  const countEdgeChars = (text, char, fromStart) => {
    let count = 0;
    const step = fromStart ? 1 : -1;
    let index = fromStart ? 0 : text.length - 1;
    while (index >= 0 && index < text.length && text[index] === char) {
      count += 1;
      index += step;
    }
    return count;
  };
  const isWrappedSelection = () => {
    if (!hasSelection || sel.length < mark.length * 2) return false;
    if (mark === '*') {
      const leading = countEdgeChars(sel, '*', true);
      const trailing = countEdgeChars(sel, '*', false);
      return leading % 2 === 1 && trailing % 2 === 1;
    }
    return sel.startsWith(mark) && sel.endsWith(mark);
  };

  if (isWrappedSelection()) {
    const inner = sel.slice(mark.length, -mark.length);
    replaceAndSelect(s, e, inner, s, s + inner.length);
    return;
  }

  if (hasSelection && s >= mark.length && value.slice(s - mark.length, s) === mark && value.slice(e, e + mark.length) === mark) {
    replaceAndSelect(s - mark.length, e + mark.length, sel, s - mark.length, s - mark.length + sel.length);
    return;
  }

  const rep = mark + sel + mark;
  replaceAndSelect(s, e, rep, s + mark.length, s + mark.length + sel.length);
}

function toggleScriptFormat(delimiter) {
  if (!guardEditorCommand()) return;
  const other = delimiter === '^' ? '~' : '^';
  const { s, e } = getPos();
  const value = editor.value;
  const scrollTop = editor.scrollTop;
  const scrollLeft = editor.scrollLeft;
  const selected = value.slice(s, e);
  if (!selected) { toast(T.scriptSelectText); editor.focus(); return; }
  if (/[\r\n]/.test(selected)) { toast(T.scriptOneLine); editor.focus(); return; }
  if (/[ \t]/.test(selected)) { toast(T.scriptSelectText); editor.focus(); return; }

  const replaceAndSelect = (rangeStart, rangeEnd, replacement, selectStart, selectEnd) => {
    editor.focus();
    editor.setSelectionRange(rangeStart, rangeEnd);
    document.execCommand('insertText', false, replacement);
    setRange(selectStart, selectEnd);
    editor.scrollTop = scrollTop;
    editor.scrollLeft = scrollLeft;
    markDirty();
    triggerAutoSave();
  };

  const isWrappedSelection = (mark) => selected.length >= 2 && selected.startsWith(mark) && selected.endsWith(mark);
  const hasOuterMarks = (mark) => s > 0 && e < value.length && value[s - 1] === mark && value[e] === mark;

  if (isWrappedSelection(delimiter)) {
    const inner = selected.slice(1, -1);
    replaceAndSelect(s, e, inner, s, s + inner.length);
    return;
  }
  if (hasOuterMarks(delimiter)) {
    replaceAndSelect(s - 1, e + 1, selected, s - 1, s - 1 + selected.length);
    return;
  }
  if (isWrappedSelection(other)) {
    const inner = selected.slice(1, -1);
    const replacement = delimiter + inner + delimiter;
    replaceAndSelect(s, e, replacement, s + 1, s + 1 + inner.length);
    return;
  }
  if (hasOuterMarks(other)) {
    const replacement = delimiter + selected + delimiter;
    replaceAndSelect(s - 1, e + 1, replacement, s, e);
    return;
  }

  const replacement = delimiter + selected + delimiter;
  replaceAndSelect(s, e, replacement, s + 1, s + 1 + selected.length);
}

function insBlock(before, after) {
  if (!guardEditorCommand()) return;
  const { s, e } = getPos();
  const sel = editor.value.slice(s, e);
  const rep = before + sel + after;
  editor.focus();
  document.execCommand('insertText', false, rep);
  setRange(s + before.length, s + before.length + sel.length);
  markDirty();
  triggerAutoSave();
}
function insertLink() {
  if (!guardEditorCommand()) return;
  const { s, e } = getPos();
  const sel = editor.value.slice(s, e) || T.insertLink;
  const rep = `[${sel}](URL)`;
  editor.focus();
  document.execCommand('insertText', false, rep);
  setRange(s + 1, s + 1 + sel.length);
  markDirty();
  triggerAutoSave();
}
function insertTable() {
  if (!guardEditorCommand()) return;
  editor.focus();
  document.execCommand('insertText', false, T.tableSnippet);
  markDirty();
  triggerAutoSave();
}

//#region [JS-13] WORD IMPORT (MAMMOTH + TURNDOWN)
const WORD_MAX_BYTES = 10 * 1024 * 1024;
function triggerWordImport() {
  if (!guardEditorCommand()) return;
  closeMenus();
  if (isDirty && editor.value.trim() !== '' && editor.value !== T.defaultMd && !isLegacyDefaultMarkdown(editor.value)) {
    if (!confirm(T.confirmWordImport || T.confirmNew)) return;
  }
  document.getElementById('word-input').click();

document.getElementById('word-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  if (file.size > WORD_MAX_BYTES) { alert(T.errSize); return; }
  try {
    showLoader(T.loadingWordLibs);
    const arrayBuffer = await file.arrayBuffer();
    showLoader(T.loadingWordParse);
    const sandboxResult = await convertWordInSandbox(arrayBuffer);
    const md = sandboxResult.markdown || '';
    const mammothMessages = Array.isArray(sandboxResult.messages) ? sandboxResult.messages : [];
    showLoader(T.loadingWordConvert);
    if (!md || !md.trim()) throw new Error('Converted markdown is empty.');
    await saveToHistoryList(filenameInput.value, editor.value);
    setEditorDocumentValue(md);
    filenameInput.value = file.name.replace(/\.docx$/i, '.md');
    fileHandle = null;
    syncFilenameInputState();
    update(); markDirty(); triggerAutoSave();
    hideLoader();
    toast(mammothMessages.length > 0 ? T.warnMammoth : T.importSuccess);
  } catch (error) {
    hideLoader(); alert(`${T.errImport}\n${error?.message || ''}`.trim());
  }
});

const WORD_IMPORT_SANDBOX_TIMEOUT_MS = 60000;
function getWordImportSandboxSrcdoc() {
  const runner = function () {
    const WORD_SANITIZE_CONFIG = Object.freeze({
      ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','p','br','hr','strong','b','em','i','s','del','code','pre','blockquote','ul','ol','li','table','thead','tbody','tr','th','td','a','img','span','sup','sub'],
      ALLOWED_ATTR: ['href','title','alt','src','class','colspan','rowspan','align'],
      ALLOW_DATA_ATTR: false,
      FORBID_TAGS: ['script','style','iframe','object','embed','form','meta','link','base','svg','math'],
      FORBID_ATTR: ['style','srcset','onerror','onclick','onload','onmouseover','onfocus'],
      KEEP_CONTENT: true
    });
    function normalizeInlineText(str) { return String(str || '').replace(/\u00a0/g, ' ').replace(/[ \t\r\n]+/g, ' ').trim(); }
    function sanitizeWordHtml(html) {
      if (!self.DOMPurify) throw new Error('DOMPurify is unavailable in sandbox.');
      DOMPurify.addHook('afterSanitizeAttributes', (node) => {
        if (!node || !node.tagName) return;
        const tag = node.tagName.toLowerCase();
        if (tag === 'img') { node.removeAttribute('src'); node.removeAttribute('srcset'); }
      });
      return DOMPurify.sanitize(String(html || ''), WORD_SANITIZE_CONFIG);
    }
    function preprocessWordHtml(html, isJa) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      doc.querySelectorAll('div[class*="textbox"], div[class*="shape"]').forEach(node => {
        const text = normalizeInlineText(node.textContent || '');
        node.replaceWith(doc.createTextNode(text ? `\n\n[Textbox: ${text}]\n\n` : ''));
      });
      return doc;
    }
    async function convert(arrayBuffer, isJa) {
      const result = await mammoth.convertToHtml({ arrayBuffer });
      const safeHtml = sanitizeWordHtml(result.value || '');
      const doc = preprocessWordHtml(safeHtml, isJa);
      const turndownService = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-' });
      const md = turndownService.turndown(doc.body.innerHTML);
      return { markdown: md, messages: result.messages || [] };
    }
    window.addEventListener('message', async (event) => {
      const msg = event.data || {};
      if (msg.type !== 'MDWORKS_WORD_IMPORT_REQUEST') return;
      try {
        const result = await convert(msg.arrayBuffer, !!msg.isJa);
        parent.postMessage({ type: 'MDWORKS_WORD_IMPORT_RESULT', id: msg.id, ok: true, ...result }, '*');
      } catch (err) {
        parent.postMessage({ type: 'MDWORKS_WORD_IMPORT_RESULT', id: msg.id, ok: false, error: err?.message }, '*');
      }
    });
  };
  return `<!doctype html><html><head><meta charset="utf-8"></head><body>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.12.0/mammoth.browser.min.js"><\/script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js"><\/script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.4/lib/turndown.browser.umd.min.js"><\/script>
    <script>(${runner})();<\/script></body></html>`;
}

function convertWordInSandbox(arrayBuffer) {
  return new Promise((resolve, reject) => {
    const id = `word-${window.crypto?.randomUUID ? crypto.randomUUID() : Date.now()}`;
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.sandbox = 'allow-scripts';
    iframe.srcdoc = getWordImportSandboxSrcdoc();

    let loadTimer = setTimeout(() => {
      window.removeEventListener('message', onMessage);
      iframe.remove();
      reject(new Error('Sandboxed Word import timed out.'));
    }, WORD_IMPORT_SANDBOX_TIMEOUT_MS);

    const onMessage = (event) => {
      if (event.source !== iframe.contentWindow) return;

      const msg = event.data || {};
      if (msg.type === 'MDWORKS_WORD_IMPORT_RESULT' && msg.id === id) {
        clearTimeout(loadTimer);
        window.removeEventListener('message', onMessage);
        iframe.remove();
        if (msg.ok) resolve(msg); else reject(new Error(msg.error));
      }
    };
    window.addEventListener('message', onMessage);
    iframe.onload = () => iframe.contentWindow.postMessage({ type: 'MDWORKS_WORD_IMPORT_REQUEST', id, arrayBuffer, isJa }, '*');
    document.body.appendChild(iframe);
  });
}
