function isUserAbortError(err) {
  return err && (err.name === 'AbortError' || err.code === 20);
}


const RESTRICTED_VIEWER_FORMAT = 'mdworks-restricted-viewer';
const RESTRICTED_VIEWER_VERSION = 1;

function parseRestrictedViewerBoxFromHtml(htmlText) {
  if (!String(htmlText || '').includes('mdworks-restricted-viewer-box')) return null;
  const doc = new DOMParser().parseFromString(htmlText, 'text/html');
  const script = doc.getElementById('mdworks-restricted-viewer-box');
  if (!script) return null;
  const box = JSON.parse(script.textContent || '{}');
  const recovery = box?.recovery;
  if (box?.format !== RESTRICTED_VIEWER_FORMAT || box?.formatVersion !== RESTRICTED_VIEWER_VERSION) return null;
  if (!recovery || recovery.label !== 'restricted-viewer-recovery' || recovery.alg !== 'AES-GCM' || recovery.kdf !== 'PBKDF2' || recovery.hash !== 'SHA-256' || recovery.iterations !== 310000) return null;
  return box;
}

async function decryptRestrictedViewerRecovery(box, passphrase) {
  const plain = await decryptPrivateAppBox(box.recovery, passphrase);
  const payload = JSON.parse(plain);
  if (payload?.type !== 'mdworks-restricted-viewer-recovery' || typeof payload.markdown !== 'string') {
    throw new Error('Invalid Restricted Viewer recovery payload');
  }
  return payload;
}

function restrictedViewerSourceToMarkdownName(sourceName) {
  return ensureMarkdownFilename(String(sourceName || 'document')
    .replace(/\.restricted\.view\.html?$/i, '')
    .replace(/\.html?$/i, '') || 'document');
}

async function importRestrictedViewerHtml(htmlText, sourceName) {
  const box = parseRestrictedViewerBoxFromHtml(htmlText);
  if (!box) return false;

  const passphrase = prompt(T.restrictedViewerImportPrompt) || '';
  if (!passphrase) return true;

  let error = null;
  showLoader(T.viewerImportDecrypting);
  await yieldToBrowserPaint();

  try {
    const payload = await decryptRestrictedViewerRecovery(box, passphrase);

    showLoader(T.viewerRestoringMarkdown);
    await yieldToBrowserPaint();

    setEditorDocumentValue(payload.markdown.normalize('NFC'));
    filenameInput.value = ensureMarkdownFilename(payload.filename || payload.title || restrictedViewerSourceToMarkdownName(sourceName));
    fileHandle = null;
    syncFilenameInputState();
    update();
    markDirty();
    await triggerAutoSave();
    if (spellEnabled) runSpellCheck();
    await yieldToBrowserPaint();
  } catch (err) {
    console.error(err);
    error = err;
  } finally {
    hideLoader();
    renderStorageBadge();
  }

  toast(error ? T.restrictedViewerImportError : T.restrictedViewerImported);
  return true;
}

// --- NEW: parsePrivateViewerBoxFromHtml ---
function parsePrivateViewerBoxFromHtml(htmlText) {
  if (!String(htmlText || '').includes('mdworks-private-viewer')) return null;
  const doc = new DOMParser().parseFromString(htmlText, 'text/html');
  const script = doc.getElementById('mdworks-private-viewer-box');
  if (!script) return null;
  const box = JSON.parse(script.textContent || '{}');
  if (box?.label !== 'private-viewer' || box?.alg !== 'AES-GCM' || box?.kdf !== 'PBKDF2') return null;
  return box;
}

// --- NEW: decryptPrivateViewerPayload ---
async function decryptPrivateViewerPayload(box, passphrase) {
  const plain = await decryptPrivateAppBox(box, passphrase);
  const payload = JSON.parse(plain);
  if (payload?.type !== 'mdworks-private-viewer') {
    throw new Error('Invalid Private Viewer payload');
  }
  if (typeof payload.markdown !== 'string') {
    const err = new Error('Missing restorable Markdown');
    err.code = 'MDWORKS_PRIVATE_VIEWER_MISSING_MARKDOWN';
    throw err;
  }
  return payload;
}

// --- NEW: importPrivateViewerHtml ---
async function importPrivateViewerHtml(htmlText, sourceName) {
  const box = parsePrivateViewerBoxFromHtml(htmlText);
  if (!box) return false;

  const passphrase = prompt(T.privateViewerImportPrompt) || '';
  if (!passphrase) return true;

  let error = null;
  showLoader(T.viewerImportDecrypting);
  await yieldToBrowserPaint();

  try {
    const payload = await decryptPrivateViewerPayload(box, passphrase);

    showLoader(T.viewerRestoringMarkdown);
    await yieldToBrowserPaint();

    setEditorDocumentValue(payload.markdown.normalize('NFC'));
    filenameInput.value = ensureMarkdownFilename(payload.title || String(sourceName || '').replace(/\.(private\.)?view\.html?$/i, '') || 'document');
    fileHandle = null;
    syncFilenameInputState();
    update();
    markSaved();
    await triggerAutoSave();

  } finally {

  }

}

function notifyFileSystemError(action, err) {
  if (isUserAbortError(err)) return;
  console.error(`${action} failed`, err);
  alert(isJa ? `${action}に失敗しました。` : `${action} failed.`);
}

async function handleOpen() {
  closeMenus();
  await closePreviewBeforeOpen();
  if (!isMobile && window.showOpenFilePicker) {
    try {
      const openOptions = {
        id: MDWORKS_PICKER_ID,
        types: [{ description: 'Markdown / Private Viewer HTML', accept: { 'text/markdown': ['.md', '.txt', '.markdown'], 'text/html': ['.html', '.htm'] } }]
      };
      const startHandle = lastPickerStartHandle || fileHandle;
      if (startHandle) {
        openOptions.startIn = startHandle;
      }

      const [handle] = await window.showOpenFilePicker(openOptions);
      lastPickerStartHandle = handle;
      const file = await handle.getFile();
      await saveToHistoryList(filenameInput.value, editor.value);
      const text = await file.text();
      if (await importRestrictedViewerHtml(text, file.name)) return;
      if (await importPrivateViewerHtml(text, file.name)) return;
      fileHandle = handle;
      syncFilenameInputState();
      filenameInput.value = file.name;
      setEditorDocumentValue(text.normalize('NFC'));
      update(); markSaved(); triggerAutoSave();
      toast(T.opened(file.name));
    } catch (e) {
      notifyFileSystemError(isJa ? 'ファイルを開く処理' : 'Open file', e);
    }
  } else {
    document.getElementById('file-input').click();
  }
}

document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  e.target.value = '';

  try {
    await saveToHistoryList(filenameInput.value, editor.value);

    const text = await file.text();
    if (await importRestrictedViewerHtml(text, file.name)) return;
    if (await importPrivateViewerHtml(text, file.name)) return;

    filenameInput.value = file.name;
    setEditorDocumentValue(text.normalize('NFC'));
    fileHandle = null;
    syncFilenameInputState();

    update();
    markSaved();
    triggerAutoSave();

    if (spellEnabled) runSpellCheck();

    toast(T.opened(file.name));
  } catch (err) {
    console.error(err);
    alert(isJa ? 'ファイルの読み込みに失敗しました。' : 'Failed to open file.');
  }
});

function ensureTextFilename(name) {
  const fallback = 'untitled.md';
  const value = String(name || '').trim().normalize('NFC');
  if (!value) return fallback;
  if (/\.[^\\\/\.\s]{1,16}$/u.test(value)) return value;
  return `${value}.md`;
}

function ensureMarkdownFilename(name) {
  return ensureTextFilename(name);
}

async function handleSave(isSaveAs = false) {
  if (previewFocusOpen && isSaveAs) { closeMenus(); return; }
  closeMenus();
  await saveToHistoryList(filenameInput.value, editor.value);
  const saveFilename = ensureMarkdownFilename(filenameInput.value);
  if (isMobile) {
    const filename = saveFilename;
    const file = new File([editor.value], filename, { type: 'text/markdown' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); filenameInput.value = filename; markSaved(); } catch (e) {}
    } else fallbackDownload();
  } else {
    if (window.showSaveFilePicker) {
      try {
        if (!fileHandle || isSaveAs) {
          const saveOptions = {
            id: MDWORKS_PICKER_ID,
            suggestedName: saveFilename,
            types: [
              {
                description: 'Text and code files',
                accept: {
                  'text/plain': [
                    '.md', '.markdown', '.txt',
                    '.py', '.js', '.ts', '.html', '.htm', '.css',
                    '.json', '.csv', '.xml', '.yml', '.yaml',
                    '.sh', '.bat', '.ps1'
                  ]
                }
              }
            ],
            excludeAcceptAllOption: false
          };
          const startHandle = lastPickerStartHandle || fileHandle;
          if (startHandle) {
            saveOptions.startIn = startHandle;
          }

          fileHandle = await window.showSaveFilePicker(saveOptions);
          syncFilenameInputState();
        }
        if (fileHandle) {
          lastPickerStartHandle = fileHandle;
          syncFilenameInputState();
        }
        const writable = await fileHandle.createWritable();
        await writable.write(editor.value);
        await writable.close();
        filenameInput.value = fileHandle.name;
        markSaved(); toast(T.saved);
      } catch (e) {
        notifyFileSystemError(isJa ? 'ファイルの保存' : 'Save file', e);
      }
    } else fallbackDownload();
  }
}

function fallbackDownload() {
  const filename = ensureMarkdownFilename(filenameInput.value);
  filenameInput.value = filename;
  const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);

  markSaved();
  toast(T.downloaded);
  syncFilenameInputState();
}

// --- NEW: escapeHtml ---
function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// --- NEW: sanitizeFileBaseName ---
function sanitizeFileBaseName(value) {
  const base = String(value || '').trim() || 'document';
  return base
    .replace(/[\\/:*?"<>|]+/g, '-')
    .replace(/\s+/g, ' ')
    .slice(0, 80) || 'document';
}

// --- NEW: safeScriptJson ---
function safeScriptJson(value) {
  return JSON.stringify(value)
    .replace(/</g, '\\u003c')
    .replace(/>/g, '\\u003e')
    .replace(/&/g, '\\u0026')
    .replace(/\u2028/g, '\\u2028')
    .replace(/\u2029/g, '\\u2029');
}

function buildStandaloneHtmlForExport() {

  clone.querySelectorAll('.show').forEach(el => el.classList.remove('show'));

  const previewEl = clone.querySelector('#preview');
  if (previewEl) previewEl.innerHTML = '';

  const backdropEl = clone.querySelector('#editor-backdrop');
  if (backdropEl) backdropEl.innerHTML = '';

  const editorEl = clone.querySelector('#editor');
  if (editorEl) {
    editorEl.innerHTML = '';
    editorEl.textContent = '';
    editorEl.removeAttribute('value');
  }

  const toastEl = clone.querySelector('#toast');
  if (toastEl) {
    toastEl.className = '';
    toastEl.innerHTML = '';
  }

  const spellList = clone.querySelector('#spell-list');
  if (spellList) spellList.innerHTML = '';

  const histList = clone.querySelector('#hist-list');
  if (histList) histList.innerHTML = '';

  const outlineList = clone.querySelector('#outline-list');
  if (outlineList) outlineList.innerHTML = '';

  const rnBody = clone.querySelector('#rn-body');
  if (rnBody) rnBody.innerHTML = '';

  const docBody = clone.querySelector('#doc-body');
  if (docBody) docBody.innerHTML = '';

  const updateIndicatorClone = clone.querySelector('#update-indicator');
  if (updateIndicatorClone) updateIndicatorClone.hidden = true;

  const updateModalClone = clone.querySelector('#update-modal');
  if (updateModalClone) {
    updateModalClone.classList.remove('show');
    updateModalClone.setAttribute('aria-hidden', 'true');
    updateModalClone.setAttribute('data-state', 'closed');
  }

  const exportModalClone = clone.querySelector('#export-modal');
  if (exportModalClone) {
    exportModalClone.classList.remove('show');
    exportModalClone.setAttribute('aria-hidden', 'true');
    exportModalClone.setAttribute('data-state', 'closed');
  }

  const updateCurrentVersionClone = clone.querySelector('#update-current-version');
  if (updateCurrentVersionClone) updateCurrentVersionClone.textContent = '';

  const updateLatestVersionClone = clone.querySelector('#update-latest-version');
  if (updateLatestVersionClone) updateLatestVersionClone.textContent = '';

  const rnModal = clone.querySelector('#rn-modal');
  if (rnModal) {
    rnModal.classList.remove('show');
    rnModal.setAttribute('aria-hidden', 'true');
    rnModal.setAttribute('data-state', 'closed');
  }

  const docModal = clone.querySelector('#doc-modal');
  if (docModal) {
    docModal.classList.remove('show');
    docModal.setAttribute('aria-hidden', 'true');
    docModal.setAttribute('data-state', 'closed');
  }

  const loader = clone.querySelector('#global-loader');
  if (loader) loader.classList.remove('show');

  const dataScript = clone.querySelector('#standalone-data');
  if (dataScript) {
    const data = {
      filename: filenameInput.value.trim() || 'untitled.md',
      content: editor.value

    dataScript.textContent = JSON.stringify(data)
      .replace(/</g, '\\u003c')
      .replace(/>/g, '\\u003e')
      .replace(/&/g, '\\u0026');
  }

  const htmlStr = '<!DOCTYPE html>\n' + clone.outerHTML;
  const baseName = (filenameInput.value || 'document').replace(/\.[^/.]+$/, '') || 'document';

  return {
    htmlStr,
    baseName,
    appName: baseName + '.app.html',
    privateAppName: baseName + '.private.app.html'
  };
}

async function exportStandalone() {
  if (!guardEditorCommand()) return;
  closeMenus();
  await saveToHistoryList(filenameInput.value, editor.value);

  const { htmlStr, appName } = buildStandaloneHtmlForExport();

  if (isMobile) {

      triggerDownload(htmlStr, appName, 'text/html');

    triggerDownload(htmlStr, appName, 'text/html');
    toast(T.downloaded);

async function encryptRestrictedViewerDisplay(payloadText) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(payloadText));
  const rawKey = new Uint8Array(await crypto.subtle.exportKey('raw', key));
  return {
    alg: 'AES-GCM',
    keyFormat: 'raw-base64',
    key: bytesToB64(rawKey),
    iv: bytesToB64(iv),
    data: bytesToB64(new Uint8Array(cipher))
  };
}

async function exportRestrictedViewer() {
  if (!guardEditorCommand()) return;
  closeMenus();
  if (!window.crypto || !crypto.subtle || !window.TextEncoder || !window.TextDecoder) {
    alert(isJa ? 'このブラウザでは制限付きViewerを作成できません。' : 'This browser cannot create a Restricted Viewer.');
    return;
  }

  let recoveryPassword = prompt(T.restrictedViewerRecoveryPassword);
  if (!recoveryPassword) return;
  const confirmation = prompt(T.restrictedViewerRecoveryPasswordConfirm);
  if (!confirmation) return;
  if (recoveryPassword !== confirmation) {
    toast(T.restrictedViewerPasswordMismatch);
    recoveryPassword = null;
    return;
  }

  try {
    showLoader(T.creatingRestrictedViewer);
    const rawTitle = (filenameInput.value || '').replace(/\.[^/.]+$/, '').trim() || 'document';
    const title = rawTitle || 'document';
    const originalFilename = ensureMarkdownFilename(filenameInput.value.trim() || `${title}.md`);
    const createdAt = new Date().toISOString();
    const displayPayload = {
      v: 1,
      type: 'mdworks-restricted-viewer-display',
      title,
      createdAt,
      html: safeMarkdownHtml(editor.value)
    };
    const recoveryPayload = {
      v: 1,
      type: 'mdworks-restricted-viewer-recovery',
      title: originalFilename,
      filename: originalFilename,
      createdAt,
      format: RESTRICTED_VIEWER_FORMAT,
      markdown: editor.value
    };
    const box = {
      format: RESTRICTED_VIEWER_FORMAT,
      formatVersion: RESTRICTED_VIEWER_VERSION,
      display: await encryptRestrictedViewerDisplay(JSON.stringify(displayPayload)),
      recovery: await encryptRestrictedViewerRecovery(JSON.stringify(recoveryPayload), recoveryPassword)
    };
    recoveryPassword = null;
    const viewerHtml = buildRestrictedViewerHtml(box, title, {
      errorLabel: T.restrictedViewerOpenError,
      outlineLabel: T.viewerOutline,
      outlineEmpty: T.viewerOutlineEmpty
    });
    const filename = sanitizeFileBaseName(title) + '.restricted.view.html';
    triggerDownload(viewerHtml, filename, 'text/html');
    toast(T.exportedRestrictedViewer);
  } catch (err) {
    console.error(err);
    toast(T.errViewer);
  } finally {
    recoveryPassword = null;
    hideLoader();
  }
}

  async function deriveKey(passphrase){
    var material=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(box.salt),iterations:box.iterations,hash:box.hash||'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);

    });
    if(!count)empty.hidden=false;
  }

  function targetElement(target){
    if(target instanceof Element)return target;
    return target && target.parentElement ? target.parentElement : null;

  function isEditableElement(target){
    var el=targetElement(target);
    return Boolean(el && el.closest('input, textarea, select, [contenteditable="true"]'));

    var href=anchor.getAttribute('href')||'';

// --- NEW: exportPrivateViewer ---
async function exportPrivateViewer() {
  if (!guardEditorCommand()) return;
  closeMenus();

  if (!window.crypto || !crypto.subtle || !window.TextEncoder || !window.TextDecoder) {
    alert(isJa ? 'このブラウザではパスワード付きViewerを作成できません。' : 'This browser cannot create a Password-protected Viewer.');
    return;
  }

  const passphrase = getPrivateAppPassphrase('viewer');
  if (!passphrase) return;

  try {
    showLoader(T.creatingPrivateViewer);
    const rawTitle = (filenameInput.value || '').replace(/\.[^/.]+$/, '').trim() || 'document';
    const title = rawTitle || 'document';
    const payload = {
      v: 1,
      type: 'mdworks-private-viewer',
      contentType: 'sanitized-html',
      title,
      createdAt: new Date().toISOString(),
      markdown: editor.value,
      html: safeMarkdownHtml(editor.value)
    };
    const encryptedBox = await encryptPrivateAppBox(JSON.stringify(payload), passphrase, 'private-viewer');
    const viewerHtml = buildPrivateViewerHtml(encryptedBox, title, {
      passphraseLabel: T.viewerPassphrase,
      unlockLabel: T.viewerUnlock,
      decryptingLabel: T.viewerDecrypting,
      errorLabel: T.viewerPassphraseError,
      enterPassword: T.viewerEnterPassword,
      notice: T.viewerSecurityNotice,
      outlineLabel: T.viewerOutline,
      outlineEmpty: T.viewerOutlineEmpty
    });
    const filename = sanitizeFileBaseName(title) + '.private.view.html';
    triggerDownload(viewerHtml, filename, 'text/html');
    toast(T.exportedPrivateViewer);
  } catch (err) {
    console.error(err);
    toast(T.errViewer);
  } finally {
    hideLoader();
  }
}

function getPrivateAppPassphrase(target = 'app') {
  const p1 = prompt(target === 'viewer' ? T.passwordViewerPrompt : T.passwordAppPrompt) || '';
  if (!p1) return null;

  const p2 = prompt(T.passwordConfirmPrompt) || '';
  if (!p2) return null;

  if (p1 !== p2) {
    toast(T.passwordMismatch);
    return null;
  }

  return p1;
}

async function derivePrivateAppKey(passphrase, saltBytes, iterations) {
  const material = await crypto.subtle.importKey(
    'raw',
    enc.encode(passphrase),
    'PBKDF2',
    false,
    ['deriveKey']
  );

  return crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: saltBytes,
      iterations,
      hash: 'SHA-256'
    },
    material,
    {
      name: 'AES-GCM',
      length: 256
    },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptPrivateAppBox(plainText, passphrase, label) {
  const iterations = 310000;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));

  const key = await derivePrivateAppKey(passphrase, salt, iterations);

  const cipher = await crypto.subtle.encrypt(
    {
      name: 'AES-GCM',
      iv
    },
    key,
    enc.encode(plainText)
  );

  return {
    v: 1,
    label,
    alg: 'AES-GCM',
    kdf: 'PBKDF2',
    hash: 'SHA-256',
    iterations,
    salt: bytesToB64(salt),
    iv: bytesToB64(iv),
    data: bytesToB64(new Uint8Array(cipher))
  };
}

// --- NEW: decryptPrivateAppBox ---
async function decryptPrivateAppBox(box, passphrase) {
  const key = await derivePrivateAppKey(passphrase, b64ToBytes(box.salt), box.iterations);
  const plain = await crypto.subtle.decrypt(
    {
      name: 'AES-GCM',
      iv: b64ToBytes(box.iv)
    },
    key,
    b64ToBytes(box.data)
  );
  return dec.decode(plain);
}

async function buildPrivateAppPayload(htmlStr, passphrase, meta) {
  return {
    v: 1,
    type: 'mdworks-private-app',
    app: 'MD//WORKS Pro Private App',
    createdAt: new Date().toISOString(),
    meta: {
      filename: meta?.filename || 'document.private.app.html',
      originalFilename: meta?.originalFilename || 'untitled.md',
      note: 'The app body is encrypted. Only this loader is stored in plaintext.'
    },
    primary: await encryptPrivateAppBox(htmlStr, passphrase, 'primary'),
    backup: await encryptPrivateAppBox(htmlStr, passphrase, 'backup')
  };
}

async function exportPrivateStandalone() {
  if (!guardEditorCommand()) return;
  closeMenus();

  if (!window.crypto || !crypto.subtle || !window.TextEncoder || !window.TextDecoder) {
    alert(
      isJa
        ? 'このブラウザでは暗号化Appを作成できません。\nPC版のChromeまたはEdgeの最新版を推奨します。'
        : 'This browser cannot create a Private App. Latest desktop Chrome or Edge is recommended.'
    );
    return;
  }

  const passphrase = getPrivateAppPassphrase('app');
  if (!passphrase) return;

  await saveToHistoryList(filenameInput.value, editor.value);

  try {
    showLoader(isJa ? '暗号化Appを作成中...' : 'Creating Private App...');

    const { htmlStr, privateAppName } = buildStandaloneHtmlForExport();

    const payload = await buildPrivateAppPayload(htmlStr, passphrase, {
      filename: privateAppName,
      originalFilename: filenameInput.value.trim() || 'untitled.md'
    });

    const loaderHtml = buildPrivateAppLoader(payload, privateAppName);

    hideLoader();

    if (isMobile) {
      const file = new File([loaderHtml], privateAppName, { type: 'text/html' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: privateAppName }).catch(e => console.warn('Share canceled', e));
      } else {
        triggerDownload(loaderHtml, privateAppName, 'text/html');
      }
    } else {
      triggerDownload(loaderHtml, privateAppName, 'text/html');
      toast(isJa ? '暗号化Appを書き出しました' : 'Private App exported');
    }
  } catch (err) {
    hideLoader();
    console.error(err);
    alert(
      isJa
        ? `暗号化Appの作成に失敗しました。\n${err?.message || err}`
        : `Failed to create Private App.\n${err?.message || err}`
    );
  }
}

function escapeHtmlAttrText(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function buildPrivateAppLoader(payload, filename) {
  const payloadJson = JSON.stringify(payload)
    .replace(/</g, '\\u003c')
    .replace(/>/g, '\\u003e')
    .replace(/&/g, '\\u0026');

  const safeFilename = escapeHtmlAttrText(filename || 'document.private.app.html');

  return `<!DOCTYPE html>

<script>
const PRIVATE_APP_PAYLOAD = ${payloadJson};
let decryptedHtml = '';
let rescueFilename = 'rescued.md';

const $ = id => document.getElementById(id);

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function setError(msg) {
  $('error').textContent = msg || '';
}

function setBusy(isBusy) {
  $('unlock-btn').disabled = isBusy;
  $('unlock-btn').textContent = isBusy ? 'Decrypting...' : 'Unlock';
}

function addCheck(label, state, detail) {
  const div = document.createElement('div');
  div.className = 'check ' + state;
  div.textContent = label + ': ' + detail;
  $('checks').appendChild(div);
}

function renderChecks() {
  $('checks').innerHTML = '';

  const hasCrypto = !!(window.crypto && crypto.subtle);
  const hasTextApi = !!(window.TextEncoder && window.TextDecoder);
  const isFile = location.protocol === 'file:';
  const online = navigator.onLine;

  addCheck('Web Crypto API', hasCrypto ? 'ok' : 'bad', hasCrypto ? 'OK' : 'Unavailable');
  addCheck('TextEncoder / TextDecoder', hasTextApi ? 'ok' : 'bad', hasTextApi ? 'OK' : 'Unavailable');
  addCheck('Open mode', isFile ? 'warn' : 'ok', isFile ? 'Local file' : location.protocol);
  addCheck('Network', online ? 'ok' : 'warn', online ? 'Online' : 'Offline');

  if (!hasCrypto || !hasTextApi) {
    setError('このブラウザでは復号できません。PC版ChromeまたはEdgeの最新版で開いてください。');
    $('unlock-btn').disabled = true;
  }
}

async function deriveKey(passphrase, saltB64, iterations) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey(
    'raw',
    enc.encode(passphrase),
    'PBKDF2',
    false,
    ['deriveKey']
  );

  return crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: b64ToBytes(saltB64),
      iterations,
      hash: 'SHA-256'
    },
    material,
    {
      name: 'AES-GCM',
      length: 256
    },
    false,
    ['decrypt']
  );
}

async function decryptBox(box, passphrase) {
  const key = await deriveKey(passphrase, box.salt, box.iterations);
  const plain = await crypto.subtle.decrypt(
    {
      name: 'AES-GCM',
      iv: b64ToBytes(box.iv)
    },
    key,
    b64ToBytes(box.data)
  );
  return new TextDecoder().decode(plain);
}

async function unlock() {
  setError('');
  $('success').style.display = 'none';
  $('rescue').style.display = 'none';

  const passphrase = $('passphrase').value || '';
  if (!passphrase) {
    setError('パスフレーズを入力してください。');
    return;
  }

  setBusy(true);

  const candidates = [
    ['primary', PRIVATE_APP_PAYLOAD.primary],
    ['backup', PRIVATE_APP_PAYLOAD.backup]
  ];

  const errors = [];

  for (const [label, box] of candidates) {
    if (!box) continue;
    try {
      decryptedHtml = await decryptBox(box, passphrase);
      $('success').style.display = 'block';
      setError(label === 'backup'
        ? 'primaryの復号に失敗しましたが、backupから復号できました。ファイル破損に備えて新しいPrivate Appとして書き出し直すことを推奨します。'
        : ''
      );
      setBusy(false);
      return;
    } catch (err) {
      errors.push(label + ': failed');
    }
  }

  setBusy(false);
  setError('復号に失敗しました。パスフレーズが違うか、ファイルが破損している可能性があります。' + (errors.length ? ' [' + errors.join(', ') + ']' : ''));
}

function launchApp() {
  if (!decryptedHtml) return;
  document.open();
  document.write(decryptedHtml);
  document.close();
}

function launchAppBlob() {
  if (!decryptedHtml) return;
  const blob = new Blob([decryptedHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  location.href = url;
}

function rescueText() {
  if (!decryptedHtml) return;

  try {
    const doc = new DOMParser().parseFromString(decryptedHtml, 'text/html');
    const dataScript = doc.getElementById('standalone-data');

    if (!dataScript) {
      throw new Error('standalone-data not found');
    }

    const data = JSON.parse(dataScript.textContent || '{}');
    const content = data.content || '';
    rescueFilename = data.filename || PRIVATE_APP_PAYLOAD?.meta?.originalFilename || 'rescued.md';

    if (!content) {
      throw new Error('content is empty');
    }

    $('rescue-text').value = content;
    $('rescue').style.display = 'block';
  } catch (err) {
    setError('本文救出に失敗しました: ' + (err?.message || err));
  }
}

async function copyRescueText() {
  const text = $('rescue-text').value || '';
  if (!text) return;

  try {
    await navigator.clipboard.writeText(text);
    setError('本文をクリップボードにコピーしました。');
  } catch {
    $('rescue-text').focus();
    $('rescue-text').select();
    document.execCommand('copy');
    setError('本文を選択しました。コピーできない場合は手動でコピーしてください。');
  }
}

function downloadRescueText() {
  const text = $('rescue-text').value || '';
  if (!text) return;

  let name = rescueFilename || 'rescued.md';
  if (!/\\.(md|txt|markdown)$/i.test(name)) name += '.md';

  const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('unlock-btn').addEventListener('click', unlock);
$('launch-btn').addEventListener('click', launchApp);
$('launch-blob-btn').addEventListener('click', launchAppBlob);
$('rescue-btn').addEventListener('click', rescueText);
$('copy-rescue-btn').addEventListener('click', copyRescueText);
$('download-rescue-btn').addEventListener('click', downloadRescueText);

$('passphrase').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});

window.addEventListener('online', renderChecks);
window.addEventListener('offline', renderChecks);

renderChecks();
<\/script>
</body>
</html>`;
}

function triggerDownload(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
//#endregion

//#region [JS-15] OUTLINE, HISTORY & LINTER
function toggleOutline() {
  outlineOpen = !outlineOpen;
  document.getElementById('outline-panel').classList.toggle('show', outlineOpen);
  document.getElementById('outline-check').style.opacity = outlineOpen ? '1' : '0';
  if (outlineOpen) renderOutline(); closeMenus();
}

function renderOutline() {
  const container = document.getElementById('outline-list');
  container.innerHTML = '';
  let charOffset = 0;
  const usedHeadingIds = Object.create(null);
  editor.value.split('\n').forEach(line => {
    const m = line.match(/^(#{1,6})\s+(.+)/);
    if (m) {
      const div = document.createElement('div');
      const raw = m[2].replace(/[ \t]+#+[ \t]*$/, '').trim();
      const title = stripInlineMarkdownForHeading(raw);
      div.className = `ol-item ol-h${m[1].length}`;
      div.textContent = title;
      div.dataset.headingId = slugifyHeading(title, usedHeadingIds);
      const target = charOffset;
      div.onclick = () => handleOutlineNavigation(target, div.dataset.headingId);
      container.appendChild(div);
    }
    charOffset += line.length + 1;
  });
}

function cssEscapeId(id) {
  if (window.CSS && typeof CSS.escape === 'function') return CSS.escape(id);
  return String(id).replace(/[^a-zA-Z0-9_-]/g, ch => `\\${ch}`);
}

function getPreviewFocusScrollOffset() {
  const exitBtn = document.getElementById('preview-focus-exit-btn');
  const btnHeight = exitBtn ? exitBtn.getBoundingClientRect().height : 0;
  return Math.max(56, Math.ceil(btnHeight + 24));
}

function navigatePreviewToHeading(headingId) {
  if (!headingId) return;
  const target = preview.querySelector(`#${cssEscapeId(headingId)}`);
  if (!target) {
    console.warn('Preview heading not found for outline item:', headingId);
    return;
  }
  const scroller = previewWrap;
  const targetTop = target.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - getPreviewFocusScrollOffset();
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  scroller.scrollTo({ top: Math.max(0, targetTop), behavior: reduceMotion ? 'auto' : 'smooth' });
}

function handleOutlineNavigation(offset, headingId) {
  if (previewFocusOpen) {
    navigatePreviewToHeading(headingId);
    return;
  }
  jumpToOffset(offset);
}

function jumpToOffset(offset) {
  editor.focus();
  editor.setSelectionRange(offset, offset);
  const lineIndex = editor.value.substring(0, offset).split('\n').length - 1;
  updateCurrentLineHighlight();
  requestAnimationFrame(() => {
    const lineEl = backdrop.children[lineIndex];
    if (lineEl) scrollToY(lineEl.offsetTop, 0.5);
  });
}

async function saveToHistoryList(filename, content) {
  if (!content || content.trim() === '' || content === T.defaultMd || isLegacyDefaultMarkdown(content)) return;
  let hist = JSON.parse((await secureGetItem(HISTORY_KEY)) || '[]');
  hist = [{ filename, content, date: Date.now() }, ...hist.filter(h => h.filename !== filename)].slice(0, 10);
  await secureSetItem(HISTORY_KEY, JSON.stringify(hist));
}

async function openHistory() {
  if (!guardEditorCommand()) return;
  closeMenus();
  const hist = JSON.parse((await secureGetItem(HISTORY_KEY)) || '[]');
  const container = document.getElementById('hist-list');
  container.innerHTML = '';
  if (!hist.length) {
    const empty = document.createElement('div');
    empty.style.padding = '10px';
    empty.textContent = T.historyEmpty;
    container.appendChild(empty);
  }
  hist.forEach(h => {
    const div = document.createElement('div'); div.className = 'hist-item';
    const name = document.createElement('div'); name.className = 'hist-name';
    name.textContent = h.filename || 'untitled.md';
    const date = document.createElement('div'); date.className = 'hist-date';
    date.textContent = new Date(h.date).toLocaleString();
    div.append(name, date);
    div.onclick = () => { setEditorDocumentValue(h.content); filenameInput.value = h.filename; update(); closeHistory(); };
    container.appendChild(div);
  });
  document.getElementById('history-modal').classList.add('show');
}
function closeHistory() { document.getElementById('history-modal').classList.remove('show'); }

function formatDoc() {
  if (!guardEditorCommand()) return;
  editor.value = editor.value.replace(/\n{3,}/g, '\n\n').split('\n').map(l => l.trimEnd()).join('\n');
  update(); toast(T.formatDone);
}
//#endregion

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function showLoader(msg) {
  const loader = document.getElementById('global-loader');
  const msgEl = document.getElementById('loader-msg');
  if (msgEl) msgEl.textContent = msg || 'Loading...';
  if (loader) loader.classList.add('show');
}

function hideLoader() {
  const loader = document.getElementById('global-loader');
  if (loader) loader.classList.remove('show');
}

//#region [JS-16] HELP DOC MODAL LOGIC
const GITHUB_REPOSITORY_URL = 'https://github.com/HKJPN/markdown-editor';
let docModalReturnFocus = null;

function setDocModalState(isOpen) {
  const modal = document.getElementById('doc-modal');
  if (!modal) return;
  modal.classList.toggle('show', isOpen);
  modal.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
  modal.setAttribute('data-state', isOpen ? 'open' : 'closed');
}

function fallbackDocMarkdownHtml(markdown) {
  const lines = String(markdown || '').split('\n');
  let html = '';
  let inList = false;

  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const inline = text => escapeHtml(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  lines.forEach(line => {
    const heading = line.match(/^(#{2,3})\s+(.+)$/);
    const item = line.match(/^\*\s+(.+)$/);

    if (heading) {
      closeList();
      html += `<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`;
    } else if (item) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(item[1])}</li>`;
    } else if (line.trim()) {
      closeList();
      html += `<p>${inline(line)}</p>`;
    } else {
      closeList();
    }
  });

  closeList();
  return html;
}

function renderDocMarkdown(markdown) {
  const html = safeMarkdownHtml(markdown);
  return html || fallbackDocMarkdownHtml(markdown);
}

//#region [JS-16A] UPDATE NOTIFICATION LOGIC
let updateCheckInFlight = false;
let updateCheckSessionCache = null;
let availableUpdateVersion = '';
let updateModalReturnFocus = null;

function parseVersion(value) {
  const match = String(value || '').trim().match(/^v?\.?(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$/i);
  if (!match) return null;
  return [
    Number(match[1]),
    Number(match[2]),
    Number(match[3]),
    match[4] === undefined ? 0 : Number(match[4])
  ];
}

function normalizeVersion(value) {
  const parsed = parseVersion(value);
  return parsed ? parsed.join('.') : '';
}

function compareVersions(left, right) {
  const a = parseVersion(left);
  const b = parseVersion(right);
  if (!a || !b) return NaN;
  for (let i = 0; i < 4; i += 1) {
    if (a[i] > b[i]) return 1;
    if (a[i] < b[i]) return -1;
  }
  return 0;
}

function isNewerVersion(latestVersion, currentVersion = APP_VERSION) {
  return compareVersions(latestVersion, currentVersion) > 0;
}

function readUpdateCache() {
  try {
    const raw = localStorage.getItem(UPDATE_CHECK_STORAGE_KEY);
    if (!raw) return updateCheckSessionCache;
    const cache = JSON.parse(raw);
    if (!cache || !Number.isFinite(cache.checkedAt)) return null;
    const latestVersion = normalizeVersion(cache.latestVersion);
    return { checkedAt: cache.checkedAt, latestVersion };
  } catch (e) {
    return updateCheckSessionCache;
  }
}

function writeUpdateCache(cache) {
  updateCheckSessionCache = cache;
  try {
    localStorage.setItem(UPDATE_CHECK_STORAGE_KEY, JSON.stringify(cache));
  } catch (e) {
    // localStorage may be unavailable for file:// or restricted contexts.
  }
}

function applyUpdateAvailability(latestVersion) {
  const indicator = document.getElementById('update-indicator');
  if (!indicator) return;
  const normalizedLatest = normalizeVersion(latestVersion);
  const hasUpdate = !!normalizedLatest && isNewerVersion(normalizedLatest, APP_VERSION);
  availableUpdateVersion = hasUpdate ? normalizedLatest : '';
  indicator.hidden = !hasUpdate;
}

async function fetchLatestRelease() {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), UPDATE_CHECK_TIMEOUT_MS);

  try {
    const response = await fetch(LATEST_RELEASE_API_URL, {
      method: 'GET',
      headers: {
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      },
      credentials: 'omit',
      cache: 'no-store',
      referrerPolicy: 'no-referrer',
      signal: controller.signal
    });
    if (!response.ok) return '';

    const data = await response.json();
    if (data?.draft === true || data?.prerelease === true) return '';
    return normalizeVersion(data?.tag_name);
  } catch (e) {
    return '';
  } finally {
    clearTimeout(timeoutId);
  }
}

async function checkForUpdates() {
  if (hasStandaloneData || updateCheckInFlight) return;
  updateCheckInFlight = true;

  try {
    const now = Date.now();
    const cache = readUpdateCache();
    const cachedLatestVersion = normalizeVersion(cache?.latestVersion);
    if (cachedLatestVersion) applyUpdateAvailability(cachedLatestVersion);

    if (cache && Number.isFinite(cache.checkedAt) && now - cache.checkedAt < UPDATE_CHECK_INTERVAL_MS) return;

    const attemptCache = {
      checkedAt: now,
      latestVersion: cachedLatestVersion || ''
    };
    writeUpdateCache(attemptCache);

    const latestVersion = await fetchLatestRelease();
    if (latestVersion) {
      writeUpdateCache({ checkedAt: now, latestVersion });
      applyUpdateAvailability(latestVersion);
    }
  } finally {
    updateCheckInFlight = false;
  }
}

function scheduleUpdateCheck() {
  if (hasStandaloneData) return;
  const start = () => { void checkForUpdates(); };
  if ('requestIdleCallback' in window) {
    window.requestIdleCallback(start, { timeout: 3000 });
  } else {
    setTimeout(start, 1000);
  }
}

function printHtmlInTemporaryFrame(html, options = {}) {
  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed'; iframe.style.right = '0'; iframe.style.bottom = '0';
  iframe.style.width = '0'; iframe.style.height = '0'; iframe.style.border = '0';
  iframe.style.visibility = 'hidden'; iframe.setAttribute('aria-hidden', 'true');

  let cleanedUp = false;
  let printed = false;
  const cleanup = () => {
    if (cleanedUp) return;
    cleanedUp = true;
    setTimeout(() => { try { iframe.remove(); } catch (e) {} }, 500);
  };
  const runPrintOnce = () => {
    if (printed) return;
    printed = true;
    try {
      const win = iframe.contentWindow;
      if (!win) throw new Error('Print iframe window is unavailable.');
      win.focus();
      if ('onafterprint' in win) win.onafterprint = cleanup;
      setTimeout(() => { win.print(); setTimeout(cleanup, 3000); }, options.delay || 150);
    } catch (err) {
      console.error('Print failed', err);
      cleanup();
      alert(options.errorMessage || (isJa ? '印刷に失敗しました。' : 'Failed to print.'));
    }
  };

  try {
    document.body.appendChild(iframe);
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    iframe.onload = runPrintOnce;
    doc.open(); doc.write(html); doc.close();
    setTimeout(runPrintOnce, options.fallbackDelay || 700);
  } catch (err) {
    console.error('Failed to prepare print frame', err);
    cleanup();
    alert(options.prepareErrorMessage || (isJa ? '印刷用ページの作成に失敗しました。' : 'Failed to prepare the print page.'));
  }
}

function looksLikeHtmlSource(text, filename = '') {
  const name = String(filename || '').toLowerCase();
  const value = String(text || '').trimStart();

  if (/\.(html?|xhtml)$/i.test(name)) return true;

  return (
    /^<!doctype\s+html\b/i.test(value) ||
    /^<html[\s>]/i.test(value) ||
    /<head[\s>]/i.test(value.slice(0, 2000)) ||
    /<body[\s>]/i.test(value.slice(0, 4000)) ||
    /<script[\s>]/i.test(value.slice(0, 4000)) ||
    /<style[\s>]/i.test(value.slice(0, 4000))
  );
}

      : 'This document looks like HTML source. Preview printing may interpret it as HTML and produce broken output.\n\nTo print the source code, use “Markdown Source” or “Markdown Source ☑ Include Line Numbers”.';

    alert(message);

  if (printPrepState) return;

  printPrepState = {
    wasPreviewOpen: previewOpen,
    prevWidth: previewWrap.style.width,
    wasPreviewActive: isPreviewActive,
    previewCheckOpacity: document.getElementById('preview-check')?.style.opacity || '',
    previewEntryActive: document.getElementById('m-preview-entry')?.classList.contains('active') || false,
    previewBtnActive: document.getElementById('preview-toggle-btn')?.classList.contains('active') || false,
    previewBtnPressed: document.getElementById('preview-toggle-btn')?.getAttribute('aria-pressed') || 'false'
  };

  if (!previewOpen) {
    previewOpen = true;
    previewWrap.classList.add('open');
    mainContainer.classList.add('preview-on');
  }

  renderPreview(true);
}

function cleanupPrintPreview() {
  if (!printPrepState) return;

  const {
    wasPreviewOpen,
    prevWidth,
    wasPreviewActive,
    previewCheckOpacity,
    previewEntryActive,
    previewBtnActive,
    previewBtnPressed
  } = printPrepState;

  if (!wasPreviewOpen) {
    previewOpen = false;
    previewWrap.classList.remove('open');
    mainContainer.classList.remove('preview-on');
    previewWrap.style.width = prevWidth || '';
    isPreviewActive = wasPreviewActive;

    const previewCheck = document.getElementById('preview-check');
    const previewEntry = document.getElementById('m-preview-entry');
    const previewBtn = document.getElementById('preview-toggle-btn');

    if (previewCheck) previewCheck.style.opacity = previewCheckOpacity;
    if (previewEntry) previewEntry.classList.toggle('active', previewEntryActive);
    if (previewBtn) {
      previewBtn.classList.toggle('active', previewBtnActive);
      previewBtn.setAttribute('aria-pressed', previewBtnPressed);
    }
  }

  printPrepState = null;
}

window.addEventListener('beforeprint', preparePrintPreview);
window.addEventListener('afterprint', cleanupPrintPreview);

function exportPdf() {
  printPreviewDocument();
}

function printPreviewFromModal() {
  printPreviewDocument();
}

function printMarkdownSource(options = {}) {
  if (!guardEditorCommand()) return;
  closeMenus();

  const withLineNumbers = !!options.lineNumbers;
  const html = buildPrintableMarkdownSourceHtml(editor.value, withLineNumbers);
  printHtmlInTemporaryFrame(html, {
    delay: 100,
    fallbackDelay: 700,
    errorMessage: isJa ? 'Markdownソースの印刷に失敗しました。' : 'Failed to print Markdown source.'
  });
}
