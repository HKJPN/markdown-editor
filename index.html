<link rel="icon" type="image/png" href="images/icon2.png">

<script>
  (function() {
    try {
      const saved = localStorage.getItem('mdworks_theme_mode');
      if (saved && (saved === 'paper' || saved === 'warm')) {
        document.documentElement.classList.add('theme-' + saved);
      }
    } catch(e) {}
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/marked@18.0.6/lib/marked.umd.min.js" crossorigin="anonymous"></script>

<style>
/* ==========================================================================
   CSS INDEX
   [CSS-01] VARIABLES & BASE SETTINGS
   [CSS-02] UI: MENUBAR
   [CSS-03] UI: TITLEBAR
   [CSS-04] UI: TOOLBAR
   [CSS-05] EDITOR & BACKDROP ENGINE
   [CSS-06] PREVIEW AREA
   [CSS-07] SEARCH & REPLACE PANEL
   [CSS-08] STATUS BAR, TOAST & LOADER
   [CSS-09] SPELL CHECK PANEL
   [CSS-10] OUTLINE & HISTORY PANELS
   [CSS-11] RELEASE NOTES MODAL (NEW)
   [CSS-12] THEME VARIANTS (PAPER / WARM)
   [CSS-13] RESPONSIVE & PRINT STYLES
   ========================================================================== */

/* #region [CSS-01] VARIABLES & BASE SETTINGS */
:root {
  --bg:#090b11;
  --surface:#0f131c;
  --surface2:#141a26;
  --surface3:#1b2331;
  --border:#293246;
  --border2:#3a4760;
  --accent:#8f82ff;
  --accent2:#d2cbff;
  --accent-dim:rgba(143,130,255,.14);
  --text:#eef2ff;
  --text2:#aab5d1;
  --text3:#6b7897;
  --success:#5ad7a0;
  --warn:#ebb05b;
  --danger:#f17786;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --serif:'Noto Serif JP',serif;
  --sans:'Zen Kaku Gothic New',sans-serif;
  --shadow-lg:0 24px 64px rgba(0,0,0,.50);
  --shadow-md:0 14px 36px rgba(0,0,0,.34);
  --glow:0 0 0 1px rgba(210,203,255,.055) inset;
  --editor-padding-top:30px;
  --editor-padding-right:34px;
  --editor-padding-bottom:30px;
  --editor-padding-left:34px;
  --line-number-gutter-width:4.8em;
  --current-line-bg:rgba(143,130,255,.055);
  --editor-font-size:14.5px;
  --editor-line-height:26px;
}


*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--sans);
  color:var(--text);
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(circle at 0% 0%, rgba(143,130,255,.14), transparent 26%),
    radial-gradient(circle at 100% 0%, rgba(90,215,160,.06), transparent 18%),
    linear-gradient(180deg, #0b0e15 0%, #090b11 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(180deg, rgba(255,255,255,.018), transparent 14%, transparent 86%, rgba(255,255,255,.012)),
    radial-gradient(circle at center top, rgba(255,255,255,.03), transparent 46%);
  mix-blend-mode:screen;
}
button,input,textarea{font:inherit}
/* #endregion */

/* #region [CSS-02] UI: MENUBAR */
#menubar{
  height:28px;
  background:rgba(12,15,23,.82);
  border-bottom:1px solid rgba(255,255,255,.045);
  display:flex;
  align-items:stretch;
  padding:0 6px;
  flex-shrink:0;
  position:relative;
  z-index:100;
  box-shadow:var(--glow);
  backdrop-filter:blur(16px);
}
.menu-item{position:relative;display:flex;align-items:center}
.menu-trigger{
  border:none;background:transparent;color:var(--text2);
  font-family:var(--sans);font-size:12px;font-weight:500;
  padding:0 10px;cursor:pointer;border-radius:8px;
  transition:all .12s;height:100%;
}
.menu-trigger:hover,.menu-trigger.open{
  background:rgba(255,255,255,.055);
  color:var(--text);
}
.menu-dropdown{
  display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:260px;
  background:linear-gradient(180deg, rgba(26,32,45,.96), rgba(15,19,28,.97));
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px;padding:6px;
  box-shadow:var(--shadow-lg), var(--glow);
  z-index:200;
  max-height:calc(100vh - 72px);
  overflow-y:auto;
  overscroll-behavior:contain;
}
.menu-dropdown.open{display:block}
.menu-entry{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;border-radius:10px;font-size:13px;color:var(--text2);
  cursor:pointer;transition:all .1s;gap:16px;user-select:none;
}
.menu-entry:hover{
  background:linear-gradient(90deg, rgba(143,130,255,.13), rgba(143,130,255,.04));
  color:var(--text);
}
.menu-entry.active{
  background:linear-gradient(90deg, rgba(143,130,255,.16), rgba(143,130,255,.05));
  color:var(--accent2)
}
.menu-entry.active .menu-check{opacity:1}
.menu-check{opacity:0;color:var(--accent2);font-size:11px;transition:opacity .1s}
.menu-shortcut{font-family:var(--mono);font-size:11px;color:var(--text3)}
#update-indicator{
  margin-left:4px;min-width:34px;height:100%;padding:0 8px;border:0;border-radius:8px;
  background:transparent;color:var(--text2);cursor:pointer;font-size:15px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
#update-indicator[hidden]{display:none!important}
#update-indicator:hover,#update-indicator:focus-visible{background:rgba(255,255,255,.055);color:var(--text);outline:none}

.menu-label-with-icon {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.menu-icon {
  width: 1.2em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  font-size: 13px;
  line-height: 1;
}
.menu-entry:hover .menu-icon,
.menu-entry.active .menu-icon {
  color: var(--accent2);
}
.menu-sep-line{height:1px;background:var(--border);margin:5px 0}
.menu-section-label{
  padding:7px 10px 4px;
  font-family:var(--mono);font-size:10px;font-weight:700;
  color:var(--text3);letter-spacing:.08em;text-transform:uppercase;
  user-select:none;opacity:.9;
}
/* #endregion */

/* #region [CSS-03] UI: TITLEBAR */
#titlebar{
  height:56px;background:rgba(15,19,28,.76);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;gap:12px;flex-shrink:0;box-shadow:var(--glow);
}
.title-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#app-name{
  font-size:12px;font-weight:700;color:rgba(210,203,255,.94);
  letter-spacing:.18em;text-transform:uppercase;font-family:var(--mono);
  flex-shrink:0;opacity:.95;
}
#filename-display{
  font-size:13px;color:var(--text2);font-family:var(--mono);
  padding:9px 12px;
  background:linear-gradient(180deg, rgba(255,255,255,.042), rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.085);
  border-radius:14px;
  min-width:220px;max-width:540px;width:100%;
  cursor:text;outline:none;
  transition:border-color .18s,color .18s,box-shadow .18s,transform .12s;
  box-shadow:var(--glow);
}
#filename-display:focus{
  border-color:rgba(143,130,255,.5);color:var(--text);
  box-shadow:0 0 0 4px rgba(143,130,255,.11), var(--glow);
}
body #filename-display.locked{
  cursor:default;
  color:var(--text3);
}
body #filename-display.locked:focus{
  border-color:rgba(255,255,255,.085);
  box-shadow:var(--glow);
}
.title-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.title-btn{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid rgba(255,255,255,.09);
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.018));
  color:var(--text2);font-size:12px;font-weight:600;
  padding:8px 11px;border-radius:12px;cursor:pointer;transition:all .16s;
  white-space:nowrap;box-shadow:var(--glow);
}
.title-btn:hover{
  background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
  color:var(--text);transform:translateY(-1px);box-shadow:var(--shadow-md), var(--glow);
}
.title-btn.primary{
  background:linear-gradient(180deg, rgba(143,130,255,.26), rgba(143,130,255,.11));
  border-color:rgba(143,130,255,.38);color:var(--accent2);
  box-shadow:0 8px 22px rgba(143,130,255,.16), var(--glow);
}
.title-btn.active{
  background:linear-gradient(180deg, rgba(143,130,255,.24), rgba(143,130,255,.10));
  border-color:rgba(143,130,255,.58);
  color:var(--accent2);
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,.30),
    0 0 0 1px rgba(210,203,255,.10) inset,
    0 0 14px rgba(143,130,255,.12);
  transform:translateY(1px);
}
.title-btn.active::after{
  content:"";
  position:absolute;
  right:7px;
  bottom:5px;
  width:5px;
  height:5px;
  border-radius:999px;
  background:var(--accent2);
  box-shadow:0 0 8px rgba(210,203,255,.7);
}
.title-btn.primary.active{
  background:linear-gradient(180deg, rgba(90,215,160,.24), rgba(90,215,160,.09));
  border-color:rgba(90,215,160,.50);
  color:var(--success);
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,.30),
    0 0 0 1px rgba(90,215,160,.10) inset,
    0 0 14px rgba(90,215,160,.12);
  transform:translateY(1px);
}
.title-btn.primary.active::after{
  background:var(--success);
  box-shadow:0 0 8px rgba(90,215,160,.65);
}

.title-btn.icon-only{
  min-width:38px;
  padding-left:10px;
  padding-right:10px;
  font-size:15px;
  line-height:1;
}
.save-state{
  font-family:var(--mono);font-size:11px;color:var(--success);
  padding:4px 9px;border:1px solid rgba(90,215,160,.25);border-radius:999px;
  white-space:nowrap;flex-shrink:0;
  background:linear-gradient(180deg, rgba(90,215,160,.10), rgba(90,215,160,.03));
  box-shadow:var(--glow);
}
#file-input{display:none}
/* #endregion */

/* #region [CSS-04] UI: TOOLBAR */
#toolbar{
  height:46px;background:rgba(14,18,27,.78);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.045);
  display:flex;align-items:center;padding:0 10px;gap:8px;
  flex-shrink:0;overflow-x:auto;box-shadow:var(--glow);
}
#toolbar::-webkit-scrollbar{height:8px}
#toolbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:999px}
.tool-group{
  display:flex;align-items:center;gap:2px;padding:4px;
  background:linear-gradient(180deg, rgba(255,255,255,.032), rgba(255,255,255,.012));
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;flex-shrink:0;box-shadow:var(--glow);
}
.tool-btn{
  border:none;background:transparent;color:var(--text2);
  font-family:var(--mono);font-size:12px;font-weight:500;
  padding:6px 9px;border-radius:10px;cursor:pointer;transition:all .12s;
  white-space:nowrap;flex-shrink:0;
}
.tool-btn:hover{
  background:linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.022));
  color:var(--text);
}
.tool-btn:active{transform:scale(.97)}
.tool-btn.heading{color:var(--accent2);font-weight:700;text-shadow:0 0 18px rgba(143,130,255,.16)}
.script-btn sup,.script-btn sub{font-size:.72em;line-height:0;position:relative;vertical-align:baseline}
.script-btn sup{bottom:.45em}
.script-btn sub{top:.25em}
/* #endregion */

/* #region [CSS-05] EDITOR & BACKDROP ENGINE */
#main-container{position:relative;display:flex;flex:1;overflow:hidden}

#editor-wrap{
  flex:1;min-width:260px;position:relative;display:flex;
  background:
    linear-gradient(180deg, rgba(255,255,255,.012), transparent 18%),
    linear-gradient(180deg, rgba(12,15,22,.82), rgba(10,13,19,.76));
}
#editor, #editor-backdrop{
  font-family:var(--mono);font-size:var(--editor-font-size);line-height:var(--editor-line-height);
  padding:var(--editor-padding-top) var(--editor-padding-right) var(--editor-padding-bottom) var(--editor-padding-left);tab-size:2;white-space:pre-wrap;word-wrap:break-word;
  overflow-wrap:break-word;width:100%;height:100%;border:none;outline:none;margin:0;
  -webkit-text-size-adjust: 100%;
}
body.editor-no-wrap #editor,
body.editor-no-wrap #editor-backdrop{
  white-space:pre;
  word-wrap:normal;
  overflow-wrap:normal;
}
body.editor-no-wrap #editor{
  overflow-x:auto;
  touch-action:pan-x pan-y;
}
body.editor-no-wrap #editor-backdrop{
  overflow-x:hidden;
}
body.editor-no-wrap #editor-backdrop .editor-line{
  width:max-content;
  min-width:100%;
}
#editor{
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
}
#editor-backdrop{
  position:absolute;inset:0;color:transparent;pointer-events:none;z-index:1;
  overflow-y:auto;background:transparent;
}

#editor-backdrop .editor-line{
  position:relative;
  display:block;
  min-height:var(--editor-line-height);
  margin: 0 -0.18em;
  padding: 0 0.18em;
  border-radius:8px;
}
#editor-backdrop .editor-line.blank{ min-height:var(--editor-line-height); }

/* Current-line and logical line-number overlays stay in the Backdrop only. */
body.show-line-numbers #editor,
body.show-line-numbers #editor-backdrop{
  padding-left:calc(var(--editor-padding-left) + var(--line-number-gutter-width));
}
#editor-backdrop .editor-line.current-line{
  background:linear-gradient(90deg, var(--current-line-bg), transparent 92%);
}
#editor-backdrop .editor-line.task-open-line.current-line{
  background:
    linear-gradient(90deg, var(--current-line-bg), transparent 92%),
    linear-gradient(90deg, rgba(235,176,91,.16), rgba(235,176,91,.045) 48%, transparent 84%);
}
#editor-backdrop .editor-line.task-done-line.current-line{
  background:
    linear-gradient(90deg, var(--current-line-bg), transparent 92%),
    linear-gradient(90deg, rgba(90,215,160,.13), rgba(90,215,160,.04) 48%, transparent 84%);
}
#editor-backdrop .line-number{
  position:absolute;
  left:calc(-1 * var(--line-number-gutter-width));
  top:0;
  width:var(--line-number-gutter-width);
  padding-right:1em;
  text-align:right;
  color:var(--text3);
  opacity:.55;
  user-select:none;
  pointer-events:none;
  font-family:var(--mono);
  font-size:inherit;
  line-height:inherit;
}

#editor-backdrop .task-open-line{
  background:linear-gradient(90deg, rgba(235,176,91,.16), rgba(235,176,91,.045) 48%, transparent 84%);
  box-shadow:inset 0 0 0 1px rgba(235,176,91,.06);
}
#editor-backdrop .task-done-line{
  background:linear-gradient(90deg, rgba(90,215,160,.13), rgba(90,215,160,.04) 48%, transparent 84%);
  box-shadow:inset 0 0 0 1px rgba(90,215,160,.055);
}

#editor-backdrop mark{
  background:rgba(143,130,255,.30);
  color:transparent;
  border-radius:4px;
  box-shadow:0 0 0 1px rgba(143,130,255,.08);
}
#editor-backdrop mark.active{
  background:rgba(235,176,91,.56);
  box-shadow:0 0 0 1px rgba(235,176,91,.22);
}
#editor-backdrop mark.spell-error {
  background: rgba(241, 119, 134, 0.15);
  border-bottom: 2px dashed rgba(241, 119, 134, 0.8);
  border-radius: 2px;
  box-shadow: none;
}

#editor-backdrop .invis{
  position:relative;
  color:transparent;
}
#editor-backdrop .invis::after{
  pointer-events:none;
  user-select:none;
  color:var(--text3);
  opacity:.55;
  position:absolute;
  left:0;
  top:0;
}
#editor-backdrop .invis-zenkaku::after{content:'□'}
#editor-backdrop .invis-tab{
  background:rgba(107,120,151,.10);
  border-radius:3px;
}
#editor-backdrop .invis-tab::after{
  content:'→';
  left:.12em;
  opacity:.75;
}
#editor-backdrop .invis-eol-space::after{content:'·'}
#editor-backdrop .invis-nl{
  display:inline-block;
  width:0;
  height:1em;
  line-height:1;
  position:relative;
  vertical-align:baseline;
  overflow:visible;
}
#editor-backdrop .invis-nl::after{
  content:'↵';
  pointer-events:none;
  user-select:none;
  color:var(--text3);
  opacity:.55;
  position:absolute;
  left:.15em;
  top:0;
  line-height:1;
}

#editor{
  position:absolute;inset:0;z-index:2;resize:none;background:transparent;
  color:#f2f5ff;caret-color:var(--accent2);
}
#editor::placeholder{color:#7482a1}
#editor::selection{background:rgba(124,106,247,.35)}

#splitter{width:10px;background:transparent;cursor:col-resize;display:none;position:relative;flex-shrink:0; touch-action:none;}
#splitter::after{
  content:"";position:absolute;top:50%;left:50%;width:4px;height:62px;
  transform:translate(-50%,-50%);border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.22), rgba(255,255,255,.06));
  box-shadow:0 0 0 1px rgba(255,255,255,.05);
}
#splitter:hover::after{background:var(--accent2)}
#main-container.preview-on #splitter{display:block}
/* #endregion */

/* #region [CSS-06] PREVIEW AREA */
#preview-wrap{
  width:0;min-width:0;overflow:hidden;
  background:linear-gradient(180deg, rgba(16,20,30,.88), rgba(10,13,19,.95));
  transition:width .25s cubic-bezier(.4,0,.2,1);
  border-left:1px solid rgba(255,255,255,.055);
  box-shadow:inset 1px 0 0 rgba(255,255,255,.03);
}
#preview-wrap.open{ width:42%;min-width:320px;border-left-width:0;overflow-y:auto }
#preview{ font-family:var(--serif);font-size:15px;line-height:1.95;color:#eef1fc; padding:42px 50px;max-width:760px }
#preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6{ font-family:var(--sans);font-weight:700;margin:1.6em 0 .5em;line-height:1.3;color:var(--text) }
#preview h1{ font-size:29px;padding-bottom:.35em;border-bottom:1px solid rgba(255,255,255,.13);letter-spacing:.01em }
#preview h2{ font-size:21px;padding-bottom:.25em;border-bottom:1px solid rgba(255,255,255,.09) }
#preview h3{ font-size:17px;color:var(--accent2) }
#preview h4{ font-size:15px }
#preview p{ margin:.7em 0 }
#preview ul,#preview ol{ margin:.7em 0;padding-left:1.6em }
#preview li{ margin:.25em 0 }
#preview a{ color:var(--accent2);text-decoration:none }
#preview a:hover{ text-decoration:underline }
#preview strong{ font-weight:700;color:var(--text) }
#preview em{ font-style:italic;color:var(--text2) }
#preview code{ font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:1px 6px;color:var(--accent2) }
#preview pre{ background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.018)); border:1px solid rgba(255,255,255,.085);border-radius:14px; padding:16px 20px;overflow-x:auto;margin:1em 0;box-shadow:var(--glow) }
#preview pre code{ background:none;border:none;padding:0;color:var(--text);font-size:13.5px }
#preview blockquote{ border-left:3px solid rgba(143,130,255,.9);margin:1.1em 0;padding:8px 16px; color:var(--text2); background:linear-gradient(90deg, rgba(143,130,255,.13), rgba(143,130,255,.035)); border-radius:0 12px 12px 0 }
#preview hr{ border:none;border-top:1px solid var(--border2);margin:1.5em 0 }
#preview table{ border-collapse:separate;border-spacing:0;width:100%;margin:1em 0; font-family:var(--sans);font-size:14px;overflow:hidden;border-radius:14px; border:1px solid rgba(255,255,255,.08) }
#preview th,#preview td{ border-bottom:1px solid rgba(255,255,255,.06);padding:10px 12px }
#preview th{ background:rgba(255,255,255,.045);font-weight:500;color:var(--accent2) }
#preview tr:nth-child(even) td{ background:rgba(255,255,255,.02) }

#preview sub {

  vertical-align:baseline;
}

#preview sub { top:.25em }

#preview .mdw-footnote-ref{font-size:78%;line-height:0;white-space:nowrap}
#preview .mdw-footnote-ref-link{text-decoration:none}
#preview .mdw-footnotes-separator{margin:2.2em 0 1em;border:none;border-top:1px solid var(--border2)}

#preview .mdw-footnote-item{margin:.35em 0;padding-left:.15em}

#preview li.task-open-item, #preview li.task-done-item{ list-style:none; display:flex; align-items:flex-start; gap:.72em; margin:.28em 0; padding:.42em .58em .42em .48em; border-radius:10px; transition:background-color .16s ease, opacity .16s ease, color .16s ease; }

#preview li.task-open-item input[type="checkbox"], #preview li.task-done-item input[type="checkbox"]{ flex:0 0 auto; margin:.18em 0 0; width:15px; height:15px; accent-color:var(--accent2); opacity:.95; transform:scale(.96); }
#preview li.task-open-item{ color:var(--text); opacity:.98; }
#preview li.task-open-item:hover{ background:linear-gradient(90deg, rgba(143,130,255,.08), rgba(143,130,255,.02)); }
#preview li.task-done-item{ color:var(--text2); opacity:.72; text-decoration:line-through; text-decoration-color:rgba(255,255,255,.14); text-decoration-thickness:1px; text-underline-offset:.14em; }
#preview li.task-done-item:hover{ background:rgba(255,255,255,.022); opacity:.82; }

#preview li.task-done-item a{ color:var(--text2) }
#preview li.task-done-item a:hover{ color:var(--accent2) }
/* #endregion */

/* #region [CSS-07] SEARCH & REPLACE PANEL */
#sr-panel{
  position:absolute;top:12px;right:18px;width:392px;
  background:linear-gradient(180deg, rgba(29,35,49,.95), rgba(17,21,31,.96));
  border:1px solid rgba(255,255,255,.085); border-radius:18px;
  box-shadow:var(--shadow-lg), var(--glow);

  overflow:hidden;backdrop-filter:blur(16px)
}

#sr-tabs{display:flex;background:rgba(255,255,255,.015);border-bottom:1px solid var(--border)}
.sr-tab{flex:1;background:none;border:none;color:var(--text3);padding:9px 0;font-size:12px;font-weight:700;cursor:pointer;transition:color .1s}
.sr-tab:hover{color:var(--text)}
.sr-tab.active{color:var(--accent2);border-bottom:2px solid var(--accent2)}
#sr-close{background:none;border:none;color:var(--text3);padding:0 12px;cursor:pointer;font-size:14px;transition:color .1s}
#sr-close:hover{color:var(--text)}
#sr-body{padding:12px}
.sr-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sr-input-wrapper{flex:1;position:relative;display:flex;align-items:center}
.sr-input{
  width:100%;height:36px;background:rgba(255,255,255,.026);
  border:1px solid rgba(255,255,255,.08);color:var(--text);
  font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:10px;outline:none
}
.sr-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(143,130,255,.1)}
.sr-count{font-size:11px;color:var(--text3);font-family:var(--mono);position:absolute;right:10px;pointer-events:none}
.sr-nav-btn,.sr-action-btn{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.085); color:var(--text2);border-radius:10px;cursor:pointer; transition:all .1s
}
.sr-nav-btn{height:36px;padding:4px 10px;font-size:12px}
.sr-action-btn{height:36px;padding:6px 12px;font-size:12px;font-weight:500;flex:1}
.sr-nav-btn:hover,.sr-action-btn:hover{ background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.03)); color:var(--text) }
.sr-options{display:flex;gap:12px;font-size:11px;color:var(--text2);margin-bottom:8px;user-select:none;flex-wrap:wrap}
.sr-options label{display:flex;align-items:center;gap:4px;cursor:pointer}
.sr-options input[type="checkbox"]{accent-color:var(--accent)}
.sr-error-msg{color:var(--danger);font-size:11px;margin-bottom:8px;display:none}
#sr-replace-area{display:none}
/* #endregion */

/* #region [CSS-08] STATUS BAR, TOAST & LOADER */
#statusbar{
  height:26px;background:rgba(12,15,23,.74);
  border-top:1px solid rgba(255,255,255,.045);
  display:flex;align-items:center;padding:0 12px;gap:14px;flex-shrink:0;box-shadow:var(--glow)
}
.stat-item{font-family:var(--mono);font-size:10.5px;color:var(--text3);display:flex;align-items:center;gap:5px}
.stat-label{color:var(--text3)}
.stat-val{color:var(--text2);font-weight:500}
.stat-item.accent .stat-val{color:var(--accent2)}
#spell-status{font-family:var(--mono);font-size:10.5px;color:var(--text3);margin-left:auto;margin-right:10px}
#spell-status.on{color:var(--warn)}
#storage-badge {font-family:var(--mono);font-size:10px;font-weight:600;color:var(--accent2);padding:2px 6px;border-radius:4px;background:var(--surface3);}

#toast{
  position:fixed;bottom:38px;left:50%; transform:translateX(-50%) translateY(20px);
  background:linear-gradient(180deg, rgba(29,34,48,.97), rgba(18,23,33,.98));
  border:1px solid rgba(255,255,255,.08);color:var(--text);
  font-family:var(--sans);font-size:13px;padding:9px 18px;border-radius:14px;
  opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;z-index:999;
  box-shadow:var(--shadow-lg), var(--glow)
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#global-loader{
  display:none;position:fixed;inset:0;background:rgba(10,11,16,.76);
  backdrop-filter:blur(6px);z-index:9999;align-items:center;justify-content:center;flex-direction:column
}
#global-loader.show{display:flex}
.loader-spinner{
  width:48px;height:48px;border:3px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px
}
.loader-text{font-family:var(--mono);font-size:13px;color:var(--text2);letter-spacing:.05em}
/* #endregion */

/* #region [CSS-09] SPELL CHECK PANEL */
#spell-panel{
  position:fixed;bottom:36px;right:20px;width:332px;
  background:linear-gradient(180deg, rgba(29,35,49,.95), rgba(17,21,31,.96));
  border:1px solid rgba(255,255,255,.085); border-radius:18px;padding:0;z-index:300;display:none;
  box-shadow:var(--shadow-lg), var(--glow);overflow:hidden;backdrop-filter:blur(16px)
}
#spell-panel.show{display:block}
#sph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 9px;border-bottom:1px solid var(--border)}
#sph h3{font-size:11px;color:var(--text3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
#spell-close{border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;border-radius:3px;transition:color .1s}
#spell-close:hover{color:var(--text)}
#spell-loading{padding:14px 12px;font-family:var(--mono);font-size:12px;color:var(--text3);display:none;align-items:center;gap:8px}

.spin-icon{width:12px;height:12px;border:1.5px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
#spell-list{max-height:260px;overflow-y:auto;padding:4px}

#spell-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:999px}
#spell-empty{font-size:13px;color:var(--success);padding:12px;display:none}
.spell-word{padding:6px 8px;border-radius:8px;margin-bottom:2px}
.spell-word:hover{background:rgba(255,255,255,.03)}
.spell-word-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
.spell-word-text{font-family:var(--mono);font-size:13px;color:var(--danger);flex:1}
.spell-actions{display:flex;gap:4px;flex-shrink:0}
.spell-btn{ font-size:10px;color:var(--text3);padding:2px 7px;border:1px solid var(--border); border-radius:8px;cursor:pointer;background:transparent;font-family:var(--sans);transition:all .1s;white-space:nowrap }
.spell-btn:hover{color:var(--text2);border-color:var(--border2);background:var(--surface3)}

.spell-btn.add:hover{background:var(--accent-dim)}
.spell-suggestions{display:flex;flex-wrap:wrap;gap:4px}
.spell-sug{ font-size:11px;font-family:var(--mono);color:var(--text2);padding:2px 7px; background:var(--surface3);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .1s }
.spell-sug:hover{color:var(--accent2);border-color:rgba(124,106,247,.4);background:var(--accent-dim)}
#spell-footer{font-family:var(--mono);font-size:11px;color:var(--text3);padding:7px 12px;border-top:1px solid var(--border);display:none}
#spell-footer span{color:var(--danger);font-weight:500}
/* #endregion */

/* #region [CSS-10] OUTLINE & HISTORY PANELS */
#outline-panel {
  position:fixed; top:90px; right:20px; width:280px; 
  background:linear-gradient(180deg, rgba(29,35,49,.95), rgba(17,21,31,.96));

}

#outline-panel .op-head h3 { font-size:11px; color:var(--text3); font-weight:500; letter-spacing:.06em; text-transform:uppercase; font-family:var(--mono); }

#outline-list::-webkit-scrollbar{width:8px}

.ol-item { padding:6px 10px; font-size:13px; color:var(--text2); cursor:pointer; border-radius:8px; transition:all 0.1s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; font-family:var(--sans); }

.ol-h4, .ol-h5, .ol-h6 { padding-left:38px; font-size:11.5px; opacity:0.8; }
.preview-focus-command-disabled,
button.preview-focus-command-disabled:disabled {
  opacity:.42;

  filter:saturate(.65);
}
.menu-entry.preview-focus-command-disabled,
.menu-entry.preview-focus-command-disabled:hover,
.title-btn.preview-focus-command-disabled,
.tool-btn.preview-focus-command-disabled {

}
.menu-entry.preview-focus-command-disabled .menu-shortcut,
.menu-entry.preview-focus-command-disabled .menu-check { opacity:.55; }
body.preview-focus-mode #preview h1,
body.preview-focus-mode #preview h2,

body.preview-focus-mode #preview h6 {

}

#history-modal {
  position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px);
}

.hist-content {

}

.hist-item {

}
.hist-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,.08); }

/* #region [CSS-11] RELEASE NOTES MODAL (NEW) */
#rn-modal,
#doc-modal,
#update-modal,
#export-modal,
#print-modal {
  position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px);
}
#rn-modal.show,
#doc-modal.show,
#update-modal.show,
#export-modal.show,
#print-modal.show { display:flex; }
.rn-content,
.doc-content {
  background:linear-gradient(180deg, rgba(29,35,49,.98), rgba(17,21,31,.98));
  border: 1px solid rgba(255,255,255,.085); border-radius: 18px; width: 600px; max-width:90%; max-height: 85vh; display:flex; flex-direction:column; box-shadow: var(--shadow-lg), var(--glow); overflow:hidden;
}

  background:var(--surface);
  border: 1px solid var(--border); border-radius: 18px; width: 600px; max-width:90%; max-height: 85vh; display:flex; flex-direction:column; box-shadow: var(--shadow-lg), var(--glow); overflow:hidden;
}
.rn-head,
.doc-head { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); background:rgba(0,0,0,0.2); }

.rn-head h3,

.rn-body,

.doc-body ul { padding-left:20px; margin-bottom:12px; }

.rn-btn,

.rn-btn:hover,
.doc-btn:hover,

.update-body{padding:20px;overflow-y:auto;font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--text2)}

.print-content,
.export-content {

.export-close-btn:hover,

}

}

}

/* #region [CSS-12] THEME VARIANTS (PAPER / WARM)
   Midnight remains the default :root theme. Paper and Warm only override
   visual variables and presentation styles; editing/saving logic is untouched.
   ========================================================================== */

/* Paper Theme: clean, light, document-first. Intended as a future Lite default. */
body.theme-paper {
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface2:#f1f4f9;
  --surface3:#e8edf5;
  --border:#d8dee9;
  --border2:#c6cfdd;
  --accent:#6d5dfc;
  --accent2:#5146d8;
  --accent-dim:rgba(109,93,252,.10);
  --text:#1f2937;
  --text2:#4b5563;
  --text3:#8a94a6;
  --success:#15803d;
  --warn:#b7791f;
  --danger:#dc2626;
  --shadow-lg:0 18px 44px rgba(30,41,59,.14);
  --shadow-md:0 10px 24px rgba(30,41,59,.10);
  --glow:0 0 0 1px rgba(15,23,42,.035) inset;
  --current-line-bg:rgba(109,93,252,.055);
  background:
    radial-gradient(circle at 0% 0%, rgba(109,93,252,.06), transparent 26%),
    linear-gradient(180deg, #fbfcff 0%, #f5f7fb 100%);
}

/* Sepia / Warm Theme: softer long-form writing mode. */
body.theme-warm {
  --bg:#f3eadb;
  --surface:#fff8ec;
  --surface2:#f7eddc;
  --surface3:#eadcc8;
  --border:#dccab2;
  --border2:#cbb390;
  --accent:#b7791f;
  --accent2:#8a5a16;
  --accent-dim:rgba(183,121,31,.12);
  --text:#2f2418;
  --text2:#5f4b36;
  --text3:#9a856b;
  --success:#4f7d3a;
  --warn:#a16207;
  --current-line-bg:rgba(183,121,31,.055);
  --danger:#b45309;
  --shadow-lg:0 18px 44px rgba(92,64,38,.16);
  --shadow-md:0 10px 24px rgba(92,64,38,.11);
  --glow:0 0 0 1px rgba(92,64,38,.035) inset;
  --editor-font-size:15.5px;
  --editor-line-height:30px;
  background:
    radial-gradient(circle at 0% 0%, rgba(183,121,31,.08), transparent 28%),
    linear-gradient(180deg, #fff8ec 0%, #f3eadb 100%);
}

body.theme-paper::before,
body.theme-warm::before{
  mix-blend-mode:normal;
  background:
    linear-gradient(180deg, rgba(255,255,255,.25), transparent 20%, transparent 84%, rgba(255,255,255,.16)),
    radial-gradient(circle at center top, rgba(255,255,255,.28), transparent 50%);
}
body.theme-warm::before{
  background:
    linear-gradient(180deg, rgba(255,248,236,.36), transparent 20%, transparent 84%, rgba(92,64,38,.05)),
    radial-gradient(circle at center top, rgba(255,248,236,.36), transparent 50%);
}

/* Shared light-theme surfaces */
body.theme-paper #menubar,
body.theme-paper #titlebar,
body.theme-paper #toolbar,
body.theme-paper #statusbar,
body.theme-warm #menubar,
body.theme-warm #titlebar,
body.theme-warm #toolbar,
body.theme-warm #statusbar{
  background:rgba(255,255,255,.78);
  border-color:var(--border);
  box-shadow:var(--glow);
  backdrop-filter:blur(16px);
}
body.theme-warm #menubar,
body.theme-warm #titlebar,
body.theme-warm #toolbar,
body.theme-warm #statusbar{
  background:rgba(255,248,236,.78);
}

body.theme-paper .menu-dropdown,
body.theme-paper #sr-panel,
body.theme-paper #spell-panel,
body.theme-paper #outline-panel,
body.theme-paper .hist-content,
body.theme-paper .rn-content,
body.theme-paper .doc-content,
body.theme-paper .export-content,
body.theme-paper .print-content,
body.theme-warm .menu-dropdown,
body.theme-warm #sr-panel,
body.theme-warm #spell-panel,
body.theme-warm #outline-panel,
body.theme-warm .hist-content,
body.theme-warm .rn-content,
body.theme-warm .doc-content,
body.theme-warm .export-content,
body.theme-warm .print-content{
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(245,247,251,.97));
  border-color:var(--border);
  box-shadow:var(--shadow-lg), var(--glow);
}
body.theme-warm .menu-dropdown,
body.theme-warm #sr-panel,
body.theme-warm #spell-panel,
body.theme-warm #outline-panel,
body.theme-warm .hist-content,
body.theme-warm .rn-content,
body.theme-warm .doc-content,
body.theme-warm .export-content,
body.theme-warm .print-content{
  background:linear-gradient(180deg, rgba(255,248,236,.98), rgba(247,237,220,.97));
}

body.theme-paper .print-option,
body.theme-paper .export-option,
body.theme-warm .print-option,
body.theme-warm .export-option{
  background:linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.44));
  border-color:var(--border);
  color:var(--text);
  box-shadow:var(--glow);
}
body.theme-warm .print-option,
body.theme-warm .export-option{

}
body.theme-paper .print-option:hover,
body.theme-paper .export-option:hover,
body.theme-warm .print-option:hover,
body.theme-warm .export-option:hover{
  background:var(--accent-dim);
  border-color:var(--accent2);
  color:var(--text);
}
body.theme-paper .print-head,
body.theme-paper .print-foot,
body.theme-paper .export-head,
body.theme-paper .export-foot{
  background:rgba(15,23,42,.035);
}
body.theme-warm .print-head,
body.theme-warm .print-foot,
body.theme-warm .export-head,
body.theme-warm .export-foot{
  background:rgba(92,64,38,.045);
}
body.theme-paper .print-close-btn,
body.theme-paper .print-foot-btn,
body.theme-paper .export-close-btn,
body.theme-paper .export-foot-btn,
body.theme-warm .print-close-btn,
body.theme-warm .print-foot-btn,
body.theme-warm .export-close-btn,
body.theme-warm .export-foot-btn{
  background:var(--surface3);
  color:var(--text);
  border-color:var(--border);
}
body.theme-paper .print-close-btn:hover,
body.theme-paper .print-foot-btn:hover,
body.theme-paper .export-close-btn:hover,
body.theme-paper .export-foot-btn:hover,
body.theme-warm .print-close-btn:hover,
body.theme-warm .print-foot-btn:hover,
body.theme-warm .export-close-btn:hover,
body.theme-warm .export-foot-btn:hover{

  color:var(--accent2);
  border-color:var(--accent2);
}
body.theme-paper #print-modal,
body.theme-warm #print-modal{
  background:rgba(0,0,0,.38);
}

body.theme-paper #editor-wrap,
body.theme-warm #editor-wrap{
  background:linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,255,255,.58));
}
body.theme-warm #editor-wrap{
  background:linear-gradient(180deg, rgba(255,248,236,.82), rgba(247,237,220,.66));
}

body.theme-paper #editor,
body.theme-warm #editor{
  color:var(--text);
  caret-color:var(--accent2);
}
body.theme-paper #editor::placeholder,
body.theme-warm #editor::placeholder{color:var(--text3)}
body.theme-paper #editor::selection{background:rgba(109,93,252,.18)}
body.theme-warm #editor::selection{background:rgba(183,121,31,.20)}

body.theme-paper #editor-backdrop mark{
  background:rgba(109,93,252,.18);
  box-shadow:0 0 0 1px rgba(109,93,252,.08);
}
body.theme-warm #editor-backdrop mark{
  background:rgba(183,121,31,.18);
  box-shadow:0 0 0 1px rgba(183,121,31,.08);
}
body.theme-paper #editor-backdrop mark.active,
body.theme-warm #editor-backdrop mark.active{
  background:rgba(235,176,91,.42);
  box-shadow:0 0 0 1px rgba(183,121,31,.16);
}

body.theme-paper .tool-group,
body.theme-paper .title-btn,
body.theme-paper #filename-display,
body.theme-paper .sr-input,
body.theme-paper .sr-nav-btn,
body.theme-paper .sr-action-btn,
body.theme-warm .tool-group,
body.theme-warm .title-btn,
body.theme-warm #filename-display,
body.theme-warm .sr-input,
body.theme-warm .sr-nav-btn,
body.theme-warm .sr-action-btn{
  background:linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.44));
  border-color:var(--border);
  color:var(--text2);
  box-shadow:var(--glow);
}
body.theme-warm .tool-group,
body.theme-warm .title-btn,
body.theme-warm #filename-display,
body.theme-warm .sr-input,
body.theme-warm .sr-nav-btn,
body.theme-warm .sr-action-btn{
  background:linear-gradient(180deg, rgba(255,248,236,.82), rgba(247,237,220,.50));
}
body.theme-paper .title-btn:hover,
body.theme-paper .tool-btn:hover,
body.theme-paper .sr-nav-btn:hover,
body.theme-paper .sr-action-btn:hover,
body.theme-warm .title-btn:hover,
body.theme-warm .tool-btn:hover,
body.theme-warm .sr-nav-btn:hover,
body.theme-warm .sr-action-btn:hover{
  background:var(--surface3);
  color:var(--text);
  box-shadow:var(--shadow-md), var(--glow);
}
body.theme-paper .title-btn.primary{
  background:linear-gradient(180deg, #eef2ff, #e8ebff);
  color:var(--accent2);
  border-color:rgba(109,93,252,.24);
  box-shadow:0 8px 18px rgba(109,93,252,.10), var(--glow);
}
body.theme-warm .title-btn.primary{
  background:linear-gradient(180deg, #fff1d6, #f3dfbd);
  color:var(--accent2);
  border-color:rgba(183,121,31,.26);
  box-shadow:0 8px 18px rgba(183,121,31,.10), var(--glow);
}

body.theme-paper .title-btn.active,
body.theme-warm .title-btn.active {
  background: linear-gradient(180deg, rgba(109,93,252,.18), rgba(109,93,252,.07));
  border-color: rgba(109,93,252,.42);
  color: var(--accent2);
  box-shadow:
    inset 0 2px 7px rgba(30,41,59,.12),
    0 0 0 1px rgba(109,93,252,.10) inset;
  transform: translateY(1px);
}

body.theme-paper .title-btn.primary.active,
body.theme-warm .title-btn.primary.active {
  background: linear-gradient(180deg, rgba(21,128,61,.16), rgba(21,128,61,.06));
  border-color: rgba(21,128,61,.38);
  color: var(--success);
  box-shadow:
    inset 0 2px 7px rgba(30,41,59,.12),
    0 0 0 1px rgba(21,128,61,.10) inset;
  transform: translateY(1px);
}

body.theme-paper .menu-trigger,
body.theme-paper .menu-entry,
body.theme-paper .tool-btn,
body.theme-warm .menu-trigger,
body.theme-warm .menu-entry,
body.theme-warm .tool-btn{color:var(--text2)}
body.theme-paper .menu-trigger:hover,
body.theme-paper .menu-trigger.open,
body.theme-paper .menu-entry:hover,
body.theme-paper .tool-btn:hover,
body.theme-warm .menu-trigger:hover,
body.theme-warm .menu-trigger.open,
body.theme-warm .menu-entry:hover,
body.theme-warm .tool-btn:hover{
  color:var(--text);
  background:var(--accent-dim);
}
body.theme-paper .menu-entry.active,
body.theme-paper .tool-btn.heading,
body.theme-paper #app-name,
body.theme-warm .menu-entry.active,
body.theme-warm .tool-btn.heading,
body.theme-warm #app-name{color:var(--accent2)}

body.theme-paper #preview-wrap,
body.theme-warm #preview-wrap{
  background:var(--surface);
  border-left-color:var(--border);
  box-shadow:inset 1px 0 0 rgba(0,0,0,.03);
}
body.theme-paper #preview,
body.theme-warm #preview{
  color:var(--text);
}
body.theme-paper #preview h1,
body.theme-paper #preview h2,
body.theme-paper #preview h3,
body.theme-paper #preview h4,
body.theme-paper #preview h5,
body.theme-paper #preview h6,
body.theme-warm #preview h1,
body.theme-warm #preview h2,
body.theme-warm #preview h3,
body.theme-warm #preview h4,
body.theme-warm #preview h5,
body.theme-warm #preview h6{color:var(--text)}
body.theme-paper #preview h3,
body.theme-warm #preview h3{color:var(--accent2)}
body.theme-paper #preview h1,
body.theme-paper #preview h2,
body.theme-warm #preview h1,
body.theme-warm #preview h2{border-bottom-color:var(--border)}
body.theme-paper #preview code,
body.theme-warm #preview code{
  background:rgba(15,23,42,.045);
  border-color:var(--border);
  color:var(--accent2);
}
body.theme-warm #preview code{background:rgba(92,64,38,.06)}
body.theme-paper #preview pre,
body.theme-warm #preview pre{
  background:linear-gradient(180deg, rgba(255,255,255,.76), rgba(255,255,255,.42));
  border-color:var(--border);
}
body.theme-warm #preview pre{
  background:linear-gradient(180deg, rgba(255,248,236,.76), rgba(247,237,220,.46));
}
body.theme-paper #preview blockquote,
body.theme-warm #preview blockquote{
  border-left-color:var(--accent);
  background:var(--accent-dim);
  color:var(--text2);
}
body.theme-paper #preview table,
body.theme-warm #preview table{border-color:var(--border)}
body.theme-paper #preview th,
body.theme-warm #preview th{
  background:var(--surface2);
  color:var(--accent2);
}
body.theme-paper #preview th,
body.theme-paper #preview td,
body.theme-warm #preview th,
body.theme-warm #preview td{border-bottom-color:var(--border)}

body.theme-warm #preview{
  font-size:15.5px;
  line-height:2.0;
}
body.theme-warm #preview li.task-done-item,
body.theme-paper #preview li.task-done-item{color:var(--text2)}

body.theme-paper #toast,
body.theme-warm #toast{
  background:linear-gradient(180deg, var(--surface), var(--surface2));
  border-color:var(--border);
  color:var(--text);
}

body.theme-paper #preview-focus-exit-btn,
body.theme-warm #preview-focus-exit-btn{
  background:linear-gradient(180deg, var(--surface3), var(--surface2));
  border-color:var(--border2);
  color:var(--text);
  box-shadow:var(--shadow-md), var(--glow);
}
body.theme-paper #preview-focus-exit-btn:hover,
body.theme-warm #preview-focus-exit-btn:hover{
  background:linear-gradient(180deg, var(--accent-dim), var(--surface3));
  border-color:var(--accent2);
  color:var(--accent2);
}
body.theme-paper #preview-focus-exit-btn:focus-visible,
body.theme-warm #preview-focus-exit-btn:focus-visible{
  outline:3px solid var(--accent2);
  outline-offset:3px;
  background:linear-gradient(180deg, var(--surface3), var(--surface2));
  border-color:var(--accent2);
  color:var(--text);
}

/* #endregion */

/* #region [CSS-13] RESPONSIVE & PRINT STYLES */
body.ipad-safari-fullscreen #menubar {
  padding-left: max(
    128px,
    calc(env(safe-area-inset-left, 0px) + 112px)
  );
}

@media (max-width: 1024px) {
  #menubar { height: 44px; padding: 0 10px; }
  #update-indicator{min-width:44px;padding:0 10px;font-size:16px}
  .menu-trigger { padding: 0 16px; font-size: 14px; }
  .menu-entry { padding: 12px 16px; font-size: 15px; }
  .menu-shortcut { font-size: 13px; }
  #titlebar { height: 60px; }
  .title-btn { padding: 10px 14px; font-size: 13px; }
  #toolbar { height: 50px; }
  .tool-btn { padding: 8px 12px; font-size: 14px; }
}
@media (max-width:980px){
  #titlebar{padding:0 10px;gap:8px}
  #filename-display{min-width:140px;max-width:none}
  .title-actions{gap:6px}
  .title-btn{padding:6px 8px;font-size:11px}
  #sr-panel{right:10px;left:10px;width:auto}
  #preview{padding:28px}
}
@media (max-width:760px){
  #app-name{display:none}
  .save-state{display:none}
  #toolbar{height:42px}
  #preview-wrap.open{width:100%!important;min-width:0}
  #main-container.preview-on #splitter{display:none}
  #outline-panel{right:10px; left:10px; width:auto; max-height:40vh;}
}
@media print{
  html,body{
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    overflow:visible!important;
    background:#fff!important;
  }
  #menubar,#titlebar,#toolbar,#statusbar,#editor-wrap,#splitter,#spell-panel,#toast,#sr-panel,#outline-panel,#history-modal,#rn-modal,#doc-modal,#update-modal,#export-modal,#print-modal{display:none!important}
  body{display:block!important;color:#000!important}
  #main-container{
    display:block!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    overflow:visible!important
  }
  #preview-wrap{
    display:block!important;
    width:auto!important;
    min-width:0!important;
    max-width:none!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    overflow:visible!important;
    position:static!important;
    border:none!important;
    background:#fff!important;
    box-shadow:none!important
  }
  #preview{
    display:block!important;
    width:auto!important;
    max-width:none!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    overflow:visible!important;
    padding:0!important;
    color:#000!important;
    background:#fff!important
  }
  #preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6,#preview p,#preview li,#preview strong{color:black!important}
  #preview em{color:#333!important}
  #preview code{border:1px solid #ccc!important;color:black!important;background:transparent!important}
  #preview pre{border:1px solid #ccc!important;background:transparent!important;page-break-inside:avoid}
  #preview blockquote{border-left-color:#999!important;background:transparent!important;color:#444!important}
  #preview table{width:100%!important;border-collapse:collapse!important}
  #preview th{background:#f0f0f0!important;color:black!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h1,h2,h3{page-break-after:avoid}
  img{max-width:100%!important;page-break-inside:avoid}
}

#preview-wrap{position:relative}
#fullscreen-toggle-title-btn{font-size:16px;line-height:1}
body.preview-focus-mode #editor-wrap,body.preview-focus-mode #splitter{display:none!important}
body.preview-focus-mode #preview-wrap{width:auto!important;min-width:0!important;max-width:none!important;flex:1 1 auto;overflow-y:auto}
body.preview-focus-mode #preview{max-width:960px}
#preview-focus-exit-btn{
  position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));margin:0;
  z-index:160;min-width:44px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);
  background:rgba(20,24,34,.86);color:var(--text);cursor:pointer;backdrop-filter:blur(12px);box-shadow:var(--shadow-lg);display:none;align-items:center;gap:8px;
}
body.preview-focus-mode #preview-focus-exit-btn{display:flex}
@media (max-width:760px){body.preview-focus-mode #preview{padding:28px}#preview-focus-exit-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
@media print{#preview-focus-exit-btn{display:none!important}}

/* Zen Mode (Focus Mode) */
body.zen-mode #menubar, body.zen-mode #titlebar, body.zen-mode #toolbar, body.zen-mode #statusbar, body.zen-mode #splitter, body.zen-mode #preview-wrap { display: none !important; }
body.zen-mode #main-container { height: 100vh; }
body.zen-mode #editor-wrap { max-width: 840px; margin: 0 auto; border-left: 1px solid rgba(255,255,255,.05); border-right: 1px solid rgba(255,255,255,.05); }

#zen-exit-btn {
  position: fixed; top: 24px; right: 24px; width: 48px; height: 48px; border-radius: 24px;
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.1); color: var(--text2); font-size: 18px; z-index: 9999;
  cursor: pointer; backdrop-filter: blur(12px); box-shadow: var(--shadow-lg), var(--glow);
  display: none; align-items: center; justify-content: center; transition: all 0.2s ease;
}
#zen-exit-btn:hover, #zen-exit-btn:active {
  color: var(--text); background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); transform: scale(1.05);
}
body.zen-mode #zen-exit-btn { display: flex; }
/* #endregion */

<body>

<div id="global-loader">
  <div class="loader-spinner"></div>
  <div class="loader-text" id="loader-msg">Loading...</div>
</div>
<div id="menubar">
  <div class="menu-item">
    <button class="menu-trigger" data-menu="file" id="t-file"></button>
    <div class="menu-dropdown" id="dd-file">
      <div class="menu-entry" onclick="newFile()">
        <span id="m-new"></span><span class="menu-shortcut">Ctrl+N</span>
      </div>
      <div class="menu-entry" onclick="handleOpen()">
        <span id="m-open"></span><span class="menu-shortcut">Ctrl+O</span>
      </div>
      <div class="menu-entry" onclick="triggerWordImport()">
        <span id="m-open-word"></span>
      </div>
      <div class="menu-sep-line"></div>
      <div class="menu-entry" onclick="handleSave(false)">
        <span id="m-save"></span><span class="menu-shortcut">Ctrl+S</span>
      </div>
      <div class="menu-entry" id="menu-save-as" onclick="handleSave(true)">
        <span id="m-save-as"></span><span class="menu-shortcut">Ctrl+Shift+S</span>
      </div>
      <div class="menu-sep-line"></div>
      <div class="menu-entry" id="menu-export" tabindex="0" onclick="openExportModal()">
        <span id="m-export"></span>
      </div>
      <div class="menu-entry" onclick="openPrintModal()">
        <span id="m-print-modal"></span>
      </div>
      <div class="menu-sep-line"></div>
      
      <div class="menu-section-label">Storage Security</div>
      <div class="menu-entry" id="private-entry" onclick="togglePrivateStorage()">
        <span>Private Storage</span><span class="menu-check" id="private-check">✓</span>
      </div>
      <div class="menu-entry" onclick="clearProtectedStorage()">
        <span id="m-clear-local-data" style="color:var(--danger)"></span>
      </div>
      <div class="menu-sep-line"></div>

      <div class="menu-entry" onclick="openHistory()">
        <span id="m-history"></span>
      </div>
      <div class="menu-sep-line"></div>
      <div class="menu-entry" onclick="closeFile()">
        <span id="m-close"></span>
      </div>
    </div>
  </div>

  <div class="menu-item">
    <button class="menu-trigger" data-menu="edit" id="t-edit"></button>

## Quick Start

MD//WORKS は、1つのHTMLで動くMarkdownエディタです。下書き、プレビュー、保存、スタンドアロン書き出しを同じ画面で行えます。

### 1. 書き始める
* 中央のエディタにMarkdownを入力します。
* 見出し、リスト、引用、コード、表はツールバーからも挿入できます。
* 画像は小さなローカル画像をドラッグ＆ドロップできます。

### 2. プレビューする
* **View > Preview** またはタイトルバーの **Preview** で表示を切り替えます。
* Markdownは安全のためサニタイズされたHTMLとして表示されます。

### 3. 保存する
* **File > Save** でMarkdownファイルとして保存します。
* **File > Export as App** で、現在の原稿を含んだスタンドアロンHTMLを書き出せます。
* Auto encrypted では、ローカルの下書きと履歴を平文のまま保存しないようにします。
* **Private Storage** を使うと、ローカルの下書きと履歴にパスフレーズによる追加保護をかけられます。

### 4. 探す・整える
* **Edit > Find** / **Replace** で検索と置換を行います。
* **Edit > Format Markdown** で余分な空行や行末スペースを整えます。

### 5. オフラインで使う
* スタンドアロンHTMLはネットワークがなくても開けます。
* このヘルプ本文はアプリ内に埋め込まれているため、外部ドキュメントの取得は行いません。

## Quick Start

MD//WORKS is a single-file Markdown editor for drafting, previewing, saving, and exporting standalone documents.

### 1. Start writing
* Type Markdown in the central editor.
* Use the toolbar to insert headings, lists, quotes, code blocks, links, tables, and rules.
* Drop small local images into the editor when you want embedded assets.

### 2. Preview safely
* Toggle **View > Preview** or the title-bar **Preview** button.
* Markdown is rendered as sanitized HTML before it is shown.

### 3. Save your work
* Use **File > Save** to save a Markdown file.
* Use **File > Export as App** to export a standalone HTML file containing the current draft and editor.
* **Auto encrypted** helps avoid storing local drafts and history as plain text.
* Enable **Private Storage** when you want passphrase-based protection for local drafts and history.

### 4. Find and tidy
* Use **Edit > Find** / **Replace** for search and replacement.
* Use **Edit > Format Markdown** to clean excess blank lines and trailing spaces.

### 5. Work offline
* Standalone HTML exports can open without a network connection.
* This help content is embedded in the app and never fetched from an external document.

## Keyboard Shortcuts

### File
* **Ctrl+N**: 新規作成
* **Ctrl+O**: 開く
* **Ctrl+S**: 保存
* **Ctrl+Shift+S**: 名前を付けて保存

### Edit
* **Ctrl+Z**: 元に戻す
* **Ctrl+Y**: やり直し
* **Ctrl+X**: 切り取り
* **Ctrl+C**: コピー
* **Ctrl+V**: 貼り付け
* **Ctrl+A**: エディタの内容をすべて選択
* **Ctrl+F**: 検索
* **Ctrl+H**: 置換

### Tab操作
* **Tab**: カーソル位置にタブを挿入。範囲選択中は選択行をインデント
* **Shift+Tab**: 現在行または選択行をアウトデント

### 文書内の移動
* **Home / End**: 行頭 / 行末へ移動
* **Ctrl+Home / Ctrl+End**: 文書の先頭 / 末尾へ移動
* **Page Up / Page Down**: 画面単位で上下に移動

### テキスト選択

function canRunEditorCommand() {

function guardEditorCommand() {
  if (canRunEditorCommand()) return true;
  closeMenus();
  return false;

function isPreviewFocusAllowedCommand(command) {
  return PREVIEW_FOCUS_ALLOWED_COMMANDS.has(command);
}

function getPreviewFocusElementCommand(el) {
  if (!el) return '';
  if (el.dataset.previewFocusCommand) return el.dataset.previewFocusCommand;
  if (el.id === 'open-btn' || el.querySelector?.('#m-open')) return 'open';
  if (el.id === 'save-btn' || el.querySelector?.('#m-save')) return 'save';
  if (el.id === 'preview-toggle-btn' || el.id === 'm-preview-entry') return 'preview';
  if (el.id === 'fullscreen-toggle-title-btn' || el.id === 'm-fullscreen-entry') return 'fullscreen';
  if (el.id === 'm-outline-entry' || el.id === 'outline-close') return 'outline';
  if (el.id === 'preview-focus-exit-btn') return 'return-to-editor';
  return '';
}

function setPreviewFocusDisabledState(el, disabled) {
  if (!el || isPreviewFocusAllowedCommand(getPreviewFocusElementCommand(el))) return;
  el.classList.toggle(PREVIEW_FOCUS_COMMAND_DISABLED_CLASS, disabled);
  el.setAttribute('aria-disabled', disabled ? 'true' : 'false');
  if (disabled) {
    if (!el.dataset.previewFocusTabindex && el.hasAttribute('tabindex')) {
      el.dataset.previewFocusTabindex = el.getAttribute('tabindex');
    }
    if (!/^(BUTTON|INPUT|SELECT|TEXTAREA)$/i.test(el.tagName)) el.setAttribute('tabindex', '-1');
    if ('disabled' in el) el.disabled = true;
  } else {
    if (el.dataset.previewFocusTabindex) {
      el.setAttribute('tabindex', el.dataset.previewFocusTabindex);
      delete el.dataset.previewFocusTabindex;
    } else if (!/^(BUTTON|INPUT|SELECT|TEXTAREA)$/i.test(el.tagName)) {
      el.removeAttribute('tabindex');
    }
    if ('disabled' in el) el.disabled = false;
  }
}

function getPreviewFocusCommandElements() {
  return Array.from(document.querySelectorAll('#toolbar button, #spell-toggle-title-btn, .menu-entry, #filename-display'));

}

}

function isPreviewFocusDisabledElement(target) {
  if (!previewFocusOpen || !(target instanceof Element)) return false;
  const commandEl = target.closest(`.${PREVIEW_FOCUS_COMMAND_DISABLED_CLASS}`);
  return Boolean(commandEl && !isPreviewFocusAllowedCommand(getPreviewFocusElementCommand(commandEl)));
}

document.addEventListener('click', e => {

function restorePreviewFocusScrolls(snapshot) {
  if (!snapshot) return;
  suppressPreviewScrollSync = true;
  previewWrap.scrollTop = snapshot.previewScrollTop;
  previewWrap.scrollLeft = snapshot.previewScrollLeft;
  editor.scrollTop = snapshot.editorScrollTop;
  editor.scrollLeft = snapshot.editorScrollLeft;
  backdrop.scrollTop = editor.scrollTop;
  backdrop.scrollLeft = editor.scrollLeft;
  requestAnimationFrame(() => { suppressPreviewScrollSync = false; });
}

function enterPreviewFocusMode() {
  closeMenus();
  if (previewFocusOpen) return;

  const wasPreviewOpen = previewOpen;
  if (!previewSessionActive) beginPreviewSession();
  previewFocusSnapshot = {
    wasPreviewOpen,
    previewWidth: previewWrap.style.width,
    previewScrollTop: previewWrap.scrollTop,
    previewScrollLeft: previewWrap.scrollLeft,
    editorSelectionStart: editor.selectionStart,
    editorSelectionEnd: editor.selectionEnd,
    editorSelectionDirection: editor.selectionDirection,
    editorScrollTop: editor.scrollTop,
    editorScrollLeft: editor.scrollLeft,
    wasZen: wasZenBeforePreviewSession,
    activeElement: document.activeElement
  };

  isPreviewFocusTransitioning = true;
  suppressPreviewScrollSync = true;
  if (!previewOpen) {
    previewOpen = true;
    renderPreviewState();
    renderPreview(true);
  }

  previewFocusOpen = true;
  const transitionToken = ++previewFocusTransitionToken;
  renderPreviewFocusState();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (transitionToken !== previewFocusTransitionToken || !previewFocusOpen) return;
    restorePreviewFocusScrolls(previewFocusSnapshot);
    const exitBtn = document.getElementById('preview-focus-exit-btn');
    if (exitBtn) exitBtn.focus({ preventScroll: true });
    isPreviewFocusTransitioning = false;
    suppressPreviewScrollSync = false;
  }));
}

function exitPreviewFocusMode(options = {}) {
  const { restoreZen = true, closePreview = true } = options;
  const snapshot = previewFocusSnapshot;
  const transitionToken = ++previewFocusTransitionToken;

  if (!previewFocusOpen && !snapshot && !isPreviewFocusTransitioning) {
    previewFocusOpen = false;
    previewFocusSnapshot = null;
    isPreviewFocusTransitioning = false;
    suppressPreviewScrollSync = false;
    renderPreviewFocusState();
    return Promise.resolve();
  }

  isPreviewFocusTransitioning = true;
  suppressPreviewScrollSync = true;
  previewFocusOpen = false;
  renderPreviewFocusState();

  return new Promise((resolve) => {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (transitionToken === previewFocusTransitionToken) {
        if (snapshot) {
          previewWrap.scrollTop = snapshot.previewScrollTop;
          previewWrap.scrollLeft = snapshot.previewScrollLeft;
          editor.focus({ preventScroll: true });
          editor.setSelectionRange(snapshot.editorSelectionStart, snapshot.editorSelectionEnd, snapshot.editorSelectionDirection || 'none');
          editor.scrollTop = snapshot.editorScrollTop;
          editor.scrollLeft = snapshot.editorScrollLeft;
          backdrop.scrollTop = editor.scrollTop;
          backdrop.scrollLeft = editor.scrollLeft;
        } else {
          editor.focus({ preventScroll: true });
        }
        if (closePreview) {
          previewOpen = false;
          isPreviewActive = false;
          previewWrap.style.width = '';
        } else {
          previewOpen = true;
          previewWrap.style.width = snapshot?.previewWidth || '';
        }
        renderPreviewState();
        if (restoreZen && snapshot?.wasZen) setZenMode(true);
        refreshCommandStateAfterPreviewFocus();
        previewFocusSnapshot = null;
        isPreviewFocusTransitioning = false;
        suppressPreviewScrollSync = false;
        scheduleViewportRefresh('preview-focus-exit');
      }
      resolve();
    }));
  });
}

function beginPreviewSession() {
  if (previewSessionActive) return;
  previewSessionActive = true;
  wasZenBeforePreviewSession = isZenModeActive();

function clearPreviewSession() {
  previewSessionActive = false;
  wasZenBeforePreviewSession = false;
}

function finishPreviewSession({ restoreZen = true } = {}) {
  const shouldRestoreZen = restoreZen && previewSessionActive && wasZenBeforePreviewSession;

}

function createFootnoteMarker() {
  const bytes = new Uint8Array(8);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
  return 'mdw-fn-marker-' + Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}

function createFootnoteState() {
  return {
    marker: createFootnoteMarker(),
    definitions: new Map(),
    numberByLabel: new Map(),
    orderedLabels: [],
    referenceCount: new Map(),
    inFootnoteContent: false
  };
}

function parseFootnoteDefinitionBlock(src) {
  const firstLineMatch = String(src || '').match(/^(\[\^([^\]\r\n]+)\]:[ \t]?([^\r\n]*))(?:\r?\n|$)/u);
  if (!firstLineMatch) return null;
  const normalizedLabel = normalizeFootnoteLabel(firstLineMatch[2]);
  if (!normalizedLabel) return null;

  const lines = String(src || '').split(/(\r?\n)/);
  let raw = firstLineMatch[0];
  const bodyLines = [firstLineMatch[3] || ''];
  let index = firstLineMatch[0].endsWith('\n') ? 2 : 1;
  let pendingBlank = [];

  while (index < lines.length) {
    const line = lines[index] || '';
    const eol = lines[index + 1] || '';
    if (line === '' && !eol) break;
    if (/^[ \t]*$/.test(line)) {
      pendingBlank.push('');
      raw += line + eol;
      index += 2;
      continue;
    }
    if (/^(?: {4}|\t)/.test(line)) {
      bodyLines.push(...pendingBlank);
      pendingBlank = [];
      bodyLines.push(line.replace(/^(?: {4}|\t)/, ''));
      raw += line + eol;
      index += 2;
      continue;
    }
    break;
  }
  return { raw, label: normalizedLabel, text: bodyLines.join('\n').replace(/\n+$/g, '') };
}

function collectFootnoteDefinition(state, label, text) {
  if (!state || !label) return;
  if (state.definitions.has(label)) {
    console.warn('Duplicate footnote definition ignored:', label);
    return;
  }
  state.definitions.set(label, text || '');
}

function ensureFootnoteNumber(state, label) {
  if (!state.numberByLabel.has(label)) {
    state.numberByLabel.set(label, state.orderedLabels.length + 1);
    state.orderedLabels.push(label);
    state.referenceCount.set(label, 0);
  }
  const count = (state.referenceCount.get(label) || 0) + 1;
  state.referenceCount.set(label, count);
  return { number: state.numberByLabel.get(label), count };
}

function escapeFootnoteAttr(value) {
  return String(value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderFootnotesHtml(state) {
  if (!state || !state.orderedLabels.length || !mdworksMarked) return '';
  const marker = escapeFootnoteAttr(state.marker);
  let items = '';
  state.inFootnoteContent = true;
  try {
    state.orderedLabels.forEach((label) => {
      const number = state.numberByLabel.get(label);
      const text = state.definitions.get(label) || '';
      let content = mdworksMarked.parse(text || '');
      if (!/^\s*<p[\s>]/i.test(content)) content = `<p>${content}</p>`;
      const refs = state.referenceCount.get(label) || 1;
      const backrefs = Array.from({ length: refs }, (_, i) => `<a class="mdw-footnote-backref ${marker} mdw-footnote-backref-${number}-${i + 1}" href="#">↩</a>`).join(' ');
      content = content.replace(/<\/p>\s*$/i, ` ${backrefs}</p>`);
      items += `<li class="mdw-footnote-item ${marker} mdw-footnote-item-${number}">${content}</li>`;
    });
  } finally {
    state.inFootnoteContent = false;
  }
  return `<hr class="mdw-footnotes-separator ${marker}">\n<ol class="mdw-footnotes ${marker}">\n${items}</ol>`;
}


function collectFootnoteDefinitionsBeforeRender(markdownText, state) {
  const source = String(markdownText || '');
  const lines = source.split(/(\r?\n)/);
  let index = 0;
  let charOffset = 0;
  let fence = null;
  while (index < lines.length) {
    const line = lines[index] || '';
    const eol = lines[index + 1] || '';
    const candidate = line.replace(/^ {0,3}(?:> ?)* {0,3}/, '');
    const marker = candidate.match(/^(`{3,}|~{3,})/);
    if (fence) {
      if (marker && marker[1][0] === fence.char && marker[1].length >= fence.length && candidate.slice(marker[1].length).trim() === '') fence = null;
      charOffset += line.length + eol.length;
      index += 2;
      continue;
    }
    if (marker) {
      fence = { char: marker[1][0], length: marker[1].length };
      charOffset += line.length + eol.length;
      index += 2;
      continue;
    }
    const remaining = source.slice(charOffset);
    const parsed = parseFootnoteDefinitionBlock(remaining);
    if (parsed) {
      collectFootnoteDefinition(state, parsed.label, parsed.text);
      const consumedParts = parsed.raw.split(/(\r?\n)/);
      const consumed = consumedParts[consumedParts.length - 1] === '' ? consumedParts.length - 1 : consumedParts.length;
      charOffset += parsed.raw.length;
      index += Math.max(1, consumed);
      continue;
    }
    charOffset += line.length + eol.length;
    index += 2;
  }
}

function findMdwScriptDelimiter(src, delimiter) {
  for (let i = 1; i < src.length; i += 1) {
    const ch = src[i];
    if (ch === '\n' || ch === '\r') return -1;
    if (ch !== delimiter) continue;
    if (src[i - 1] === '\\') continue;
    if (delimiter === '~' && src[i + 1] === '~') continue;
    return i;
  }
  return -1;
}

function decodeMdwScriptText(text) {
  return String(text || '').replace(/\\ /g, ' ');
}

function createMdwScriptTokenizer(name, delimiter, tagName) {
  return {
    name,
    level: 'inline',
    start(src) {
      for (let i = 0; i < src.length; i += 1) {
        if (src[i] !== delimiter) continue;
        if (i > 0 && src[i - 1] === '\\') continue;
        if (delimiter === '~' && (src[i + 1] === '~' || src[i - 1] === '~')) continue;
        if (delimiter === '^' && src[i + 1] === '[') continue;
        return i;
      }
      return undefined;
    },
    tokenizer(src) {
      if (!src || src[0] !== delimiter) return false;
      if (src[1] === delimiter) return false;
      if (delimiter === '~' && src[1] === '~') return false;
      if (delimiter === '^' && src[1] === '[') return false;
      const end = findMdwScriptDelimiter(src, delimiter);
      if (end <= 1) return false;
      if (delimiter === '~' && src[end + 1] === '~') return false;
      const text = src.slice(1, end);
      if (!text || /[\r\n]/.test(text)) return false;
      if (/(^|[^\\])[ \t]/.test(text)) return false;
      return { type: name, raw: src.slice(0, end + 1), text: decodeMdwScriptText(text) };
    },
    renderer(token) {
      return `<${tagName}>${escapeHtml(token.text)}</${tagName}>`;
    }
  };
}

function initializeMarkdownRenderer() {
  if (!window.marked || mdworksMarked) return;
  const scriptExtension = {
    extensions: [
      createMdwScriptTokenizer('mdwSuperscript', '^', 'sup'),
      createMdwScriptTokenizer('mdwSubscript', '~', 'sub')
    ]
  };
  const footnoteExtension = {
    extensions: [
      {
        name: 'mdwFootnoteDefinition',
        level: 'block',
        start(src) { const match = src.match(/^\[\^[^\]\r\n]+\]:/um); return match ? match.index : undefined; },
        tokenizer(src) {
          const parsed = parseFootnoteDefinitionBlock(src);
          if (!parsed) return false;
          if (mdworksFootnoteState && !mdworksFootnoteState.definitions.has(parsed.label)) collectFootnoteDefinition(mdworksFootnoteState, parsed.label, parsed.text);
          return { type: 'mdwFootnoteDefinition', raw: parsed.raw, label: parsed.label, text: parsed.text };
        },
        renderer() { return ''; }
      },
      {
        name: 'mdwFootnoteReference',
        level: 'inline',
        start(src) { return src.indexOf('[^'); },
        tokenizer(src) {
          const match = src.match(/^\[\^([^\]\r\n]+)\]/u);
          if (!match) return false;
          const label = normalizeFootnoteLabel(match[1]);
          if (!label || !mdworksFootnoteState || mdworksFootnoteState.inFootnoteContent || !mdworksFootnoteState.definitions.has(label)) return false;
          const ref = ensureFootnoteNumber(mdworksFootnoteState, label);
          return { type: 'mdwFootnoteReference', raw: match[0], text: String(ref.number), number: ref.number, refIndex: ref.count };
        },
        renderer(token) {
          const marker = escapeFootnoteAttr(mdworksFootnoteState?.marker || '');
          return `<sup class="mdw-footnote-ref ${marker} mdw-footnote-ref-${token.number}-${token.refIndex}"><a class="mdw-footnote-ref-link ${marker}" href="#">${token.text}</a></sup>`;
        }
      }
    ]
  };
  const MarkedCtor = marked.Marked || window.marked.Marked;
  mdworksMarked = MarkedCtor ? new MarkedCtor({ gfm: true, breaks: true }, scriptExtension, footnoteExtension) : marked.use({ gfm: true, breaks: true }, scriptExtension, footnoteExtension);
}
initializeMarkdownRenderer();

function isSafeLocalOrDataImage(src) {
  if (!src) return false;
  const value = String(src).trim();
  if (/^data:image\/(png|gif|jpeg|jpg|webp);base64,/i.test(value)) return true;
  if (/^(?:\.\.?\/|\/|#|\?)/.test(value)) return true;
  return !/^[a-z][a-z0-9+.-]*:/i.test(value);
}

function getSafeLocalVideoInfo(src) {
  const value = String(src || '').trim();
  if (!value) return null;
  if (/[\u0000-\u001F\u007F]/.test(value)) return null;
  if (/^[a-z][a-z0-9+.-]*:/i.test(value)) return null;
  if (value.startsWith('//') || value.startsWith('/') || value.startsWith('\\')) return null;

  const pathPart = value.split(/[?#]/, 1)[0];
  let decodedPath;
  try {
    decodedPath = decodeURIComponent(pathPart);
  } catch (e) {
    return null;
  }

  const normalizedPath = decodedPath.replace(/\\/g, '/');
  const segments = normalizedPath.split('/');
  if (segments.some(segment => segment === '..')) return null;

  const match = normalizedPath.match(/\.(mp4|webm)$/i);
  if (!match) return null;

  const extension = match[1].toLowerCase();
  return {
    src: value,
    extension,
    mime: extension === 'mp4' ? 'video/mp4' : 'video/webm'
  };
}

function setupDOMPurifyHooks() {
  if (!window.DOMPurify || window.__mdworksPurifyHooksReady) return;
  window.__mdworksPurifyHooksReady = true;
  DOMPurify.addHook('afterSanitizeAttributes', (node) => {
    if (!node || !node.tagName) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'a') {
      const href = node.getAttribute('href') || '';
      if (/^javascript:/i.test(href)) node.removeAttribute('href');
      if (node.hasAttribute('href') && href.startsWith('#')) {
        node.removeAttribute('target');
        node.removeAttribute('rel');
      } else if (node.hasAttribute('href')) {
        node.setAttribute('target', '_blank');
        node.setAttribute('rel', 'noopener noreferrer nofollow');
      }
    }
    if (tag === 'img') {
      const src = node.getAttribute('src') || '';
      if (!isSafeLocalOrDataImage(src)) node.removeAttribute('src');
      node.removeAttribute('srcset');
      node.removeAttribute('loading');
    }
    if (tag === 'video') {
      Array.from(node.attributes).forEach(attr => {
        if (!['src', 'controls', 'class'].includes(attr.name.toLowerCase())) node.removeAttribute(attr.name);
      });
      node.removeAttribute('autoplay');
      const src = node.getAttribute('src');
      if (src && !getSafeLocalVideoInfo(src)) node.removeAttribute('src');
    }
    if (tag === 'source') {
      const parentTag = node.parentElement?.tagName?.toLowerCase();
      if (parentTag !== 'video') {
        node.remove();
        return;
      }
      Array.from(node.attributes).forEach(attr => {
        if (!['src', 'type'].includes(attr.name.toLowerCase())) node.removeAttribute(attr.name);
      });
      const info = getSafeLocalVideoInfo(node.getAttribute('src') || '');
      if (!info) {
        node.remove();
        return;
      }
      const declaredType = (node.getAttribute('type') || '').trim().toLowerCase();
      if (declaredType && declaredType !== info.mime) node.setAttribute('type', info.mime);
    }
    if (tag === 'input') {
      if ((node.getAttribute('type') || '').toLowerCase() !== 'checkbox') {
        node.remove(); return;
      }
      node.setAttribute('disabled', 'disabled');
    }
  });
}

function sanitizeHtml(html, config = MARKDOWN_SANITIZE_CONFIG) {
  if (!window.DOMPurify) return '';
  setupDOMPurifyHooks();
  return DOMPurify.sanitize(String(html || ''), config);
}
function getHeadingTextWithoutFootnotes(heading) {
  const clone = heading.cloneNode(true);
  clone.querySelectorAll('.mdw-footnote-ref').forEach(node => node.remove());
  return (clone.textContent || '').trim();
}

function decorateSanitizedMarkdownHtml(html, footnoteState) {
  const template = document.createElement('template');
  template.innerHTML = String(html || '');
  const marker = footnoteState?.marker || '';
  const used = Object.create(null);

  if (marker) {
    template.content.querySelectorAll(`sup.mdw-footnote-ref.${marker}`).forEach(sup => {
      const classMatch = Array.from(sup.classList).join(' ').match(/(?:^| )mdw-footnote-ref-(\d+)-(\d+)(?: |$)/);
      const number = Number(classMatch?.[1]);
      const refIndex = Number(classMatch?.[2]);
      const link = sup.querySelector(`a.mdw-footnote-ref-link.${marker}`);
      if (!classMatch || !Number.isInteger(number) || number < 1 || !Number.isInteger(refIndex) || refIndex < 1 || !link) return;
      sup.id = `mdw-fnref-${number}-${refIndex}`;
      sup.setAttribute('role', 'doc-noteref');
      sup.setAttribute('aria-label', `Footnote ${number}`);
      link.setAttribute('href', `#mdw-fn-${number}`);
      link.setAttribute('aria-label', `Footnote ${number}`);
      sup.classList.remove(`mdw-footnote-ref-${number}-${refIndex}`);
    });

    template.content.querySelectorAll(`li.mdw-footnote-item.${marker}`).forEach(li => {
      const classMatch = Array.from(li.classList).join(' ').match(/(?:^| )mdw-footnote-item-(\d+)(?: |$)/);
      const number = Number(classMatch?.[1]);
      if (!classMatch || !Number.isInteger(number) || number < 1) return;
      li.id = `mdw-fn-${number}`;
      li.setAttribute('role', 'doc-endnote');
      li.classList.remove(`mdw-footnote-item-${number}`);
    });

    template.content.querySelectorAll(`a.mdw-footnote-backref.${marker}`).forEach(anchor => {
      const classMatch = Array.from(anchor.classList).join(' ').match(/(?:^| )mdw-footnote-backref-(\d+)-(\d+)(?: |$)/);
      const number = Number(classMatch?.[1]);
      const refIndex = Number(classMatch?.[2]);
      if (!classMatch || !Number.isInteger(number) || number < 1 || !Number.isInteger(refIndex) || refIndex < 1) return;
      anchor.setAttribute('href', `#mdw-fnref-${number}-${refIndex}`);
      anchor.setAttribute('aria-label', `Back to reference ${refIndex}`);
      anchor.classList.remove(`mdw-footnote-backref-${number}-${refIndex}`);
    });

    template.content.querySelectorAll(`.${marker}`).forEach(el => el.classList.remove(marker));
  }

  template.content.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(heading => {
    heading.id = slugifyHeading(getHeadingTextWithoutFootnotes(heading), used);
  });
  return template.innerHTML;
}

function addHeadingIds(html) {
  return decorateSanitizedMarkdownHtml(html, null);
}

function safeMarkdownHtml(markdownText) {
  if (!window.marked || !window.DOMPurify) return '';
  initializeMarkdownRenderer();
  mdworksFootnoteState = createFootnoteState();
  collectFootnoteDefinitionsBeforeRender(markdownText, mdworksFootnoteState);
  let rendered = '';
  try {
    rendered = mdworksMarked.parse(String(markdownText || ''));
    rendered += renderFootnotesHtml(mdworksFootnoteState);
    const sanitized = sanitizeHtml(rendered, MARKDOWN_SANITIZE_CONFIG);
    return decorateSanitizedMarkdownHtml(sanitized, mdworksFootnoteState);
  } finally {
    mdworksFootnoteState = null;
  }
}
